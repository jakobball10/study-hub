<style>
/* Layout: one centred column; three views (subjects grid → subject's quiz list → quiz card). Each subject tints the accent with its own hue. */
:root{
  --bg:#f0f3ef; --surface:#ffffff; --fg:#17201b; --muted:#5d6a62; --line:#d5ddd6;
  --good:#1d7a4c; --good-soft:#e0f2e7; --bad:#b3261e; --bad-soft:#fbe3e1;
  --acc-l:32%; --soft-l:92%; --h:155;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s9:#8a8790;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201c; --fg:#e8f0eb; --muted:#9bb0a4; --line:#2a3630;
  --good:#6fd39c; --good-soft:#163325; --bad:#ff8a80; --bad-soft:#3b1a1a; --acc-l:74%; --soft-l:20%; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#8d8a96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201c; --fg:#e8f0eb; --muted:#9bb0a4; --line:#2a3630;
  --good:#6fd39c; --good-soft:#163325; --bad:#ff8a80; --bad-soft:#3b1a1a; --acc-l:74%; --soft-l:20%; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#8d8a96; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.accent{--accent:hsl(var(--h) 58% var(--acc-l));--soft:hsl(var(--h) 60% var(--soft-l))}
h1,h2{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:40px;font-weight:800;letter-spacing:-.02em}
h2{font-size:28px;font-weight:800}
.sub{color:var(--muted);margin:0;max-width:60ch}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.back{align-self:flex-start;font:inherit;font-size:15px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0}
.back:hover{color:var(--fg)}
button:focus-visible{outline:3px solid var(--accent,var(--fg));outline-offset:2px}

/* subject grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
.subj:hover{border-color:var(--accent);transform:translateY(-2px)}
.subj .mark{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.subj .name{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.subj .meta{font-size:14px;color:var(--muted)}
.subj.empty{border-style:dashed}
.subj.empty .name{color:var(--muted)}
.overall{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.overall b{color:var(--fg);font-size:18px}

/* quiz list */
.qlist{display:flex;flex-direction:column;gap:10px}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0;padding-bottom:8px;border-bottom:2px solid var(--soft);color:var(--accent)}
.topic+.topic{margin-top:10px}
.qitem{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.qitem .info{min-width:0;flex:1 1 260px;display:flex;flex-direction:column;gap:4px}
.qitem .t{font-weight:700;font-size:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.badge.notes{background:var(--soft);color:var(--accent);border-color:transparent;font-weight:700}
.best{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:8px 14px;font-size:15px}
.btn.danger{background:var(--bad);color:var(--surface)}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:12px 16px}
.note{font-size:15px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin:0}

/* quiz */
.progress{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--accent);padding:4px 10px;border-radius:999px}
.prompt{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.letter{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--bg);color:var(--muted)}
.opt.selected{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.opt.selected .letter{background:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#checkRow{justify-content:space-between}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .letter{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.feedback{border-radius:10px;padding:14px 16px;background:var(--bg)}
.feedback strong{display:block;margin-bottom:4px}
.feedback.good strong{color:var(--good)} .feedback.bad strong{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.hintbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
.hint{font-size:15px;color:var(--muted);font-style:italic;margin:0}
.score{font-family:var(--display);font-weight:800;font-size:60px;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.review li{border-top:1px solid var(--line);padding-top:12px}
.review .q{font-weight:700;margin:0 0 4px}
.review .a{margin:0;color:var(--muted);font-size:15px}
.keys{font-size:13px;color:var(--muted);margin:0}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode-t{font-family:var(--display);font-weight:800;font-size:22px}
.mode.test .mode-t{color:var(--accent)}
.mode-d{color:var(--muted);font-size:15px}
.pill{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11px;letter-spacing:.06em;border:1px solid var(--line);color:var(--muted)}
.pill.test{background:var(--soft);color:var(--accent);border-color:transparent}
/* analytics */
.filters{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--surface);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px;vertical-align:middle}
.chip .dot{margin-right:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.seg.small button{font-size:13px;padding:4px 8px}
.custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;margin:4px 0 0}
.custom input{font:inherit;width:72px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.custom input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tl{font-size:13px;color:var(--muted)}
.tv{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
.csub{margin:0;font-size:14px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted)}
.legend:empty{display:none}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.plot{position:relative;width:100%;overflow:hidden}
.plot svg{display:block;max-width:100%}
.grid{stroke:var(--line);stroke-width:1}
.axt{fill:var(--muted);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
.mark{stroke:var(--surface);stroke-width:2}
.hit{fill:transparent;cursor:pointer;outline:none}
.hit:focus-visible{stroke:var(--fg);stroke-width:1.5}
.col{fill:var(--muted)}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--fg);color:var(--surface);font-size:13px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:230px;font-variant-numeric:tabular-nums}
.bars{position:relative;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;align-items:center;gap:10px;font-size:14px}
.bname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:14px;position:relative}
.bfill{display:block;height:100%;border-radius:0 4px 4px 0;cursor:pointer;outline:none}
.bfill:focus-visible{box-shadow:0 0 0 2px var(--fg)}
.bval{font-variant-numeric:tabular-nums;font-weight:700;min-width:70px;text-align:right}
.muted{color:var(--muted);font-weight:400}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.weak li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.weak li:first-child{border-top:0}
.wname{display:flex;flex-direction:column;flex:1 1 180px;min-width:0;font-size:15px}
.wname .muted{font-size:13px}
.wval{font-variant-numeric:tabular-nums;font-weight:700}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right}

/* formats */
.fmtpick{display:flex;flex-direction:column;gap:8px}
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fmt{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.fmt:hover{border-color:var(--accent)}
.fmt[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.fmt-t{font-weight:700}
.fmt[aria-checked="true"] .fmt-t{color:var(--accent)}
.fmt-d{font-size:13px;color:var(--muted);line-height:1.35}
.mode:disabled{opacity:.5;cursor:not-allowed;transform:none}
.timer{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.proposed{border-left:4px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.proposed p{margin:0;font-size:18px;font-weight:700}
.opts.tf{flex-direction:row}
.opts.tf li{flex:1}
textarea{font:inherit;width:100%;min-height:90px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea[readonly]{background:var(--bg)}
.model{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:12px 16px}
.model p{margin:0}
.model>p:first-of-type{font-weight:700}
.selfmark{gap:10px}
.checkrow{justify-content:space-between}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.match{grid-template-columns:1fr}}
.mq,.ma{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mitem{width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;text-align:left;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.mitem:hover:not(:disabled){border-color:var(--accent)}
.mitem:disabled{cursor:default}
.mnum{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bg);color:var(--muted)}
.ans .mnum{border-radius:50%}
.mpair{grid-column:2;font-size:13px;font-weight:700;color:var(--accent)}
.mpair:empty{display:none}
.mitem.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.mitem.paired .mnum{background:var(--accent);color:var(--surface)}
.mitem.correct{border-color:var(--good);background:var(--good-soft)}
.mitem.correct .mpair{color:var(--good)}
.mitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mitem.wrong .mpair{color:var(--bad)}
.flash{display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:16px}
@media (max-width:480px){h1{font-size:32px}h2{font-size:24px}.prompt{font-size:19px}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.calcbtn{position:fixed;right:16px;bottom:16px;z-index:40;font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.calc{position:fixed;right:16px;bottom:72px;z-index:40;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
.calc[hidden]{display:none}
.calc .disp{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-height:64px}
.calc .prev{font-size:13px;color:var(--muted);min-height:18px;word-break:break-all;text-align:right}
.calc input{font:inherit;font-size:22px;font-weight:700;width:100%;border:0;background:transparent;color:var(--fg);text-align:right;outline:none;padding:0}
.calc .res{font-size:15px;color:var(--accent);font-weight:700;min-height:20px}
.calc .keys5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.calc .keys5 button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:9px;padding:11px 0;cursor:pointer;background:var(--bg);color:var(--fg)}
.calc .keys5 button.op{background:var(--soft);color:var(--accent)}
.calc .keys5 button.eq{background:var(--accent);color:var(--surface)}
.calc .keys5 button:active{transform:scale(.96)}
.calc .chead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.calc .chead button{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
body.calc-open #app{padding-bottom:420px}
@media (min-width:900px){body.calc-open #app{padding-bottom:40px;margin-right:332px;margin-left:auto}.calc{bottom:auto;top:16px}}
@media (max-width:520px){.calc{left:8px;right:8px;width:auto;bottom:64px;padding:10px;gap:6px}.calcbtn{right:12px;bottom:12px;padding:10px 16px}
 .calc .keys5{gap:5px}.calc .keys5 button{padding:8px 0;font-size:15px}.calc .disp{min-height:52px;padding:6px 10px}.calc input{font-size:20px}body.calc-open #app{padding-bottom:360px}}

<script>
// Q(question or [alternative phrasings], correct answer, [wrong options — 3 are picked at random each play], explanation, hint?)
const Q=(q,a,w,e,h)=>({q,a,w,e,h});

const SUBJECTS=[
{id:"hass",name:"HASS",short:"HA",h:140,quizzes:[
 {title:"Australia's Democracy",topic:"Civics and Citizenship",src:"notes",qs:[
  Q("Australia is a representative democracy. What does this mean?","Citizens elect representatives to make decisions on their behalf in parliament",["Citizens vote directly on every law","The Governor-General makes all the laws","Judges are elected to run the country","The Prime Minister is chosen by the King"],"Citizens elect MPs to make decisions for them, and those MPs stay accountable through regular elections.","Who actually sits in parliament?"),
  Q("Australia is also a liberal democracy. What does that mean?","Government power is limited by laws that protect individual rights and freedoms",["The Liberal Party always runs the government","There are no limits on what the government can do","Only people with degrees can vote","Laws can be ignored if most people disagree"],"'Liberal' here isn't about a political party. It means government power is limited by laws that protect rights and freedoms."),
  Q("Which feature of a liberal democracy means everyone, including the government, must follow the law?","Rule of law",["Separation of powers","Royal Assent","Precedent","Representative government"],"The rule of law means nobody is above the law, not even the government."),
  Q("Separation of powers divides power between which three groups?","Parliament, Executive and Judiciary",["Police, courts and prisons","House of Reps, Senate and Governor-General","Federal, state and local councils","Prime Minister, Premier and Mayor"],"Parliament makes laws, the Executive carries them out, and the Judiciary (courts) interprets them. Splitting power prevents abuse.","Legislature, executive and…?"),
  Q("Which freedoms are protected in Australia's liberal democracy?","Speech, religion and association",["Free housing and free cars","Freedom from paying tax","Freedom to ignore laws you disagree with","Freedom from ever being arrested"],"Protection of rights includes freedoms like speech, religion and association."),
  Q("The government bans under-16s from social media. How does this reflect representative democracy?","Elected representatives made the decision for the people and can be held accountable at the next election",["Children voted for the ban themselves","A judge created the ban through precedent","Social media companies wrote the law","The Governor-General decided it alone"],"MPs elected by citizens made the law on the people's behalf. If voters disagree, they can vote those MPs out."),
  Q("What concern does the under-16 social media ban raise?","It raises questions about individual freedoms",["It was made by an unelected king","It was never debated by anyone","It applies only to adults","It stops people from voting"],"The law aims to protect children from online harm, but it also raises questions about individual freedoms, a key part of a liberal democracy."),
  Q("In the WA State Parliament, what is the lower house called?","Legislative Assembly",["Senate","Legislative Council","House of Representatives","High Court"],"WA's lower house is the Legislative Assembly; the upper house is the Legislative Council.","'A' for lower, 'C' for upper."),
  Q("In the WA State Parliament, what is the upper house called?","Legislative Council",["Legislative Assembly","Senate","House of Representatives","Executive Council"],"WA's upper house is the Legislative Council."),
  Q("In Federal Parliament, what is the upper house called?","Senate",["Legislative Council","House of Representatives","High Court","Legislative Assembly"],"Federal Parliament: lower house = House of Representatives, upper house = Senate."),
  Q("In Federal Parliament, what is the lower house called?","House of Representatives",["Senate","Legislative Assembly","Legislative Council","Cabinet"],"The House of Representatives is the lower house of Federal Parliament."),
 ]},
 {title:"Making Law",topic:"Civics and Citizenship",src:"notes",qs:[
  Q("What is a bill?","A proposal for a new law or a change to an existing law",["A law that has been passed","A court decision","A fine for breaking the law","A vote in an election"],"A bill is a proposed law. Once passed by both houses and given Royal Assent, it becomes an Act of Parliament."),
  Q("Which bills CANNOT start in the Senate?","Money and taxation bills",["Private members' bills","Urgent bills","Education bills","Environmental bills"],"Bills can start in either house, except money and tax bills, which must start in the House of Representatives."),
  Q("Who introduces most bills?","Government ministers",["Senators from minor parties","The Governor-General","High Court judges","Members of the public"],"Most bills are introduced by government ministers, though other MPs can introduce private members' bills."),
  Q("A bill introduced by an MP who is NOT a government minister is called a…","Private member's bill",["Royal bill","Senate bill","Binding bill","Money bill"],"Non-ministers can introduce private members' bills (private senators' bills in the Senate)."),
  Q("At which stage do members debate and vote on the main idea of the bill?","2nd reading",["1st reading","3rd reading","Royal Assent","Committee of the whole"],"1st reading = introduced. 2nd reading = debate on the main idea. 3rd reading = final vote.","Introduce → debate → final vote."),
  Q("What happens at the 1st reading?","The bill is introduced",["The bill is signed into law","The final vote is taken","The bill is sent to the High Court","The public votes on it"],"The 1st reading is the formal introduction of the bill."),
  Q("In the Senate, the optional stage where senators discuss the bill in detail is called…","Committee of the whole",["Consideration in detail","3rd reading","Royal Assent","Public inquiry"],"In the Senate it's 'committee of the whole'. The House of Reps version is 'consideration in detail'."),
  Q("What is the final step before a bill becomes an Act of Parliament?","The Governor-General gives Royal Assent",["The Prime Minister signs it","The High Court approves it","Citizens vote in a referendum","The Premier signs it"],"After passing both houses in identical form, the Governor-General gives Royal Assent and it becomes an Act."),
  Q("What must happen in both houses before a bill gets Royal Assent?","It must be passed by a majority and agreed to in identical form",["It must be passed unanimously","It must be read 10 times","It must be approved by a judge","It must be voted on by every citizen"],"Both chambers must pass the bill by majority vote and agree to it in identical form."),
  Q("About how many bills are introduced into Federal Parliament each year, and roughly what share pass?","About 200, with about 90% passing",["About 20, with 50% passing","About 2,000, with 10% passing","About 500, with all passing","About 50, with 25% passing"],"Around 200 bills are introduced each year and about 90% become law."),
  Q("How long do most bills take to pass?","Weeks or months, though urgent bills can take days",["Exactly one year","About 10 minutes","At least 5 years","One sitting day, always"],"Most bills take weeks or months, but urgent bills can pass in days."),
  Q("Why was a bill traditionally read aloud three times?","Before printing, and when many couldn't read, MPs needed to hear what it said",["To waste time so fewer laws passed","Because the King demanded it","To translate it into three languages","To give each party a turn"],"The tradition comes from the early British Parliament, before printing and widespread reading."),
 ]},
 {title:"Precedent & Punishment",topic:"Civics and Citizenship",src:"notes",qs:[
  Q("What is a precedent?","A legal principle set by a court decision that guides future similar cases",["A law passed by parliament","The leader of a country","A type of punishment","A vote in parliament"],"A precedent is a rule set by a court decision that guides later cases. It's the basis of common law.","Careful: precedent ≠ president!"),
  Q("What is common law?","Law based on decisions judges have made in past cases",["Law made only by parliament","Rules made by local councils","Laws that apply only in the country","Laws written by the King"],"Common law is the system where decisions are based on precedent: past court decisions in similar cases."),
  Q("The WA Supreme Court makes a decision. A WA Magistrates Court later hears a similar case. The Supreme Court's decision is…","Binding: the Magistrates Court must follow it",["Persuasive: it can be ignored","Irrelevant","Only binding if parliament agrees","Binding on the High Court"],"Higher court decisions bind lower courts in the same hierarchy when the facts are similar.","Binding flows down."),
  Q("Which is an example of a PERSUASIVE precedent?","A decision from a court in another state or country",["A High Court decision for the WA Supreme Court","A Supreme Court decision for a District Court in the same state","An Act of Parliament","A High Court decision for a Magistrates Court"],"Persuasive precedents can influence a decision but don't have to be followed."),
  Q("What is the highest court in Australia?","High Court of Australia",["Supreme Court of WA","Federal Court","Family Court","District Court"],"The High Court sits at the top of the hierarchy. Its decisions bind all other courts."),
  Q("Which is NOT a reason precedents are important?","They let judges ignore past decisions whenever they want",["They give consistency and predictability","They help similar cases get treated fairly","They save time and resources","They guide judges and lawyers"],"Precedents give consistency, fairness, guidance and save time."),
  Q("Which aim of punishment focuses on helping an offender change so they don't reoffend?","Rehabilitation",["Deterrence","Retribution","Reparation","Protection"],"Rehabilitation aims to reform the offender, e.g. a drug or alcohol program."),
  Q("Which aim of punishment means the offender makes up for the harm they caused?","Reparation",["Protection","Deterrence","Retribution","Rehabilitation"],"Reparation is about repairing harm, like paying compensation.","Sounds like 'repair'."),
  Q("Which aim of punishment tries to stop the offender and others from committing crime?","Deterrence",["Reparation","Rehabilitation","Retribution","Restitution"],"Deterrence uses the threat of punishment to discourage crime."),
  Q("Retribution as an aim of punishment means…","The punishment matches the seriousness of the crime",["Helping the offender get a job","Keeping the public safe","Paying back the victim","Warning others not to offend"],"Retribution is about the punishment fitting the crime."),
  Q("Which aims does prison mainly meet?","Deter, protect and retribution",["Reparation only","Rehabilitation only","None","Reparation and nothing else"],"Prison deters others, protects the community and punishes. Some programs also rehabilitate."),
  Q("Which punishment mainly meets the aims of deterrence, punishment and reparation?","Fines",["Capital punishment","Prison","Drug and alcohol program","Warning"],"Fines deter, punish and can repay the community."),
  Q("A drug and alcohol program mainly aims to…","Protect the community and rehabilitate the offender",["Get revenge on the offender","Raise money for the government","Remove the offender permanently","Punish the offender's family"],"Programs treat the cause of offending, protecting the community and rehabilitating."),
 ]},
 {title:"Principles of Our Legal System",topic:"Civics and Citizenship",src:"notes",qs:[
  Q("What does 'equality before the law' mean?","Everyone is treated the same by the legal system, regardless of wealth, gender, race or background",["Everyone gets the same income","Only people born in Australia are protected","Judges decide who deserves a fair trial","Wealthy people get a better process"],"The legal system treats everyone the same, no matter who they are."),
  Q("Under the presumption of innocence, who has the burden of proof?","The prosecution",["The accused person","The jury","The victim's family","The judge"],"A person is innocent until proven guilty, so the prosecution must prove guilt.","Who brings the case against the accused?"),
  Q("Which principle lets a person have their case reviewed by a higher court?","Right to appeal",["Equality before the law","Presumption of innocence","Separation of powers","Rule of precedent"],"The right to appeal lets someone challenge a decision if they believe a mistake was made."),
  Q("Which would break the principle of an independent and unbiased judiciary?","A jury that includes people who personally know the accused",["A judge who has never met anyone in the case","A jury that only considers the evidence","A judge who listens to both sides","A jury chosen at random"],"Juries must be impartial. People who know someone in the case can't judge only on evidence."),
  Q("Fatima gets a $5000 fine, while Liam (whose dad is a politician) gets a warning for the same graffiti. Which principle was broken?","Equality before the law",["Right to appeal","Presumption of innocence","Independent jury","Separation of powers"],"Same crime, different treatment because of background.","Same crime, different treatment."),
  Q("Police jail Zane without checking evidence, and the judge says, 'Prove you didn't do it.' Which principle was broken?","Presumption of innocence",["Right to appeal","Equality before the law","Independent jury","Rule of precedent"],"Zane was treated as guilty and the burden of proof was wrongly put on him."),
  Q("Three jurors in Emily's trial are friends with the property owner and vote 'guilty' without discussing evidence. Which principle was broken?","Independent and unbiased judiciary",["Right to appeal","Equality before the law only","Presumption of innocence only","Separation of powers"],"Jurors connected to one side aren't impartial."),
  Q("New CCTV proves Jacob is innocent, but the court says the decision can't be changed. Which principle was broken?","Right to appeal",["Independent judiciary","Equality before the law","Presumption of innocence","Separation of powers"],"Jacob should be able to challenge the decision in a higher court."),
  Q("The judge in Maya's trial is the shop owner's cousin and has 'already made up their mind'. What's the main problem?","The judge has a conflict of interest and isn't unbiased",["The judge was too strict on evidence","The trial took too long","The shop owner attended","Maya didn't bring friends"],"A judge must have no personal connection to the case, and must not decide before hearing the evidence."),
  Q("James's jury is the shop owner's family and friends. What should happen?","Replace them with impartial jurors with no connection to the case",["Keep them but ask them to be nice","Let the shop owner choose","Add James's friends to balance it","Let the judge decide without evidence"],"A fair jury has no connection to either side.","Bias on either side is still bias."),
  Q("If James is found guilty in a fair trial but believes there was an error, what can he do?","Appeal to a higher court",["Nothing, it's final","Ask the shop owner to change the verdict","Ask parliament to cancel the trial","Pick a new jury himself"],"The right to appeal lets a higher court review the decision."),
  Q(["A rich celebrity and a regular citizen are accused of the same crime. What does equality before the law say should happen?","Under equality before the law, how should a celebrity and an ordinary person accused of the same crime be treated?"],"They should face the same legal process",["The celebrity should get a lighter process because they're famous","The regular citizen should get a harsher process","The celebrity can choose their own judge","Only the regular citizen goes to court"],"Everyone, regardless of race, wealth, gender or background, should be treated the same by the legal system."),
  Q(["Under the presumption of innocence, how should a suspect be treated before the evidence is heard?","Which example shows the presumption of innocence?"],"They should not be treated as a criminal until evidence proves them guilty",["They should be treated as guilty until they prove otherwise","They should be jailed straight away to be safe","Their name should be published as a criminal","They should have to explain why they're innocent"],"A person is innocent until proven guilty, and the burden of proof is on the prosecution."),
  Q(["What should a judge do if they have a personal connection to someone in a case?","A judge is related to the victim in a case. What should happen?"],"Step aside so a judge with no connection hears the case",["Hear the case anyway but try to be fair","Let the person they know decide the outcome","Keep the connection secret","Give the accused a harsher sentence"],"Judges should not have any personal connection to, or interest in, the outcome of a case."),
  Q(["What should happen when new evidence proving someone's innocence is found after their trial?","A convicted person finds new evidence that proves they're innocent. What can happen?"],"The case can be reviewed on appeal and the decision overturned",["Nothing, because the decision is final","The person serves half their sentence instead","Parliament votes on whether to release them","The original witness goes to jail instead"],"A wrongly convicted person can challenge the decision in a higher court. That's the right to appeal."),
  Q(["In Maya's trial, the judge declared her guilty without properly considering the evidence. Which principle does this also break?","Deciding Maya was guilty before weighing any evidence goes against which principle?"],"Presumption of innocence",["Right to appeal","Separation of powers","Rule of precedent","Royal Assent"],"Maya should be treated as innocent until guilt is proven with evidence. Deciding without weighing the evidence ignores this."),
  Q(["In a fair version of James's trial, how should the judge treat his alibi?","James has an alibi. What would an unbiased judge do with it?"],"Consider it fairly alongside the shop owner's evidence",["Ignore it because the shop owner is more believable","Only listen to it if James pays a fee","Let the shop owner decide if it counts","Throw it out because James is young"],"An unbiased judge weighs evidence from both sides and decides based only on the evidence."),
 ]},
]},

{id:"sci",name:"Science",short:"Sc",h:172,quizzes:[
 {title:"Round 1: Core Ideas",topic:"Waves and Sound",src:"notes",qs:[
  Q(["A wave transfers what from place to place?","What does a wave carry from one place to another?"],"Energy",["Matter","Particles","Mass","Water"],"A wave transfers energy WITHOUT transferring matter. The particles vibrate but don't travel along with the wave.","The particles stay put and just vibrate."),
  Q(["Which type of wave is made up of compressions and rarefactions?","Sound travels as which type of wave?"],"Longitudinal wave",["Transverse wave","Electromagnetic wave","Radio wave","Surface wave"],"Longitudinal waves (like sound) have compressions and rarefactions. The particles vibrate back and forth in the direction the wave travels. Transverse waves move up and down instead.","Think about how sound moves."),
  Q(["In which state of matter does sound travel fastest?","Sound moves quickest through which kind of material?"],"Solid",["Gas","Liquid","Vacuum","It's the same speed in all of them"],"Solid = fastest, liquid = medium, gas = slowest. Particles are packed closest in a solid, so vibrations pass along quicker. Sound can't travel in a vacuum at all.","Where are the particles packed most tightly?"),
  Q(["Which of these does NOT need a medium to travel through?","Which waves can travel through the vacuum of space?"],"Electromagnetic waves",["Sound waves","Mechanical waves","Water waves","None, all waves need a medium"],"Electromagnetic waves (like light and radio) don't need a medium, so they can cross space. Mechanical waves such as sound always need one.","Which kind of wave reaches us from the Sun?"),
  Q(["What does the acronym SONAR stand for?","SONAR is short for…"],"Sound Navigation And Ranging",["Sound Operated Navigation And Radar","System Of Navigation And Reflection","Sonic Oscillation And Ranging","Sound Navigation And Radar"],"SONAR = Sound Navigation And Ranging. It measures speed, distance and time using reflected sound pulses."),
  Q(["What is the speed of sound in seawater?","How fast does sound travel through seawater?"],"1500 m/s",["300 m/s","760 m/s","300,000 km/s","340 m/s"],"Speed of sound in seawater = 1500 m/s. (300,000 km/s is the speed of light!)","It's a liquid, so faster than in air."),
  Q(["A SONAR pulse reflects off the seabed and returns to the ship in 4 seconds. Speed of sound in seawater = 1500 m/s. How deep is the seabed?","A ship's SONAR echo comes back from the seabed after 4 s. If sound travels at 1500 m/s in seawater, what is the depth?"],"3000 m",["1500 m","6000 m","375 m","750 m"],"Round trip = 1500 × 4 = 6000 m. That's down AND back, so the depth = 6000 ÷ 2 = 3000 m.","Find the total distance first, then halve it."),
  Q(["One hertz (Hz) is equal to…","What does a frequency of 1 Hz mean?"],"One vibration per second",["One thousand vibrations per second","One vibration per minute","The loudness of a sound","One wavelength per metre"],"1 Hz = 1 vibration per second. A kilohertz (kHz) is 1000 per second. Frequency is how often something vibrates, not how loud it is."),
  Q(["Sound travels faster in warm air than in cold air because…","Why does sound move more quickly through warm air?"],"The particles move with greater energy",["Warm air has fewer particles","Warm air is a vacuum","Cold air absorbs the sound","Warm air is denser"],"In warmer air the particles have more energy, so they pass the vibrations along faster.","Heat gives particles more of what?"),
  Q(["What are the three primary colours of light?","Which three colours of light can be mixed to make white light?"],"Red, green and blue",["Red, yellow and blue","Cyan, magenta and yellow","Red, white and blue","Orange, green and violet"],"The primary colours of light are red, green and blue (RGB). Red, yellow and blue are the primary colours for paint, a common trap.","Think RGB, like on a screen."),
  Q(["A blue surface is lit with white light. What happens to the light?","Why does a blue object look blue in white light?"],"Blue is reflected and all other colours are absorbed",["All the white light is reflected","Blue is absorbed and all other colours are reflected","All the light is absorbed so it looks black","The surface turns the light blue"],"A surface reflects its own colour and absorbs the rest.","Which colour reaches your eye?"),
  Q(["Why is sound called a mechanical wave?","What makes sound a mechanical wave?"],"It needs a medium (solid, liquid or gas) to travel",["It is made by machines","It can travel through a vacuum","It is a type of light","It only travels through metal"],"Mechanical waves need a medium to travel through. Sound is the disturbance of particles in a solid, liquid or gas.","Think about what sound can't travel through."),
  Q(["What is sound?","Which statement best describes sound?"],"A disturbance of particles in a solid, liquid or gas",["A stream of tiny light particles","A type of electromagnetic wave","Energy that only travels through space","A wave that never needs a medium"],"Sound is the disturbance (vibration) of particles in a medium, passed along as a longitudinal wave."),
  Q(["Why can't sound travel through space?","Sound can't cross the vacuum of space. Why?"],"There are no particles in a vacuum to pass the vibrations along",["Space is too cold","Space is too bright","Sound is too slow","Space is full of radio waves"],"Sound needs particles to vibrate. A vacuum has none, so sound can't travel there, but EM waves like radio and light can."),
 ]},
 {title:"Wave Parts, Pitch and Frequency",topic:"Waves and Sound",src:"notes",qs:[
  Q(["What is the top of a wave called?","The highest point of a transverse wave is the…"],"Crest (peak)",["Trough","Amplitude","Wavelength","Rarefaction"],"The top of a wave is the crest or peak. The bottom is the trough."),
  Q(["What is the bottom of a wave called?","The lowest point of a transverse wave is the…"],"Trough",["Crest","Peak","Compression","Propagation"],"The bottom of a wave is the trough."),
  Q(["What is the amplitude of a wave?","Amplitude describes…"],"The height of the wave",["The distance between two crests","The number of waves per second","The direction the wave travels","The bottom of the wave"],"Amplitude is the height of the wave, measured from the rest line to the crest."),
  Q(["What is the wavelength of a wave?","Wavelength is measured as…"],"The distance from one crest to the next (or one trough to the next)",["The height of the wave","The time for one vibration","The number of vibrations per second","The distance from crest to trough"],"Wavelength is the distance between two crests, or between two troughs."),
  Q(["What does 'propagation' mean for a wave?","Wave propagation is…"],"Energy moving away from the source",["The wave bouncing back","The height of the wave","Particles travelling with the wave","The wave slowing down"],"Propagation is the energy of the wave moving away from where it started."),
  Q(["In a longitudinal wave, what is a compression?","The part of a longitudinal wave where particles are squashed together is called a…"],"Compression (high pressure)",["Rarefaction","Trough","Amplitude","Crest only"],"A compression is where particles are pushed close together, an area of high pressure."),
  Q(["In a longitudinal wave, what is a rarefaction?","The 'spread-out' part of a longitudinal wave is called a…"],"Rarefaction (low pressure)",["Compression","Crest","Amplitude","Reflection"],"A rarefaction is where particles are spread out, an area of low pressure."),
  Q(["Which is an example of a longitudinal wave?","Which of these shows a longitudinal wave?"],"A slinky pushed back and forth along its length",["A rope flicked up and down","Light from a torch","A Mexican wave in a crowd","Radio waves"],"In a longitudinal wave the particles vibrate back and forth, parallel to the direction the wave travels. A slinky pushed and pulled shows this."),
  Q(["How is sound usually drawn in diagrams?","Sound travels as a longitudinal wave, but how do we normally illustrate it?"],"As a transverse wave",["As a straight line","As a circle","As a longitudinal wave only","It can't be drawn"],"Sound travels as a longitudinal wave, but it's illustrated as a transverse wave because that's easier to read."),
  Q(["What is pitch?","Pitch describes…"],"How high or low a sound is",["How loud a sound is","How fast sound travels","How far sound travels","The colour of a sound"],"Pitch is a measure of how high or low a sound is."),
  Q(["What does the pitch of a sound depend on?","A sound's pitch is decided by its…"],"Frequency",["Amplitude","Speed","Medium only","Temperature"],"The higher the frequency, the higher the pitch. Low frequency gives a low pitch.","Think about the tuning forks."),
  Q(["A 512 Hz tuning fork and a 256 Hz tuning fork are struck. Which has the higher pitch?","Which tuning fork sounds higher: 256 Hz or 512 Hz?"],"512 Hz",["256 Hz","They sound the same","It depends on how hard you hit it","Neither makes a sound"],"Higher frequency = higher pitch, so the 512 Hz fork sounds higher."),
  Q(["A vibrating tuning fork is placed in water and the water splashes. What does this show?","Why does water splash when a struck tuning fork touches it?"],"The fork is vibrating and transfers energy to the water",["The fork is hot","The water is boiling","The fork is magnetic","Sound is a type of light"],"The splashing shows the fork is vibrating, and those vibrations transfer energy into the water."),
  Q(["What unit is volume (loudness) measured in?","Loudness is measured in…"],"Decibels (dB)",["Hertz (Hz)","Metres per second","Kilograms","Watts per metre"],"Volume is measured in decibels (dB). Frequency is measured in hertz (Hz)."),
  Q(["What is a resonance frequency?","Every material has a resonance frequency. What is it?"],"The frequency a material naturally vibrates at",["The loudest sound a material can make","The speed of sound in that material","The frequency of light it reflects","The temperature it melts at"],"Resonance frequency is the frequency a material naturally vibrates at."),
  Q(["What can happen if you match an object's resonance frequency and make the sound much louder?","Why can a singer break a glass with their voice?"],"The object may vibrate so much that it breaks",["The object becomes magnetic","The object changes colour","Nothing, because sound has no energy","The object gets lighter"],"If you replicate an object's resonance frequency and amplify it, the vibrations can grow until the object breaks."),
  Q(["Why can an object have more than one resonance frequency?","What decides how many resonance frequencies an object has?"],"It can depend on the number of different materials in the object",["Objects only ever have one","It depends on the colour of the object","It depends on the time of day","It depends on how loud the room is"],"Resonance frequency depends on physical properties, and an object made of several materials can have more than one."),
 ]},
 {title:"Light and Colour",topic:"Waves and Sound",src:"notes",qs:[
  Q(["About how fast does light travel?","What is the speed of light?"],"About 299,792 km per second",["About 1500 m per second","About 343 m per second","About 3000 km per hour","About 29,979 km per second"],"Light travels at about 299,792 km/s, by far the fastest thing there is."),
  Q(["At the speed of light, how many times could you travel around the world in one second?","Light is so fast it could circle the Earth about how many times each second?"],"About 7.5 times",["About once","About 75 times","About 2 times","About 750 times"],"At light speed you could go around the world about 7.5 times in one second."),
  Q(["Which is the correct order of the EM spectrum from lowest to highest frequency?","Put the EM spectrum in order, starting with the lowest frequency."],"Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma",["Gamma, X-ray, ultraviolet, visible, infrared, microwave, radio","Radio, infrared, microwave, visible, X-ray, ultraviolet, gamma","Visible, radio, microwave, infrared, ultraviolet, gamma, X-ray","Microwave, radio, visible, infrared, ultraviolet, X-ray, gamma"],"Radio → microwave → infrared → visible → ultraviolet → X-ray → gamma. Frequency rises and wavelength shortens along the way.","Remember: Radio starts, Gamma finishes."),
  Q(["Which part of the EM spectrum sits between visible light and X-rays?","Which waves come just after visible light on the EM spectrum?"],"Ultraviolet",["Infrared","Microwaves","Radio waves","Gamma rays"],"The order is visible → ultraviolet → X-ray."),
  Q(["Which part of the EM spectrum sits between microwaves and visible light?","Which waves come just before visible light on the EM spectrum?"],"Infrared",["Ultraviolet","X-rays","Gamma rays","Radio waves"],"The order is microwave → infrared → visible."),
  Q(["Which EM waves have the highest frequency and shortest wavelength?","Which end of the EM spectrum carries the most energy?"],"Gamma rays",["Radio waves","Microwaves","Visible light","Infrared"],"Gamma rays have the highest frequency, shortest wavelength and the most energy."),
  Q(["What is electromagnetism?","The word 'electromagnetic' comes from…"],"The interaction between electricity and magnetism",["The movement of sound through metal","The way light bends in water","The vibration of particles in air","The energy stored in batteries"],"Electromagnetism is the interaction between electricity and magnetism."),
  Q(["Why can electromagnetic waves travel through a vacuum?","Light and radio waves can cross space. Why?"],"They are high-energy waves, not particles, so they don't need a medium",["They are made of air particles","They travel slower than sound","They only travel through solids","Space is full of water"],"EM waves are high-energy waves, not particles. They can travel through a medium, but they don't need one."),
  Q(["What colour do you get when red and green light are mixed?","Red light + green light = ?"],"Yellow",["Cyan","Magenta","White","Brown"],"Red + green = yellow. Green + blue = cyan. Red + blue = magenta."),
  Q(["What colour do you get when green and blue light are mixed?","Green light + blue light = ?"],"Cyan",["Yellow","Magenta","White","Purple"],"Green + blue = cyan."),
  Q(["What colour do you get when red and blue light are mixed?","Red light + blue light = ?"],"Magenta",["Yellow","Cyan","Green","Orange"],"Red + blue = magenta (a pink-purple)."),
  Q(["What colour do you get when red, green and blue light are all mixed?","Mixing all three primary colours of light makes…"],"White",["Black","Brown","Grey","Yellow"],"All three primary colours of light combine to make white light."),
  Q(["A pink surface is lit with white light. Which colours does it reflect?","Why does a pink object look pink in white light?"],"Red and blue",["Green only","Red and green","Blue and green","All colours"],"Pink (magenta) is made of red and blue light, so a pink surface reflects red and blue and absorbs green."),
  Q(["A green surface is lit with white light. What happens?","Why does a green object look green?"],"Green is reflected and all other colours are absorbed",["Green is absorbed and all others are reflected","All colours are reflected","All colours are absorbed","Only red is reflected"],"A surface reflects its own colour and absorbs the rest."),
  Q(["How are rainbows formed?","What causes a rainbow?"],"White light is split into its seven colours, like in a prism",["Sunlight is coloured by the clouds","Water adds colour to the light","The sky reflects the ocean","Light changes into sound"],"White light is a mixture of seven colours. Raindrops split it apart the same way a prism does."),
 ]},
 {title:"Speed of Sound Calculations",topic:"Waves and Sound",src:"notes",qs:[
  Q(["Using the speed-distance-time triangle, how do you find distance?","Which formula gives distance?"],"Distance = speed × time",["Distance = speed ÷ time","Distance = time ÷ speed","Distance = speed + time","Distance = speed − time"],"Cover D in the triangle and you're left with S × T.","D sits on top of S and T."),
  Q(["Using the triangle, how do you find time?","Which formula gives time?"],"Time = distance ÷ speed",["Time = speed ÷ distance","Time = distance × speed","Time = speed − distance","Time = distance + speed"],"Cover T and you're left with D over S, so T = D ÷ S."),
  Q(["Using the triangle, how do you find speed?","Which formula gives speed?"],"Speed = distance ÷ time",["Speed = time ÷ distance","Speed = distance × time","Speed = distance − time","Speed = time × 2"],"Cover S and you're left with D over T, so S = D ÷ T."),
  Q(["For an echo or SONAR question, how do you find the one-way distance?","An echo returns after time t. What is the distance to the object?"],"(Speed × time) ÷ 2",["Speed × time","Speed ÷ time","(Speed × time) × 2","Time ÷ speed"],"Speed × time gives the round trip. Halve it for the one-way distance."),
  Q(["What two things does the speed of sound depend on?","The speed of sound changes with…"],"The medium it travels through and the temperature",["The colour and brightness of the source","Only how loud it is","Only the pitch","The time of day"],"Sound's speed depends on the medium (solid, liquid, gas) and, in air, the temperature."),
  Q(["What is the speed of sound in air at 0°C?","At 0°C, sound travels through air at about…"],"331 m/s",["343 m/s","1500 m/s","5200 m/s","300 m/s"],"At 0°C the speed of sound in air is 331 m/s."),
  Q(["For every degree above 0°C, how does the speed of sound in air change?","Each 1°C rise in air temperature changes the speed of sound by…"],"It increases by 0.6 m/s",["It decreases by 0.6 m/s","It increases by 6 m/s","It doubles","It doesn't change"],"Speed increases by 0.6 m/s for every degree above 0°C, and decreases by 0.6 m/s for every degree below."),
  Q(["What is the speed of sound in air at 20°C?","Air is 20°C. How fast does sound travel?"],"343 m/s",["331 m/s","351 m/s","319 m/s","323 m/s"],"331 + (20 × 0.6) = 331 + 12 = 343 m/s."),
  Q(["What is the speed of sound in air at −10°C?","Air is −10°C. How fast does sound travel?"],"325 m/s",["331 m/s","337 m/s","321 m/s","341 m/s"],"331 − (10 × 0.6) = 331 − 6 = 325 m/s."),
  Q(["You see lightning and hear the thunder 4 s later. Sound travels at 322 m/s. How far away is the lightning?","Thunder arrives 4 seconds after the flash. With sound at 322 m/s, how far away was the strike?"],"1288 m",["644 m","80.5 m","2576 m","326 m"],"D = S × T = 322 × 4 = 1288 m. No halving: the sound only travels one way.","Is this a there-and-back trip?"),
  Q(["You yell at a mountain 82 m away on a 0°C day, when sound travels at 331 m/s. How long until you hear the echo?","A cliff is 82 m away and the air is 0°C, so sound travels at 331 m/s. How long does an echo take to return?"],"About 0.50 s",["About 0.25 s","About 4.0 s","About 27 s","About 0.12 s"],"Round trip = 82 × 2 = 164 m. T = 164 ÷ 331 ≈ 0.50 s. (0.25 s forgets the sound comes back.)","Double the distance first."),
  Q(["A helicopter passes overhead and you hear it 3 s later. Sound travels at 343 m/s. How high is it?","You hear a helicopter's engine 3 s after seeing it overhead. With sound at 343 m/s, what is its height?"],"1029 m",["114 m","514.5 m","2058 m","346 m"],"D = 343 × 3 = 1029 m. One way only, so no halving."),
  Q(["A submarine is 2.2 km from a ship. Sound in seawater travels at 1400 m/s. How long does a SONAR pulse take to go out and back?","SONAR pings a submarine 2.2 km away. At 1400 m/s, how long until the echo returns?"],"About 3.14 s",["About 1.57 s","About 0.64 s","About 6.28 s","About 3080 s"],"2.2 km = 2200 m. Round trip = 4400 m. T = 4400 ÷ 1400 ≈ 3.14 s.","Convert km to m, then double it."),
  Q(["A train is 1.65 km away. Sound in steel travels at 5200 m/s. How long does the sound take to reach someone listening at the rail?","Through a steel rail at 5200 m/s, how long does a train's sound take to travel 1.65 km?"],"About 0.32 s",["About 3.15 s","About 8580 s","About 5.0 s","About 0.03 s"],"1.65 km = 1650 m. T = 1650 ÷ 5200 ≈ 0.32 s. Sound is very fast in solids."),
  Q(["A train whistle 1.65 km away travels through air at 0°C, where sound moves at 331 m/s. How long until a friend hears it?","At 0°C, sound travels through air at 331 m/s. How long does a whistle take to travel 1.65 km?"],"About 5.0 s",["About 0.32 s","About 2.5 s","About 50 s","About 0.5 s"],"T = 1650 ÷ 331 ≈ 5.0 s. That's much slower than through steel, because sound travels slowest in gases."),
  Q(["A ship's foghorn echo returns from an iceberg after 4.6 s. The air is −10°C, so sound travels at 325 m/s. How far away is the iceberg?","At −10°C, sound travels at 325 m/s. A foghorn echo comes back from an iceberg in 4.6 s. What's the distance?"],"About 748 m",["About 1495 m","About 761 m","About 374 m","About 71 m"],"Speed at −10°C = 331 − 6 = 325 m/s. Round trip = 325 × 4.6 = 1495 m. One way = 1495 ÷ 2 ≈ 748 m. (761 m uses 331 m/s and forgets the temperature.)","Adjust the speed for temperature, then halve."),
 ]},
 {title:"Round 2: Harder",topic:"Waves and Sound",src:"notes",qs:[
  Q(["Moving across the EM spectrum from radio waves towards gamma rays, what happens?","How do wavelength and frequency change going from radio waves to gamma rays?"],"Wavelength decreases and frequency increases",["Both wavelength and frequency increase","Both wavelength and frequency decrease","Wavelength increases and frequency decreases","Neither changes"],"Wavelength and frequency are inverses. Radio → gamma: wavelength gets SHORTER, frequency gets HIGHER, and energy increases.","They change in opposite directions."),
  Q(["Which part of the EM spectrum has the lowest frequency and the least energy?","Which EM waves have the longest wavelength?"],"Radio waves",["Visible light","X-rays","Gamma rays","Ultraviolet"],"Radio waves sit at the low-frequency, long-wavelength, low-energy end. Gamma rays are the opposite extreme.","Same end as the longest wavelength."),
  Q(["A hiker shouts and hears the echo off a rock wall 3 seconds later. Speed of sound in air = 340 m/s. How far away is the wall?","An echo from a cliff returns after 3 s. If sound travels at 340 m/s, how far away is the cliff?"],"510 m",["340 m","1020 m","113 m","170 m"],"Round trip = 340 × 3 = 1020 m. Halve it: 1020 ÷ 2 = 510 m. (1020 m is the trap: it forgets to halve.)","v × t gives the round trip, then halve it."),
  Q(["A submarine's SONAR pings the seabed 900 m below it. Speed of sound in seawater = 1500 m/s. How long until the echo returns?","The seabed is 900 m down. With sound at 1500 m/s, how long does a SONAR echo take to come back?"],"1.2 s",["0.6 s","0.3 s","2.4 s","1.67 s"],"Round trip = 900 × 2 = 1800 m. Then t = d ÷ v = 1800 ÷ 1500 = 1.2 s.","Double the depth, then use t = d ÷ v."),
  Q(["An ultrasound pulse reflects off an organ 9 cm below the skin. The round trip takes 0.12 milliseconds. What is the speed of sound in the tissue?","An organ is 9 cm deep and the ultrasound echo returns in 0.12 ms. Find the speed of sound in the tissue."],"1500 m/s",["1.5 m/s","750 m/s","0.0015 m/s","3000 m/s"],"9 cm = 0.09 m, so the round trip is 0.18 m. 0.12 ms = 0.00012 s. Speed = 0.18 ÷ 0.00012 = 1500 m/s. 750 forgets to double the depth; 1.5 forgets to convert ms.","Convert cm → m and ms → s, then double the depth."),
  Q(["A sound has a frequency of 4 kHz. How many vibrations per second is that?","Convert 4 kHz into hertz."],"4000 Hz",["40 Hz","400 Hz","40,000 Hz","0.004 Hz"],"Kilo means one thousand, so 4 kHz = 4 × 1000 = 4000 Hz.","Kilo = a thousand."),
  Q(["A green surface is lit with pure red light only. What colour does it appear?","What colour does a green object look under red light?"],"Black",["Green","Red","Yellow","White"],"A green surface can only reflect green light. Red light has no green in it, so nothing is reflected and it looks black.","Is there any green in red light?"),
  Q(["Which statement about resonance frequency is correct?","Which of these is true about resonance frequency?"],"It depends on an object's physical properties, and an object can have more than one",["Every object has exactly one, the same for all materials","It only exists in liquids","It is the same thing as loudness","It only happens in a vacuum"],"Resonance frequency is the frequency an object naturally vibrates at. It depends on physical properties, and there can be more than one."),
  Q(["When white light passes through a prism it splits into colours. Why?","Why does a prism produce a rainbow of colours from white light?"],"White light is a mixture of seven colours, which the prism separates",["The prism adds colour to the light","The prism absorbs all colours except seven","White light speeds up and changes colour","The prism heats the light"],"White light is made of the seven colours of the rainbow. A prism bends each by a different amount, separating them.","What is white light made of?"),
 ]},
 {title:"Light and Refraction",topic:"Light and Sound Extension",src:"notes",qs:[
  Q(["What type of wave is light?","Light is best described as…"],"An electromagnetic wave",["A mechanical wave","A longitudinal sound wave","A stream of air particles","A type of compression wave"],"Light is an electromagnetic wave, a wave of energy. Visible light is only a small section of the electromagnetic spectrum."),
  Q(["How much of the electromagnetic spectrum is visible light?","Where does visible light sit on the EM spectrum?"],"Only a small section of it",["All of it","About half of it","None of it, light isn't electromagnetic","The whole high-frequency end"],"Visible light is just a small section of the electromagnetic spectrum. The rest (radio, microwave, X-ray and so on) is invisible to us."),
  Q(["What does ROYGBIV stand for?","The colours of white light, in order, are…"],"Red, orange, yellow, green, blue, indigo, violet",["Red, orange, yellow, grey, blue, ivory, violet","Red, olive, yellow, green, black, indigo, violet","Rose, orange, yellow, green, blue, ice, violet","Red, orange, yellow, gold, blue, indigo, violet"],"White light can be split into seven colours: red, orange, yellow, green, blue, indigo, violet (ROYGBIV)."),
  Q(["Which colour of visible light has the longest wavelength?","Which colour of light has the lowest frequency?"],"Red",["Violet","Green","Blue","Indigo"],"Red is at the long-wavelength, low-frequency end of the visible spectrum."),
  Q(["Which colour of visible light has the shortest wavelength?","Which colour of light has the highest frequency?"],"Violet",["Red","Orange","Yellow","Green"],"Violet is at the short-wavelength, high-frequency end of the visible spectrum."),
  Q(["Going from red to violet, what happens to the light?","Moving along ROYGBIV from red to violet, how do wavelength and frequency change?"],"Wavelength gets shorter and frequency gets higher",["Wavelength gets longer and frequency gets lower","Both get longer","Both get lower","Neither changes"],"From red to violet, wavelength shortens and frequency increases."),
  Q(["What is refraction?","The word 'refraction' means…"],"The bending of light",["The bouncing of light off a mirror","Light being absorbed","Light speeding up forever","Light changing into sound"],"Refraction is the bending of light, such as when it passes through a different material."),
  Q(["In what kind of path does light normally travel?","Until something changes its direction, light travels…"],"In a straight line",["In a zig-zag","In a circle","Up and down only","In a spiral"],"Light travels in straight lines. It bends (refracts) when it passes into a different object or material."),
  Q(["Why does white light split into colours when it passes through a prism?","What makes a prism separate white light into a rainbow?"],"Each colour bends by a different amount",["The prism adds colour to the light","The prism absorbs white light","Only red light can pass through glass","The light slows down and stops"],"Different colours bend differently when they pass into another object, so they spread apart into a spectrum."),
  Q(["What is an opaque object?","An object that blocks light completely is…"],"An object that blocks light",["An object that lets all light through","An object that lets some light through","An object that makes its own light","An object that bends light into colours"],"Opaque objects block light, like a wooden door."),
  Q(["What is a transparent object?","An object that lets light pass completely through is…"],"An object that lets light completely through",["An object that blocks all light","An object that lets only some light through","An object that reflects all light","An object that absorbs all colours"],"Transparent objects, like clear glass, let light pass completely through."),
  Q(["What is a translucent object?","An object that lets some light through, but not all of it, is…"],"An object that lets light through, but not completely",["An object that blocks all light","An object that lets all light through clearly","An object that only reflects light","An object that glows in the dark"],"Translucent objects, like frosted glass, let some light through but not completely."),
  Q(["Which is an example of a translucent material?","Which of these is translucent?"],"Frosted glass",["Clear glass","A brick wall","A wooden door","A mirror"],"Frosted glass lets some light through but you can't see clearly through it."),
  Q(["What does a convex lens look like?","Which describes the shape of a convex lens?"],"It bulges outwards",["It curves inwards","It is completely flat","It is shaped like a cube","It has a hole in the middle"],"A convex lens bulges outwards in the middle."),
  Q(["What does a convex lens do to light rays?","Light passing through a convex lens will…"],"Converge (come together)",["Diverge (spread apart)","Stop completely","Turn into different colours only","Travel backwards"],"Convex lenses make light rays converge, meeting at the focal point."),
  Q(["What is the focal point of a lens?","Where light rays meet after passing through a convex lens is called the…"],"The point where the light rays meet",["The thickest part of the lens","The edge of the lens","The point where light is absorbed","The point where light turns into sound"],"The focal point is where the refracted light rays come together."),
  Q(["What is the focal length?","Focal length is measured as…"],"The distance from the lens to the focal point",["The width of the lens","The distance between two light rays","The thickness of the glass","The distance from the light box to the lens"],"Focal length is the distance between the lens and its focal point."),
  Q(["Which device uses a convex lens to form an image on a screen?","Which is an example of a convex lens in use?"],"A projector",["A periscope mirror","A light switch","A torch battery","A wooden door"],"Convex lenses can form images on a screen, like in a projector."),
  Q(["What does a concave lens look like?","Which describes the shape of a concave lens?"],"It curves (bulges) inwards",["It bulges outwards","It is completely flat","It is round like a ball","It has sharp points"],"A concave lens is thinner in the middle and curves inwards, like it has 'caved in'.","Concave 'caves' in."),
  Q(["What does a concave lens do to light rays?","Light passing through a concave lens will…"],"Diverge (spread apart)",["Converge (come together)","Meet at one point in front of the lens","Stop completely","Turn white"],"Concave lenses make light rays diverge, spreading them apart."),
  Q(["Where are concave lenses used?","Which is an example of a concave lens in use?"],"Binoculars",["A projector screen","A light box bulb","A brick wall","A magnifying mirror"],"Concave lenses are used in binoculars."),
  Q(["A lens makes parallel light rays spread apart. What type of lens is it?","Rays leaving a lens spread out in different directions. Which lens caused this?"],"Concave lens",["Convex lens","A flat mirror","A prism only","An opaque lens"],"Spreading apart (diverging) is what a concave lens does. A convex lens brings rays together."),
  Q(["A lens brings parallel light rays together at one point. What type of lens is it?","Light rays meet at a point after passing through a lens. Which lens is it?"],"Convex lens",["Concave lens","A flat window","A mirror","An opaque block"],"Converging rays to a focal point is what a convex lens does."),
 ]},
 {title:"Anatomy of the Eye",topic:"Light and Sound Extension",src:"notes",qs:[
  Q(["What is the sclera?","Which part of the eye is the white outer coat?"],"The tough white outer coat that covers most of the eyeball",["The coloured part of the eye","The black circle in the middle","The clear fluid behind the lens","The nerve that goes to the brain"],"The sclera is the white part of the eye. It's made of tough material and covers most of the eyeball as its outer coat."),
  Q(["How does the sclera get its blood supply?","What supplies blood to the sclera?"],"Tiny blood vessels in the eyeball",["The optic nerve","The aqueous humour","The lens","It doesn't need blood"],"Tiny blood vessels in the eyeball carry blood to the sclera."),
  Q(["What is the cornea?","Which part of the eye is the clear front layer over the coloured part?"],"The transparent front part of the eye's outer coat, in front of the iris",["The white part of the eye","The coloured muscle of the eye","The light-sensitive layer at the back","The black hole in the middle of the iris"],"The cornea is the clear part of the outer coat at the front of the eye, covering the iris and pupil."),
  Q(["What two jobs does the cornea do?","Why is the cornea so important?"],"It lets light into the eye and helps focus it",["It controls how much light enters and gives eye colour","It sends signals to the brain","It produces tears and moves the eyelid","It changes the shape of the lens"],"The cornea is transparent so light can travel through it, and its curve helps the eye focus light."),
  Q(["What is the iris?","Which part of the eye is coloured?"],"The coloured part of the eye",["The black circle in the middle","The white outer coat","The clear front cover","The fluid behind the lens"],"The iris is the colourful part of the eye, sitting behind the cornea."),
  Q(["The iris is a muscle. What does this let it do?","What is the job of the iris?"],"Control how much light goes through the pupil",["Send images to the brain","Change the shape of the lens","Make the eye's fluid","Protect the eye from dust"],"Because the iris is a muscle, it can change the size of the pupil and control how much light enters."),
  Q(["What is the pupil?","The black circle in the centre of the eye is the…"],"The opening that lets light into the eye",["A coloured muscle","A transparent lens","The white outer coat","A bundle of nerves"],"The pupil is the black circle. It's actually an opening that lets light enter the eye."),
  Q(["What happens to the pupil in dim light?","When there is less light, the pupil will…"],"Dilate (get bigger) to let more light in",["Shrink to let less light in","Close completely","Change colour","Stay exactly the same"],"In dim light the pupil dilates (widens) to let in more light.","Less light means it needs to let more in."),
  Q(["What happens to the pupil in bright light?","When there is more light, the pupil will…"],"Get smaller (constrict) to let less light in",["Dilate to let more light in","Turn white","Move to the side of the eye","Stay fully open"],"In bright light the pupil gets smaller to protect the eye and let less light in."),
  Q(["What is the aqueous humour?","Which fluid sits between the cornea and the lens?"],"A clear, watery fluid between the cornea and lens",["A clear fluid between the lens and retina","The white outer coat","A bundle of neurons","A muscle that changes the lens shape"],"Aqueous humour is a clear, watery fluid between the cornea and lens that keeps them lubricated."),
  Q(["What does the aqueous humour do?","Why is aqueous humour important?"],"It lubricates the cornea and lens",["It sends images to the brain","It gives the eye its colour","It changes the shape of the lens","It blocks light from entering"],"Aqueous humour lubricates the cornea and lens."),
  Q(["What is the space between the cornea and the iris called?","The fluid-filled area at the front of the eye, between cornea and iris, is the…"],"The anterior chamber",["The optic chamber","The retina","The vitreous chamber","The ciliary body"],"The anterior chamber sits between the iris and cornea and is filled with aqueous humour."),
  Q(["What is the vitreous humour?","Which fluid fills the space between the lens and the retina?"],"A clear fluid between the lens and retina",["A clear, watery fluid between the cornea and lens","The coloured part of the eye","A tough white coat","The nerve to the brain"],"Vitreous humour is the clear fluid that fills the eye between the lens and the retina."),
  Q(["Where is the lens of the eye?","What sits directly behind the pupil?"],"Behind the pupil",["In front of the cornea","Behind the retina","Inside the optic nerve","On the outside of the sclera"],"The transparent lens sits just behind the pupil."),
  Q(["What do the ciliary bodies do?","Which muscles change the shape of the eye's lens?"],"Change the shape of the lens to help focus light on the retina",["Control how much light goes through the pupil","Carry signals to the brain","Make the eye white","Produce the vitreous humour"],"The ciliary bodies are muscles that change the lens shape so light is focused onto the retina.","Iris controls the pupil, ciliary bodies control the lens."),
  Q(["Where does the eye focus light to form an image?","Light needs to be focused onto which part at the back of the eye?"],"The retina",["The cornea","The iris","The sclera","The aqueous humour"],"The cornea and lens focus light onto the retina at the back of the eye."),
  Q(["What does the optic nerve do?","What is the job of the optic nerve?"],"Carries electrical impulses from the eye to the brain",["Controls the size of the pupil","Changes the shape of the lens","Lubricates the cornea","Gives the eye its colour"],"The optic nerve is a bundle of neurons that carries electrical impulses from the retina to the brain."),
  Q(["Where in the brain are signals from the eye turned into an image?","The optic nerve carries signals to which part of the brain?"],"The visual cortex, at the back of the brain",["The front of the brain","The spinal cord","The ear","The heart"],"The optic nerve runs from the retina to the visual cortex at the back of the brain, where the signals are converted into an image."),
  Q(["What is the optic nerve made of?","The optic nerve is a bundle of…"],"Neurons (nerve cells)",["Muscles","Blood vessels only","Clear fluid","Bone"],"The optic nerve is made of bundles of neurons."),
  Q(["Which of these parts of the eye is transparent?","Which part of the eye does light pass straight through?"],"The lens",["The iris","The sclera","The optic nerve","The eyelid"],"The transparent parts of the eye are the cornea, aqueous humour, lens and vitreous humour. Light passes through all four."),
  Q(["Which group lists the four transparent parts of the eye?","Light passes through which four clear parts of the eye?"],"Cornea, aqueous humour, lens, vitreous humour",["Iris, pupil, sclera, retina","Cornea, iris, lens, optic nerve","Sclera, lens, retina, eyelid","Pupil, iris, ciliary bodies, sclera"],"Light travels through the cornea, aqueous humour, lens and vitreous humour before reaching the retina."),
  Q(["In what order does light travel through the eye?","Which shows the correct path of light into the eye?"],"Cornea → aqueous humour → pupil → lens → vitreous humour → retina",["Lens → cornea → retina → pupil → vitreous humour","Retina → lens → pupil → cornea","Iris → sclera → lens → optic nerve","Pupil → cornea → retina → lens"],"Light enters through the cornea, crosses the aqueous humour, passes through the pupil and lens, crosses the vitreous humour and lands on the retina. The optic nerve then carries the signal to the brain.","Front to back."),
  Q(["Which part of the eye is NOT transparent?","Light can't pass through which part of the eye?"],"The sclera",["The cornea","The lens","The aqueous humour","The vitreous humour"],"The sclera is the tough white outer coat, so light doesn't pass through it."),
 ]},
]},
{id:"maths",name:"Maths",short:"Ma",h:190,quizzes:[
 {title:"5A Errors and Percentage Error",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["Why are all measurements considered estimates?","Which statement about measurements is true?"],"No instrument can measure a quantity perfectly, so every measurement is only close to the actual value",["Digital instruments always give the exact value","Only measurements in metric units are estimates","Measurements are only estimates if a person reads the scale","A measurement is exact once it is rounded"],"Every measurement depends on the instrument's scale, the units and the person using it, so it can only ever be an estimate of the actual quantity."),
  Q(["Which of these does NOT affect the accuracy of a measurement?","The accuracy of a measurement depends on all of these EXCEPT…"],"The colour of the measuring instrument",["The scale on the measuring instrument","The units used in the measurement","The person's skill at reading the scale","The smallest unit marked on the instrument"],"Accuracy depends on the instrument's scale, the units used and the person's ability to use the instrument and read the scale."),
  Q(["What is the formula for error?","How is the error of a measurement calculated?"],"Error = measurement − actual value",["Error = measurement × actual value","Error = actual value ÷ measurement","Error = measurement + actual value","Error = (measurement ÷ actual value) × 100"],"Error = measurement − actual value. It can come out positive (measured too high) or negative (measured too low)."),
  Q(["What is the formula for percentage error?","Percentage error is calculated using…"],"(Error ÷ actual value) × 100",["(Error ÷ measurement) × 100","(Actual value ÷ error) × 100","Error × 100","(Measurement ÷ actual value) × 100"],"Percentage error = Error ÷ Actual value × 100/1. Always divide by the ACTUAL value, not the measured one.","Which value is the 'true' one?"),
  Q(["What does the absolute value of an error tell you?","What is an absolute error?"],"The size of the error as a positive number, ignoring the sign",["The error rounded to the nearest whole number","The error doubled","The error as a percentage","Only errors where the measurement was too high"],"The absolute value ignores the negative sign, e.g. an error of −5 minutes has an absolute error of 5 minutes."),
  Q(["What is the absolute value of an error of −1.78 litres?","An error of −1.78 L has what absolute value?"],"1.78 L",["−1.78 L","0.178 L","17.8 L","−0.78 L"],"Absolute value just drops the negative sign: 1.78 L."),
