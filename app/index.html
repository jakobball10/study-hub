  Q(["Why might a negative error be recorded instead of an absolute error?","What extra information does a negative error give you?"],"It shows the measurement was lower than the actual value",["It shows the measurement was perfectly accurate","It shows the error was bigger than 100%","It shows the instrument was broken","Negative errors are never recorded"],"The sign tells you the direction: negative means under the actual value, positive means over it. The absolute value loses this information."),
  Q(["A mass is measured as 2.9 kg but the actual value is 2.5 kg. What is the absolute percentage error?","Measured: 2.9 kg. Actual: 2.5 kg. Find the absolute percentage error."],"16%",["13.8%","0.4%","14%","1.6%"],"Error = 2.9 − 2.5 = 0.4 kg. 0.4 ÷ 2.5 × 100 = 16%.","Divide by the actual value, 2.5."),
  Q(["A time is measured as 35 minutes but the actual time is 40 minutes. What is the absolute percentage error?","Measured: 35 min. Actual: 40 min. What is the absolute percentage error?"],"12.5%",["14.3%","−12.5%","5%","87.5%"],"Error = 35 − 40 = −5, absolute error = 5 min. 5 ÷ 40 × 100 = 12.5%."),
  Q(["Measured: 44 seconds. Actual: 40 seconds. What is the absolute percentage error?","A stopwatch reads 44 s when the actual time is 40 s. Find the absolute percentage error."],"10%",["9.1%","4%","11%","90%"],"Error = 4 s. 4 ÷ 40 × 100 = 10%."),
  Q(["Measured: 4.7 L. Actual: 5.0 L. What is the absolute percentage error?","A jug is measured at 4.7 litres but actually holds 5.0 litres. Find the absolute percentage error."],"6%",["6.4%","0.3%","3%","94%"],"Absolute error = 0.3 L. 0.3 ÷ 5 × 100 = 6%."),
  Q(["Measured: 19 L. Actual: 20 L. What is the absolute percentage error?","Find the absolute percentage error when 19 L is measured and the actual volume is 20 L."],"5%",["5.3%","1%","95%","−1%"],"Absolute error = 1 L. 1 ÷ 20 × 100 = 5%."),
  Q(["Measured: 2.8 kg. Actual: 3.2 kg. What is the absolute percentage error?","A bag is weighed at 2.8 kg but is really 3.2 kg. Find the absolute percentage error."],"12.5%",["14.3%","0.4%","4%","87.5%"],"Absolute error = 0.4 kg. 0.4 ÷ 3.2 × 100 = 12.5%."),
  Q(["Measured: 3.4 mL. Actual: 3.2 mL. What is the absolute percentage error?","Find the absolute percentage error for a measurement of 3.4 mL when the actual value is 3.2 mL."],"6.25%",["5.88%","0.2%","2%","106.25%"],"Error = 0.2 mL. 0.2 ÷ 3.2 × 100 = 6.25%."),
  Q(["Measured: 2.49 kL. Actual: 2.4 kL. What is the absolute percentage error?","Find the absolute percentage error: measurement 2.49 kL, actual value 2.4 kL."],"3.75%",["3.61%","0.09%","9%","37.5%"],"Error = 0.09 kL. 0.09 ÷ 2.4 × 100 = 3.75%."),
  Q(["You guess there are 155 lollies in a jar, but there are actually 180. What is your absolute percentage error, to one decimal place?","A guess of 155 lollies is made when there are really 180. Find the absolute percentage error (1 d.p.)."],"13.9%",["16.1%","25%","86.1%","13.8%"],"Error = 25. 25 ÷ 180 × 100 = 13.888… ≈ 13.9%. Dividing by 155 instead gives the wrong answer 16.1%."),
  Q(["Danny estimates a trip will cost $100 but he actually spends $80. What is the percentage error?","An estimate of $100 is made but the actual cost is $80. Find the percentage error."],"25%",["20%","80%","$20","125%"],"Error = $20. 20 ÷ 80 (the actual amount) × 100 = 25%."),
  Q(["A 1% error can be described as 99% accuracy. What is the accuracy when there is an error of 3 g in an actual weight of 120 g?","An error of 3 grams is made on an actual weight of 120 grams. What is the accuracy?"],"97.5%",["2.5%","97%","99.75%","40%"],"Percentage error = 3 ÷ 120 × 100 = 2.5%, so accuracy = 100 − 2.5 = 97.5%."),
  Q(["A time is measured as 12.6 s when the actual time is 12.75 s. What is the accuracy, to one decimal place?","Measured: 12.6 seconds. Actual: 12.75 seconds. Find the accuracy (1 d.p.)."],"98.8%",["1.2%","99.2%","98.2%","88.0%"],"Error = 0.15 s. 0.15 ÷ 12.75 × 100 ≈ 1.18%, so accuracy ≈ 98.8%."),
  Q(["A distance is measured four times: 22.8 km, 22.9 km, 23.2 km and 23.0 km. What is the mean?","Find the average of these four readings: 22.8, 22.9, 23.2 and 23.0 km."],"22.975 km",["23.0 km","22.9 km","91.9 km","23.1 km"],"(22.8 + 22.9 + 23.2 + 23.0) ÷ 4 = 91.9 ÷ 4 = 22.975 km. Taking several readings and averaging them reduces error."),
  Q(["The mean of four distance readings is 22.975 km and the actual distance is 23.1 km. What is the percentage error, to two decimal places?","Mean reading 22.975 km, actual 23.1 km. Find the percentage error (2 d.p.)."],"0.54%",["0.125%","0.13%","0.55%","5.41%"],"Error = 0.125 km. 0.125 ÷ 23.1 × 100 = 0.5411… ≈ 0.54%."),
  Q(["Each gobble actually weighs 6.71 g. What is the actual weight of a bag of 50?","A bag holds 50 sweets that each weigh 6.71 g. What does the bag weigh?"],"335.5 g",["350 g","336 g","13.42 g","345.5 g"],"50 × 6.71 = 335.5 g."),
  Q(["A bag of 50 sweets is labelled 350 g but actually weighs 335.5 g. What is the percentage error, to two decimal places?","Labelled weight 350 g, actual weight 335.5 g. Find the percentage error (2 d.p.)."],"4.32%",["4.14%","14.5%","95.68%","4.5%"],"Error = 14.5 g. 14.5 ÷ 335.5 × 100 ≈ 4.32%."),
  Q(["Kelly's actual height is 173.4 cm and her measurement had a percentage error of 0.5%. What could her recorded height be (1 d.p.)?","A height of 173.4 cm is measured with a 0.5% error. What are the possible recorded heights?"],"172.5 cm or 174.3 cm",["173.9 cm only","172.9 cm or 173.9 cm","173.4 cm only","165.0 cm or 181.8 cm"],"0.5% of 173.4 = 0.867 cm. 173.4 − 0.867 ≈ 172.5 cm and 173.4 + 0.867 ≈ 174.3 cm."),
 ]},
 {title:"5A Limits of Accuracy",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["What are the limits of accuracy of a measurement?","Define limits of accuracy."],"The smallest and largest possible values that a measurement could be",["The highest and lowest numbers on the measuring scale","The difference between two measurements","The error as a percentage","The number of decimal places shown"],"Limits of accuracy are the lower and upper bounds for the true value of a measurement."),
  Q(["How do you find the lower limit of accuracy?","Lower limit = ?"],"Recorded measurement − 0.5 × smallest unit of measure",["Recorded measurement − 1 × smallest unit","Recorded measurement − 0.5","Recorded measurement ÷ 2","Recorded measurement − 0.1 × smallest unit"],"Lower limit = recorded − 0.5 × smallest unit. Upper limit = recorded + 0.5 × smallest unit."),
  Q(["How do you find the upper limit of accuracy?","Upper limit = ?"],"Recorded measurement + 0.5 × smallest unit of measure",["Recorded measurement + 1 × smallest unit","Recorded measurement × 1.5","Recorded measurement + 0.5","Recorded measurement + 5 × smallest unit"],"Upper limit = recorded + 0.5 × smallest unit (the upper limit itself is not included)."),
  Q(["A ruler with mm markings records 36 mm. What are the limits of accuracy?","A length is measured as 36 mm to the nearest millimetre. Give the limits of accuracy."],"35.5 mm to 36.5 mm",["35 mm to 37 mm","35.95 mm to 36.05 mm","36 mm to 37 mm","30 mm to 40 mm"],"Smallest unit is 1 mm, so 36 ± 0.5. The upper limit 36.5 mm is not included, because it would round up to 37."),
  Q(["A scale shows grams to one decimal place and reads 6.7 g. What are the limits of accuracy?","Measured mass: 6.7 g (to 0.1 g). Give the lower and upper limits."],"6.65 g to 6.75 g",["6.6 g to 6.8 g","6.2 g to 7.2 g","6.69 g to 6.71 g","6.7 g to 6.75 g"],"Smallest unit = 0.1 g. 0.5 × 0.1 = 0.05, so 6.7 ± 0.05."),
  Q(["One chocolate is weighed as 6.7 g (to 0.1 g). What are the limits of accuracy for a bag of 10?","Each chocolate reads 6.7 g to one decimal place. Find the limits for a bag of 10 chocolates."],"66.5 g to 67.5 g",["66.95 g to 67.05 g","67 g to 68 g","66 g to 68 g","65 g to 69 g"],"Bag = 10 × 6.7 = 67 g. Max error = 10 × 0.05 = 0.5 g, so 67 ± 0.5."),
  Q(["A biscuit is weighed as 58 g to the nearest gram. What are the limits of accuracy?","Measured: 58 g (nearest whole gram). Give the limits of accuracy."],"57.5 g to 58.5 g",["57 g to 59 g","57.95 g to 58.05 g","58 g to 59 g","55 g to 60 g"],"Smallest unit is 1 g, so 58 ± 0.5."),
  Q(["A biscuit weighs 58 g to the nearest gram. What are the limits of accuracy for a box of 10?","Find the limits for a box of 10 biscuits that each read 58 g (nearest gram)."],"575 g to 585 g",["579.5 g to 580.5 g","570 g to 590 g","575.5 g to 584.5 g","580 g to 585 g"],"Box = 580 g. Max error = 10 × 0.5 = 5 g, so 580 ± 5."),
  Q(["A packet of chips reads 25.5 g on a scale accurate to 0.1 g. What are the limits of accuracy?","Measured: 25.5 g (to one decimal place). Give the limits of accuracy."],"25.45 g to 25.55 g",["25 g to 26 g","25.4 g to 25.6 g","25.495 g to 25.505 g","25.5 g to 25.55 g"],"0.5 × 0.1 = 0.05, so 25.5 ± 0.05."),
  Q(["Chips packets each read 25.5 g (to 0.1 g). What are the limits of accuracy for a box of 20?","Find the limits for 20 packets that each measure 25.5 g to one decimal place."],"509 g to 511 g",["509.95 g to 510.05 g","500 g to 520 g","505 g to 515 g","510 g to 511 g"],"Box = 20 × 25.5 = 510 g. Max error = 20 × 0.05 = 1 g, so 510 ± 1."),
  Q(["A pen weighs 15 g to the nearest gram. What are the limits of accuracy for a box of 30?","Pens each weigh 15 g (nearest gram). Find the limits for a box of 30."],"435 g to 465 g",["449.5 g to 450.5 g","420 g to 480 g","445 g to 455 g","435.5 g to 464.5 g"],"Box = 450 g. Max error = 30 × 0.5 = 15 g, so 450 ± 15."),
  Q(["A jug with 10 mL markings measures a drink as 1.51 L. What are the limits of accuracy?","Measured: 1.51 L on a jug marked every 10 mL. Give the limits of accuracy."],"1.505 L to 1.515 L",["1.50 L to 1.52 L","1.46 L to 1.56 L","1.5095 L to 1.5105 L","1.01 L to 2.01 L"],"10 mL = 0.01 L. 0.5 × 0.01 = 0.005 L, so 1.51 ± 0.005."),
  Q(["Give the limits of accuracy for 103 m.","A distance is recorded as 103 m. What are its limits of accuracy?"],"102.5 m to 103.5 m",["102 m to 104 m","102.95 m to 103.05 m","98 m to 108 m","103 m to 104 m"],"Smallest unit is 1 m, so 103 ± 0.5."),
  Q(["Give the limits of accuracy for 3.2 mm.","A length is recorded as 3.2 mm. What are the limits of accuracy?"],"3.15 mm to 3.25 mm",["3.1 mm to 3.3 mm","2.7 mm to 3.7 mm","3.195 mm to 3.205 mm","3.2 mm to 3.25 mm"],"Smallest unit is 0.1 mm. 0.5 × 0.1 = 0.05, so 3.2 ± 0.05."),
  Q(["Give the limits of accuracy for 45.24 hours.","A time is recorded as 45.24 h. What are the limits of accuracy?"],"45.235 h to 45.245 h",["45.23 h to 45.25 h","45.19 h to 45.29 h","44.74 h to 45.74 h","45.2395 h to 45.2405 h"],"Smallest unit is 0.01 h. 0.5 × 0.01 = 0.005, so 45.24 ± 0.005."),
  Q(["Give the limits of accuracy for 3.106 kg.","A mass is recorded as 3.106 kg. What are the limits of accuracy?"],"3.1055 kg to 3.1065 kg",["3.105 kg to 3.107 kg","3.101 kg to 3.111 kg","3.056 kg to 3.156 kg","2.606 kg to 3.606 kg"],"Smallest unit is 0.001 kg. Half of that is 0.0005, so 3.106 ± 0.0005."),
  Q(["Give the limits of accuracy for 0.0357 L.","A volume is recorded as 0.0357 L. What are the limits of accuracy?"],"0.03565 L to 0.03575 L",["0.0356 L to 0.0358 L","0.0352 L to 0.0362 L","0.03569 L to 0.03571 L","0.0307 L to 0.0407 L"],"Smallest unit is 0.0001 L. Half of that is 0.00005, so 0.0357 ± 0.00005."),
  Q(["A scale shows whole kilograms. Which actual weight would NOT give a reading of 12 kg?","A digital scale rounds to the nearest kilogram. Which weight would NOT show as 12 kg?"],"12.61 kg",["12.3 kg","12.42 kg","11.83 kg","11.6 kg"],"Readings of 12 kg come from weights from 11.5 kg up to (not including) 12.5 kg. 12.61 kg rounds to 13 kg."),
  Q(["A scale shows whole kilograms. Which actual weight WOULD give a reading of 12 kg?","Which of these weights would show as 12 kg on a scale that rounds to the nearest kilogram?"],"11.83 kg",["11.49 kg","12.61 kg","12.72 kg","11.2 kg"],"11.83 kg is between 11.5 and 12.5, so it rounds to 12. 11.49 kg rounds down to 11 kg."),
  Q(["A scale showing whole grams reads 7 g for one sweet. Which could be its actual weight?","A sweet reads 7 g on a scale that rounds to the nearest gram. Which actual weight is possible?"],"6.52 g",["6.3 g","7.56 g","6.42 g","7.61 g"],"A reading of 7 g means the actual weight is from 6.5 g up to (not including) 7.5 g. Only 6.52 g fits."),
  Q(["One of 15 identical figurines reads 45 g on a whole-gram scale. What is the difference between the lowest and highest possible weight of all 15?","Figurines each read 45 g (nearest gram). For 15 figurines, how far apart are the lower and upper limits?"],"15 g",["1 g","7.5 g","30 g","0.5 g"],"Lower = 15 × 44.5 = 667.5 g. Upper = 15 × 45.5 = 682.5 g. Difference = 15 g."),
  Q(["A dog's weight is recorded as 21.5 kg, but a more accurate scale shows this has a 1.5% error. What could its actual weight be (1 d.p.)?","Recorded: 21.5 kg with a 1.5% error. What are the possible actual weights?"],"21.2 kg or 21.8 kg",["21.5 kg only","20.0 kg or 23.0 kg","21.4 kg or 21.6 kg","21.3 kg or 21.7 kg"],"Solving 21.5 ÷ 1.015 ≈ 21.2 kg and 21.5 ÷ 0.985 ≈ 21.8 kg."),
 ]},
 {title:"5B Length and Perimeter",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["What is perimeter?","Which definition describes perimeter?"],"The distance around the outside of a closed shape",["The space inside a shape","The distance across the middle of a shape","The longest side of a shape","The number of sides of a shape"],"Perimeter is the total length of the boundary of a closed shape."),
  Q(["In a shape diagram, what do matching dash markings on two sides mean?","Sides with the same markings are…"],"Those sides are equal in length",["Those sides are parallel","Those sides are at right angles","Those sides are unknown","Those sides are half as long"],"Sides with the same markings are the same length. Arrow markings show parallel sides."),
  Q(["How do you convert kilometres to metres?","km → m: what do you do?"],"Multiply by 1000",["Divide by 1000","Multiply by 100","Multiply by 10","Divide by 100"],"1 km = 1000 m, so km → m is × 1000."),
  Q(["How do you convert metres to centimetres?","m → cm: what do you do?"],"Multiply by 100",["Divide by 100","Multiply by 1000","Multiply by 10","Divide by 10"],"1 m = 100 cm, so m → cm is × 100."),
  Q(["How do you convert millimetres to centimetres?","mm → cm: what do you do?"],"Divide by 10",["Multiply by 10","Divide by 100","Multiply by 100","Divide by 1000"],"1 cm = 10 mm, so mm → cm is ÷ 10. Going to a bigger unit means dividing."),
  Q(["Convert 8 m to mm.","How many millimetres are in 8 metres?"],"8000 mm",["800 mm","80 mm","80 000 mm","0.008 mm"],"m → mm is × 1000 (× 100 then × 10). 8 × 1000 = 8000 mm."),
  Q(["Convert 110 000 mm to m.","How many metres is 110 000 millimetres?"],"110 m",["1100 m","11 m","11 000 m","1.1 m"],"mm → m is ÷ 1000. 110 000 ÷ 1000 = 110 m."),
  Q(["Convert 0.00001 km to cm.","How many centimetres is 0.00001 km?"],"1 cm",["0.1 cm","10 cm","100 cm","0.01 cm"],"km → cm is × 100 000. 0.00001 × 100 000 = 1 cm."),
  Q(["Convert 0.02 m to mm.","How many millimetres is 0.02 m?"],"20 mm",["2 mm","200 mm","0.2 mm","2000 mm"],"0.02 × 1000 = 20 mm."),
  Q(["Convert 28 400 cm to km.","How many kilometres is 28 400 cm?"],"0.284 km",["2.84 km","28.4 km","284 km","0.0284 km"],"cm → km is ÷ 100 000. 28 400 ÷ 100 000 = 0.284 km."),
  Q(["Convert 62 743 000 mm to km.","How many kilometres is 62 743 000 millimetres?"],"62.743 km",["627.43 km","6274.3 km","6.2743 km","62 743 km"],"mm → km is ÷ 1 000 000. 62 743 000 ÷ 1 000 000 = 62.743 km."),
  Q(["Find the perimeter of a rectangle measuring 12 m by 18 m.","A rectangle has sides of 12 m and 18 m. What is its perimeter?"],"60 m",["30 m","216 m","42 m","48 m"],"P = 2 × 12 + 2 × 18 = 24 + 36 = 60 m."),
  Q(["An isosceles triangle has two sides of 5 cm and a base of 3 cm. Find its perimeter.","Find the perimeter of a triangle with sides 5 cm, 5 cm and 3 cm."],"13 cm",["8 cm","15 cm","18 cm","7.5 cm"],"P = 2 × 5 + 3 = 13 cm."),
  Q(["An isosceles triangle has two sides of 10 cm and a base of 7 cm. Find its perimeter.","Find the perimeter of a triangle with sides 10, 10 and 7 cm."],"27 cm",["17 cm","24 cm","35 cm","70 cm"],"P = 2 × 10 + 7 = 27 cm."),
  Q(["A kite has two sides of 3 km and two sides of 6 km. Find its perimeter.","What is the perimeter of a kite with side lengths 3, 3, 6 and 6 km?"],"18 km",["9 km","12 km","36 km","24 km"],"P = 2 × 3 + 2 × 6 = 18 km."),
  Q(["Find the perimeter of a square with side length 2.5 m.","A square has sides of 2.5 m. What is its perimeter?"],"10 m",["6.25 m","5 m","7.5 m","12.5 m"],"P = 4 × 2.5 = 10 m."),
  Q(["An L-shaped figure has only right angles. Its total height is 6 cm and its total width is 5 cm. Find its perimeter.","A shape with all right angles is 6 cm tall and 5 cm wide overall. What is its perimeter?"],"22 cm",["30 cm","11 cm","17 cm","26 cm"],"In a shape with only right angles, the horizontal pieces add to 2 × the width and the vertical pieces add to 2 × the height. P = 2 × 6 + 2 × 5 = 22 cm.","Slide the steps out to make a rectangle."),
  Q(["A shape has sides 5 m, 5 m, 4 m and x m. Its perimeter is 16 m. Find x.","Two sides are 5 m, one is 4 m and the perimeter is 16 m. What is the missing side?"],"2 m",["6 m","14 m","4 m","1 m"],"2 × 5 + 4 + x = 16, so 14 + x = 16 and x = 2 m."),
  Q(["A shape has sides 6 mm, 6 mm, 4 mm and x mm. Its perimeter is 23 mm. Find x.","Find the missing side when the other sides are 6, 6 and 4 mm and P = 23 mm."],"7 mm",["9 mm","13 mm","16 mm","5 mm"],"16 + x = 23, so x = 7 mm."),
  Q(["An isosceles triangle has two sides of 5 cm and a perimeter of 14 cm. Find the third side.","P = 14 cm, two equal sides of 5 cm. What is the base?"],"4 cm",["9 cm","2 cm","19 cm","24 cm"],"14 − 2 × 5 = 4 cm."),
  Q(["An isosceles triangle has two sides of 2.1 m and a perimeter of 6.4 m. Find the third side.","Two sides are 2.1 m and P = 6.4 m. What is the third side?"],"2.2 m",["4.3 m","2.1 m","4.2 m","1.1 m"],"6.4 − 4.2 = 2.2 m."),
  Q(["A triangle has one side of 7 mm and two equal sides of x mm. Its perimeter is 35 mm. Find x.","7 + 2x = 35. What is x?"],"14 mm",["28 mm","21 mm","7 mm","17.5 mm"],"2x = 28, so x = 14 mm."),
  Q(["A regular octagon has a perimeter of 33.6 m. How long is each side?","Each side of a regular octagon with P = 33.6 m is…"],"4.2 m",["5.6 m","4.8 m","8.4 m","3.36 m"],"An octagon has 8 equal sides: 33.6 ÷ 8 = 4.2 m."),
  Q(["A lion enclosure has three fence sections of 20 m and two of 15.5 m and 32.5 m. Find its perimeter.","Five straight fences measure 20, 20, 20, 15.5 and 32.5 m. What is the total perimeter?"],"108 m",["68 m","88 m","128 m","98 m"],"3 × 20 + 15.5 + 32.5 = 60 + 48 = 108 m."),
  Q(["A photo 12 cm wide and 20 cm long has a 3 cm wide frame all the way around. Find the outside perimeter.","What is the outer perimeter of a 12 cm × 20 cm photo surrounded by a 3 cm frame?"],"88 cm",["64 cm","76 cm","82 cm","100 cm"],"The frame adds 3 cm on each side: 18 cm × 26 cm. P = 2 × 18 + 2 × 26 = 88 cm.","The frame adds 3 cm on BOTH sides."),
  Q(["A rectangle has length 2x cm and width x cm. Its perimeter is 12.6 cm. Find x.","2x by x rectangle, P = 12.6 cm. What is x?"],"2.1 cm",["4.2 cm","3.15 cm","6.3 cm","1.05 cm"],"P = 2(2x) + 2x = 6x = 12.6, so x = 2.1 cm."),
  Q(["A right-angled triangle has sides 3x, 4x and 5x km. Its perimeter is 84 km. Find x.","3x + 4x + 5x = 84. Solve for x."],"7 km",["12 km","21 km","28 km","6 km"],"12x = 84, so x = 7 km."),
  Q(["Write the perimeter rule for a rectangle with sides a and b.","Which rule gives the perimeter of an a by b rectangle?"],"P = 2a + 2b",["P = ab","P = a + b","P = 4ab","P = 2ab"],"Two sides of length a and two of length b."),
  Q(["Write the perimeter rule for an isosceles triangle with two sides of a and a base of b.","Two sides are a, one side is b. Which rule gives P?"],"P = 2a + b",["P = a + 2b","P = 3a","P = 2ab","P = a + b"],"Add all three: a + a + b = 2a + b."),
  Q(["A regular hexagon has sides of x/3. What is the rule for its perimeter?","Each side of a regular hexagon is x ÷ 3. Which rule gives P?"],"P = 2x",["P = 6x","P = x/3","P = 3x","P = x/2"],"P = 6 × x/3 = 2x."),
  Q(["What is a royal cubit?","The ancient Egyptian royal cubit measured…"],"The distance from the tip of the middle finger to the elbow",["The width of a thumb","The length of a foot","The distance between outstretched arms","The height of a pharaoh"],"The royal cubit was an early unit of length used in ancient Egypt."),
 ]},
 {title:"5C Circumference and Sectors",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["What is the formula for the circumference of a circle?","Circumference C = ?"],"C = 2πr or C = πd",["C = πr²","C = 2πd","C = πr","C = r²"],"The circumference is 2πr, or πd since d = 2r. πr² is the AREA."),
  Q(["How are the radius and diameter related?","The diameter of a circle is…"],"d = 2r (the diameter is twice the radius)",["r = 2d","d = πr","d = r²","d = r + 2"],"The diameter goes all the way across through the centre, so it's 2 radii."),
  Q(["Which values can be used to approximate π?","π is roughly equal to…"],"22/7 or 3.14",["7/22 or 0.314","3 or 4","2.71 or 1.41","22 or 7"],"22/7 and 3.14 are common approximations. A calculator's π button is more precise."),
  Q(["What is a sector?","Define a sector."],"A portion of a circle enclosed by two radii and an arc",["A straight line across a circle","The distance around a circle","A shape with four sides","A line from the centre to the edge"],"A sector is like a pizza slice: two radii and the arc between them."),
  Q(["What is a semicircle?","A sector that is half a circle is called…"],"A half circle (180° sector)",["A quarter circle (90° sector)","A full circle","A sector of 270°","A circle with no radius"],"Semicircle = half circle. A quadrant is a quarter circle."),
  Q(["What is a quadrant?","A sector that is a quarter of a circle is called a…"],"A quarter circle (90° sector)",["A half circle","A sector of 45°","A three-quarter circle","A full circle"],"Quadrant = quarter circle, angle 90°."),
  Q(["What is the formula for the perimeter of a sector?","Sector perimeter P = ?"],"P = 2r + (θ/360) × 2πr",["P = (θ/360) × 2πr","P = (θ/360) × πr²","P = 2πr + θ","P = r + (θ/360) × 2πr"],"Two straight radii (2r) plus the arc, which is a fraction θ/360 of the full circumference.","Don't forget the two straight edges!"),
  Q(["Find the circumference of a circle with radius 3 cm, to 2 decimal places.","C for r = 3 cm (2 d.p.)?"],"18.85 cm",["9.42 cm","28.27 cm","6.00 cm","37.70 cm"],"C = 2 × π × 3 = 6π ≈ 18.85 cm."),
  Q(["Find the circumference of a circle with radius 4 m, to 2 decimal places.","C for r = 4 m (2 d.p.)?"],"25.13 m",["12.57 m","50.27 m","8.00 m","16.00 m"],"C = 2 × π × 4 = 8π ≈ 25.13 m."),
  Q(["Find the circumference of a circle with diameter 10 cm, to 2 decimal places.","A circle is 10 cm across. Find its circumference (2 d.p.)."],"31.42 cm",["62.83 cm","78.54 cm","15.71 cm","314.16 cm"],"C = πd = π × 10 ≈ 31.42 cm."),
  Q(["Using π ≈ 22/7, find the circumference of a circle with diameter 14 cm.","With π = 22/7, what is C when d = 14 cm?"],"44 cm",["88 cm","22 cm","154 cm","308 cm"],"C = 22/7 × 14 = 44 cm."),
  Q(["Give the exact circumference of a circle with radius 4 cm.","Write C exactly in terms of π for r = 4 cm."],"8π cm",["16π cm","4π cm","25.13 cm","8 cm"],"C = 2 × π × 4 = 8π cm. 'Exact' means leave π in the answer."),
  Q(["Give the exact circumference of a circle with radius 6 m.","C exactly for r = 6 m?"],"12π m",["36π m","6π m","37.70 m","12 m"],"C = 2 × π × 6 = 12π m."),
  Q(["What does it mean to give an answer 'exactly' with π?","An exact answer for C = 2π × 3 is…"],"Leave π in the answer, e.g. 6π",["Round to 2 decimal places","Use π = 3","Round to the nearest whole number","Use π = 22/7"],"A rounded decimal like 18.85 is an approximation. 6π is exact."),
  Q(["Find the perimeter of a sector with radius 7 m and angle 100°, to 2 decimal places.","Sector r = 7 m, θ = 100°. Perimeter (2 d.p.)?"],"26.22 m",["12.22 m","19.22 m","42.76 m","57.98 m"],"P = 2 × 7 + 100/360 × 2π × 7 = 14 + 35π/9 ≈ 26.22 m. Leaving off the 14 gives 12.22 m."),
  Q(["Find the perimeter of a sector with radius 2 mm and angle 80°, to 2 decimal places.","Sector r = 2 mm, θ = 80°. Perimeter (2 d.p.)?"],"6.79 mm",["2.79 mm","4.79 mm","16.57 mm","8.00 mm"],"P = 4 + 80/360 × 4π = 4 + 8π/9 ≈ 6.79 mm."),
  Q(["Give the exact perimeter of a sector with radius 2 m and angle 270°.","Exact perimeter: r = 2 m, θ = 270°."],"4 + 3π m",["3π m","7π m","2 + 3π m","4 + 4π m"],"P = 2 × 2 + 3/4 × 2π × 2 = 4 + 3π m. These can't be combined because one has π and one doesn't."),
  Q(["Find the perimeter of a quadrant with radius 3 cm, to 2 decimal places.","Quarter circle, r = 3 cm. Perimeter (2 d.p.)?"],"10.71 cm",["4.71 cm","7.71 cm","18.85 cm","12.42 cm"],"P = 2 × 3 + 90/360 × 2π × 3 = 6 + 1.5π ≈ 10.71 cm."),
  Q(["Give the exact perimeter of a semicircle with radius 8 cm.","Exact perimeter of a half circle with r = 8 cm?"],"16 + 8π cm",["8π cm","16π cm","8 + 8π cm","24π cm"],"Straight edge = diameter = 16 cm. Curved edge = half of 2π × 8 = 8π. P = 16 + 8π cm."),
  Q(["What fraction of a circle is a 270° sector?","270/360 simplifies to…"],"3/4",["2/3","1/4","27/36 can't be simplified","4/3"],"270 ÷ 90 = 3 and 360 ÷ 90 = 4, so 3/4."),
  Q(["What fraction of a circle is a 100° sector, in simplest form?","100/360 simplifies to…"],"5/18",["1/3","10/36","5/9","1/36"],"Divide both by 20: 5/18."),
  Q(["Why can't 4 + 3π be simplified to 7π?","4 + 3π stays as it is because…"],"4 and 3π are not like terms",["π must always be written first","You can only add numbers with decimals","7π is too big","Exact answers can't use addition"],"Only terms with π can be combined with each other, just like 4 + 3x can't become 7x."),
 ]},
 {title:"5D Area of 2D Shapes",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["What is area?","Which definition describes area?"],"The amount of space enclosed within the boundaries of a 2D shape",["The distance around the outside of a shape","The amount of space inside a 3D object","The length of the longest side","The number of corners"],"Area measures the space inside a 2D shape, in square units."),
  Q(["How do you convert m² to cm²?","m² → cm²: what do you multiply by?"],"Multiply by 100² = 10 000",["Multiply by 100","Multiply by 1000","Divide by 10 000","Multiply by 10"],"1 m = 100 cm, so 1 m² = 100 × 100 = 10 000 cm²."),
  Q(["How do you convert cm² to mm²?","cm² → mm²: what do you multiply by?"],"Multiply by 10² = 100",["Multiply by 10","Multiply by 1000","Divide by 100","Multiply by 10 000"],"1 cm = 10 mm, so 1 cm² = 10 × 10 = 100 mm²."),
  Q(["How do you convert km² to m²?","km² → m²: what do you multiply by?"],"Multiply by 1000² = 1 000 000",["Multiply by 1000","Multiply by 100 000","Divide by 1 000 000","Multiply by 10 000"],"1 km = 1000 m, so 1 km² = 1000 × 1000 = 1 000 000 m²."),
  Q(["Convert 859 mm² to cm².","859 mm² = ? cm²"],"8.59 cm²",["85.9 cm²","0.859 cm²","85 900 cm²","8590 cm²"],"mm² → cm² is ÷ 100. 859 ÷ 100 = 8.59 cm²."),
  Q(["Convert 2.37 m² to cm².","2.37 m² = ? cm²"],"23 700 cm²",["237 cm²","2370 cm²","237 000 cm²","0.000237 cm²"],"m² → cm² is × 10 000. 2.37 × 10 000 = 23 700 cm²."),
  Q(["Convert 14 210 cm² to m².","14 210 cm² = ? m²"],"1.421 m²",["142.1 m²","14.21 m²","0.1421 m²","142 100 000 m²"],"cm² → m² is ÷ 10 000. 14 210 ÷ 10 000 = 1.421 m²."),
  Q(["Convert 3.16 cm² to mm².","3.16 cm² = ? mm²"],"316 mm²",["31.6 mm²","3160 mm²","0.0316 mm²","31 600 mm²"],"cm² → mm² is × 100. 3.16 × 100 = 316 mm²."),
  Q(["What is the area formula for a triangle?","A triangle's area = ?"],"A = ½bh",["A = bh","A = ½(a + b)h","A = b + h","A = ½xy"],"A triangle is half of a parallelogram with the same base and perpendicular height."),
  Q(["What is the area formula for a parallelogram?","A parallelogram's area = ?"],"A = bh (base × perpendicular height)",["A = ½bh","A = base × slanted side","A = ½xy","A = 2b + 2h"],"Use the perpendicular height, not the slanted side length."),
  Q(["What is the area formula for a trapezium?","A trapezium's area = ?"],"A = ½(a + b)h",["A = (a + b)h","A = ½abh","A = ½bh","A = a × b × h"],"Average the two parallel sides, then multiply by the perpendicular height."),
  Q(["What is the area formula for a rhombus or a kite?","A rhombus or kite with diagonals x and y has area…"],"A = ½xy",["A = xy","A = x + y","A = ½(x + y)","A = 2xy"],"Half the product of the diagonals."),
  Q(["What is the area formula for a sector?","Sector area = ?"],"A = (θ/360) × πr²",["A = (θ/360) × 2πr","A = πr²","A = 2r + (θ/360) × 2πr","A = θ × r²"],"A sector is a fraction θ/360 of the full circle's area πr²."),
  Q(["Find the area of a rectangle 7 m by 3 m.","Area of a 7 m × 3 m rectangle?"],"21 m²",["20 m²","10 m²","21 m","42 m²"],"A = lw = 7 × 3 = 21 m². Area units are squared."),
  Q(["Find the area of a triangle with base 11 km and perpendicular height 5 km.","Triangle: b = 11 km, h = 5 km. Area?"],"27.5 km²",["55 km²","16 km²","27.5 km","32 km²"],"A = ½ × 11 × 5 = 27.5 km²."),
  Q(["Find the area of a triangle with base 9 mm and perpendicular height 8 mm.","Triangle: b = 9 mm, h = 8 mm. Area?"],"36 mm²",["72 mm²","17 mm²","34 mm²","36 mm"],"A = ½ × 9 × 8 = 36 mm²."),
  Q(["Find the area of a parallelogram with base 3 cm and perpendicular height 1.5 cm.","Parallelogram: b = 3 cm, h = 1.5 cm. Area?"],"4.5 cm²",["2.25 cm²","9 cm²","4.5 cm","6 cm²"],"A = bh = 3 × 1.5 = 4.5 cm²."),
  Q(["Find the area of a parallelogram with base 4 m and perpendicular height 1.8 m.","Parallelogram: b = 4 m, h = 1.8 m. Area?"],"7.2 m²",["3.6 m²","11.6 m²","5.8 m²","14.4 m²"],"A = 4 × 1.8 = 7.2 m²."),
  Q(["Find the area of a rhombus with diagonals 10 mm and 9 mm.","Rhombus diagonals: 10 mm and 9 mm. Area?"],"45 mm²",["90 mm²","19 mm²","9.5 mm²","38 mm²"],"A = ½ × 10 × 9 = 45 mm²."),
  Q(["Find the area of a kite with diagonals 16 km and 10 km.","Kite diagonals: 16 km and 10 km. Area?"],"80 km²",["160 km²","26 km²","13 km²","52 km²"],"A = ½ × 16 × 10 = 80 km²."),
  Q(["Find the area of a trapezium with parallel sides 4 m and 6 m and perpendicular height 3 m.","Trapezium: a = 4, b = 6, h = 3 (m). Area?"],"15 m²",["30 m²","72 m²","13 m²","36 m²"],"A = ½(4 + 6) × 3 = 5 × 3 = 15 m²."),
  Q(["Find the area of a trapezium with parallel sides 12 m and 5 m and perpendicular height 4 m.","Trapezium: a = 12, b = 5, h = 4 (m). Area?"],"34 m²",["68 m²","120 m²","21 m²","40 m²"],"A = ½(12 + 5) × 4 = 8.5 × 4 = 34 m²."),
  Q(["Find the area of a circle with radius 5.1 cm, to 2 decimal places.","Circle area for r = 5.1 cm (2 d.p.)?"],"81.71 cm²",["32.04 cm²","26.01 cm²","16.02 cm²","326.85 cm²"],"A = π × 5.1² = π × 26.01 ≈ 81.71 cm²."),
  Q(["Find the area of a circle with radius 3.4 m, to 2 decimal places.","Circle area for r = 3.4 m (2 d.p.)?"],"36.32 m²",["21.36 m²","10.68 m²","11.56 m²","145.27 m²"],"A = π × 3.4² = π × 11.56 ≈ 36.32 m²."),
  Q(["Find the area of a sector with radius 4 m and angle 260°, to 2 decimal places.","Sector: r = 4 m, θ = 260°. Area (2 d.p.)?"],"36.30 m²",["50.27 m²","18.15 m²","13.96 m²","26.15 m²"],"A = 260/360 × π × 16 = 13/18 × 16π ≈ 36.30 m²."),
  Q(["Find the area of a sector with radius 3 cm and angle 280°, to 2 decimal places.","Sector: r = 3 cm, θ = 280°. Area (2 d.p.)?"],"21.99 cm²",["28.27 cm²","14.66 cm²","7.00 cm²","6.28 cm²"],"A = 280/360 × π × 9 = 7/9 × 9π = 7π ≈ 21.99 cm²."),
  Q(["Find the area of a sector with radius 5 m and angle 120°, to 2 decimal places.","Sector: r = 5 m, θ = 120°. Area (2 d.p.)?"],"26.18 m²",["78.54 m²","10.47 m²","52.36 m²","8.33 m²"],"A = 120/360 × π × 25 = ⅓ × 25π ≈ 26.18 m²."),
  Q(["When finding the area of a parallelogram or triangle, which height must you use?","The 'h' in area formulas is always…"],"The perpendicular height (at 90° to the base)",["The longest side","The slanted side","Any side that isn't the base","Half the base"],"The height must be measured at right angles to the base."),
 ]},
 {title:"5E Composite Shapes",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["What is a composite shape?","Which describes a composite shape?"],"A shape made up of more than one basic shape",["A shape with curved sides only","A 3D shape","A shape with no right angles","A regular polygon"],"Composite shapes are built from basic shapes like rectangles, triangles and circles."),
  Q(["How can you find the area of a composite shape?","Which methods work for composite shape areas?"],"Add and/or subtract the areas of the basic shapes",["Multiply the areas of each part together","Only add the perimeters","Use the formula πr² for the whole shape","Average the areas of each part"],"Break the shape into parts, then add pieces together or subtract cut-out pieces."),
  Q(["Why should working for a composite shape be laid out clearly?","Why does the layout of your working matter?"],"So the reader can understand each step",["So the answer is always a whole number","So you can skip writing units","It makes the answer more accurate","It doesn't matter"],"Each step should make sense to someone reading it, e.g. 'area of rectangle + area of semicircle'."),
  Q(["A 17 cm × 14 cm rectangle has a semicircle attached to one 14 cm side. Find the perimeter, to 2 decimal places.","Rectangle 17 by 14 cm with a semicircle on a 14 cm end. Perimeter (2 d.p.)?"],"69.99 cm",["83.99 cm","62.00 cm","91.98 cm","55.99 cm"],"P = 17 + 17 + 14 + ½ × 2π × 7 = 48 + 7π ≈ 69.99 cm. The 14 cm side where the semicircle joins is NOT on the outside.","Only count edges on the outside."),
  Q(["A 17 cm × 14 cm rectangle has a semicircle attached to one 14 cm side. Find the area, to 2 decimal places.","Rectangle 17 by 14 cm with a semicircle on a 14 cm end. Area (2 d.p.)?"],"314.97 cm²",["391.94 cm²","238.00 cm²","545.94 cm²","276.48 cm²"],"A = 17 × 14 + ½ × π × 7² = 238 + 24.5π ≈ 314.97 cm²."),
  Q(["A 6 cm square has a right-angled triangle with two 2 cm sides cut from one corner. Find the remaining area.","A 6 × 6 cm square has a 2 cm by 2 cm right triangle removed from a corner. What area is left?"],"34 cm²",["32 cm²","36 cm²","38 cm²","30 cm²"],"36 − ½ × 2 × 2 = 36 − 2 = 34 cm²."),
  Q(["A 10 m × 8 m rectangle has a semicircle with diameter 8 m cut out of one end. Find the remaining area, to 2 decimal places.","Rectangle 10 × 8 m minus a semicircle of radius 4 m. Area (2 d.p.)?"],"54.87 m²",["29.73 m²","105.13 m²","67.43 m²","79.87 m²"],"A = 10 × 8 − ½ × π × 4² = 80 − 8π ≈ 54.87 m²."),
  Q(["A 10 m × 8 m rectangle has a semicircle with diameter 8 m cut out of one 8 m end. Find the perimeter, to 2 decimal places.","Perimeter (2 d.p.) of a 10 × 8 m rectangle with a semicircular bite (r = 4 m) out of one end?"],"40.57 m",["48.57 m","36.00 m","53.13 m","32.57 m"],"P = 10 + 10 + 8 + ½ × 2π × 4 = 28 + 4π ≈ 40.57 m. The curved edge replaces the 8 m side that was cut away."),
  Q(["A 3 m square has a quarter circle of radius 3 m attached to one side. Find the total area, to 2 decimal places.","Area (2 d.p.) of a 3 m square joined to a quadrant of radius 3 m?"],"16.07 m²",["37.27 m²","13.71 m²","11.36 m²","18.42 m²"],"A = 3 × 3 + ¼ × π × 3² = 9 + 2.25π ≈ 16.07 m²."),
  Q(["A 12 cm × 4 cm rectangle has a triangle with base 12 cm and height 4 cm removed from it. What area is left?","Rectangle 12 by 4 cm minus a triangle with b = 12 cm and h = 4 cm. Remaining area?"],"24 cm²",["48 cm²","36 cm²","12 cm²","32 cm²"],"48 − ½ × 12 × 4 = 48 − 24 = 24 cm². A triangle with the same base and height is exactly half the rectangle."),
  Q(["When finding the perimeter of a composite shape, which edges do you include?","For perimeter, which lengths count?"],"Only the edges on the outside of the shape",["Every edge of every basic shape","Only the straight edges","Only the curved edges","The edges where shapes join"],"Edges where two shapes are joined are inside the shape, so they are not part of the perimeter."),
  Q(["What is the perimeter of a semicircle made from?","A semicircle's perimeter includes…"],"Half the circumference plus the diameter",["Half the circumference only","The full circumference","Two radii only","The radius plus the circumference"],"The curved arc is half of 2πr, and the straight edge is the diameter."),
 ]},
 {title:"5F Surface Area",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["What is the surface area of a solid?","Define surface area."],"The sum of the areas of all the surfaces",["The amount of space inside the solid","The area of the base only","The total length of all the edges","The area of the biggest face"],"Add up the area of every face (surface) of the solid."),
  Q(["What is a net?","A 2D illustration of all the surfaces of a solid is called a…"],"A net",["A cross-section","A prism","A sector","A composite shape"],"A net is the solid unfolded flat, so you can see every face."),
  Q(["What is a right prism?","Which describes a right prism?"],"A solid with a uniform cross-section, two identical ends and rectangular sides",["A solid with a point at the top","A solid with circular faces only","Any solid with a right angle","A solid with triangle sides that meet at a point"],"Prisms are named by the shape of their cross-section, e.g. a triangular prism."),
  Q(["How is a prism named?","A prism's name comes from…"],"The shape of its cross-section",["The number of edges","Its volume","The length of its sides","Its colour"],"For example, a prism with a triangular cross-section is a triangular prism."),
  Q(["What is the surface area formula for a rectangular prism?","Surface area of a cuboid = ?"],"A = 2lw + 2wh + 2lh",["A = lwh","A = lw + wh + lh","A = 6lw","A = 2(l + w + h)"],"There are 3 pairs of identical faces: top/base, sides and ends."),
  Q(["What is the surface area formula for a square-based pyramid with base b and triangle height h?","Surface area of a square-based pyramid = ?"],"A = b² + 2bh",["A = b² + 4bh","A = 4bh","A = ⅓b²h","A = b² + ½bh"],"Base b² + 4 triangles of ½bh each = b² + 2bh."),
  Q(["Find the surface area of a rectangular prism 5 cm × 3 cm × 2 cm.","Cuboid with sides 5, 3 and 2 cm. Surface area?"],"62 cm²",["30 cm²","31 cm²","60 cm²","124 cm²"],"2(5 × 3) + 2(5 × 2) + 2(3 × 2) = 30 + 20 + 12 = 62 cm². Multiplying 5 × 3 × 2 = 30 gives volume, not surface area."),
  Q(["Find the surface area of a rectangular prism 3 m × 7 m × 8 m.","Cuboid with sides 3, 7 and 8 m. Surface area?"],"202 m²",["168 m²","101 m²","236 m²","180 m²"],"2(3 × 7) + 2(7 × 8) + 2(3 × 8) = 42 + 112 + 48 = 202 m²."),
  Q(["Find the surface area of a cube with side length 3 cm.","A cube has 3 cm edges. What is its surface area?"],"54 cm²",["27 cm²","9 cm²","36 cm²","18 cm²"],"6 faces × 3 × 3 = 54 cm²."),
  Q(["A square-based pyramid has a 2 m base and triangular faces with height 3 m. Find its surface area.","Square pyramid: base 2 m, triangle height 3 m. Surface area?"],"16 m²",["28 m²","12 m²","10 m²","4 m²"],"Base 2 × 2 = 4, plus 4 × ½ × 2 × 3 = 12. Total 16 m²."),
  Q(["A square-based pyramid has a 5 m base and triangular faces with height 6 m. Find its surface area.","Square pyramid: base 5 m, triangle height 6 m. Surface area?"],"85 m²",["145 m²","60 m²","55 m²","50 m²"],"Base 25 + 4 × ½ × 5 × 6 = 25 + 60 = 85 m²."),
  Q(["What is the surface area formula for a cylinder?","Surface area of a closed cylinder = ?"],"A = 2πr² + 2πrh",["A = πr²h","A = 2πr + 2πh","A = πr² + 2πrh","A = 2πr²h"],"2 circular ends (2πr²) plus the curved surface (2πrh). It can also be written 2πr(r + h)."),
  Q(["When the curved surface of a cylinder is unrolled, what shape does it make?","The curved part of a cylinder's net is a…"],"A rectangle with length 2πr and width h",["A circle with radius h","A triangle","A square with side r","A sector"],"The rectangle's length wraps around the circle, so it equals the circumference 2πr."),
  Q(["How would you find the surface area of an open cylinder with no lid?","A cylinder with no top has surface area…"],"πr² + 2πrh",["2πr² + 2πrh","πr²h","2πrh only","2πr² only"],"Only one circular end is included, plus the curved surface."),
  Q(["Find the surface area of a cylinder with radius 5 m and height 25 m, to 2 decimal places.","Cylinder r = 5 m, h = 25 m. Surface area (2 d.p.)?"],"942.48 m²",["1963.50 m²","785.40 m²","157.08 m²","863.94 m²"],"2π × 25 + 2π × 5 × 25 = 50π + 250π = 300π ≈ 942.48 m²."),
  Q(["Find the surface area of a cylinder with radius 6 cm and height 13 cm, to 2 decimal places.","Cylinder r = 6 cm, h = 13 cm. Surface area (2 d.p.)?"],"716.28 cm²",["1470.27 cm²","490.09 cm²","603.19 cm²","358.14 cm²"],"2π × 36 + 2π × 6 × 13 = 72π + 156π = 228π ≈ 716.28 cm²."),
  Q(["A half cylinder has diameter 4 cm and length 8 cm. Find its surface area, to 2 decimal places.","Half cylinder: diameter 4 cm, length 8 cm. Surface area (2 d.p.)?"],"94.83 cm²",["62.83 cm²","100.53 cm²","82.27 cm²","126.66 cm²"],"Two semicircle ends = 4π, half the curved surface = ½ × 2π × 2 × 8 = 16π, rectangular base = 4 × 8 = 32. Total 20π + 32 ≈ 94.83 cm²."),
  Q(["A half cylinder has diameter 6 m and length 10 m. Find its surface area, to 2 decimal places.","Half cylinder: diameter 6 m, length 10 m. Surface area (2 d.p.)?"],"182.52 m²",["122.52 m²","216.77 m²","154.25 m²","248.50 m²"],"Ends: 2 × ½ × π × 3² = 9π. Curved: ½ × 2π × 3 × 10 = 30π. Flat face: 6 × 10 = 60. Total 39π + 60 ≈ 182.52 m²."),
 ]},
 {title:"5G Volume and Capacity",topic:"Chapter 5: Measurement",src:"notes",qs:[
  Q(["How do you convert m³ to cm³?","m³ → cm³: what do you multiply by?"],"Multiply by 100³ = 1 000 000",["Multiply by 100","Multiply by 10 000","Multiply by 1000","Divide by 1 000 000"],"1 m = 100 cm, so 1 m³ = 100 × 100 × 100 = 1 000 000 cm³."),
  Q(["How do you convert cm³ to mm³?","cm³ → mm³: what do you multiply by?"],"Multiply by 10³ = 1000",["Multiply by 10","Multiply by 100","Divide by 1000","Multiply by 1 000 000"],"1 cm = 10 mm, so 1 cm³ = 10 × 10 × 10 = 1000 mm³."),
  Q(["How do you convert km³ to m³?","km³ → m³: what do you multiply by?"],"Multiply by 1000³ = 1 000 000 000",["Multiply by 1000","Multiply by 1 000 000","Divide by 1 000 000 000","Multiply by 100 000"],"1 km = 1000 m, so cube 1000 to get 1 000 000 000."),
  Q(["Convert 2.5 m³ to cm³.","2.5 m³ = ? cm³"],"2 500 000 cm³",["250 cm³","25 000 cm³","2500 cm³","250 000 000 cm³"],"2.5 × 1 000 000 = 2 500 000 cm³."),
  Q(["Convert 458 mm³ to cm³.","458 mm³ = ? cm³"],"0.458 cm³",["4.58 cm³","45.8 cm³","458 000 cm³","0.000458 cm³"],"mm³ → cm³ is ÷ 1000. 458 ÷ 1000 = 0.458 cm³."),
  Q(["Convert 4.8 cm³ to mm³.","4.8 cm³ = ? mm³"],"4800 mm³",["48 mm³","480 mm³","0.0048 mm³","48 000 mm³"],"4.8 × 1000 = 4800 mm³."),
  Q(["Convert 612 000 cm³ to m³.","612 000 cm³ = ? m³"],"0.612 m³",["612 m³","61.2 m³","6.12 m³","0.0612 m³"],"cm³ → m³ is ÷ 1 000 000. 612 000 ÷ 1 000 000 = 0.612 m³."),
  Q(["How many mL are in 1 cm³?","1 cm³ is equal to…"],"1 mL",["10 mL","1 L","1000 mL","0.1 mL"],"1 cm³ = 1 mL. This links volume and capacity."),
  Q(["How many litres are in 1 m³?","1 m³ holds how many litres?"],"1000 L",["100 L","1 L","1 000 000 L","10 L"],"1 m³ = 1 000 000 cm³ = 1 000 000 mL = 1000 L."),
  Q(["How many cm³ are in 1 L?","1 litre = ? cm³"],"1000 cm³",["100 cm³","1 cm³","10 000 cm³","1 000 000 cm³"],"1 L = 1000 mL = 1000 cm³."),
  Q(["How many litres are in 1 kL?","1 kilolitre = ?"],"1000 L",["100 L","10 L","1 000 000 L","0.001 L"],"Kilo means 1000, so 1 kL = 1000 L."),
  Q(["How many kL are in 1 ML (megalitre)?","1 megalitre = ?"],"1000 kL",["100 kL","1 000 000 kL","10 kL","1 kL"],"1 ML = 1000 kL = 1 000 000 L."),
  Q(["What is the general volume formula for a solid with a uniform cross-section?","Volume of a prism or cylinder = ?"],"V = A × perpendicular height (area of cross-section × height)",["V = A + h","V = ½ × A × h","V = A × slanted height","V = 2A + h"],"Multiply the cross-section's area by the length of the edge perpendicular to it."),
  Q(["In V = A × perp. height, what is the 'perpendicular height'?","What does the perpendicular height mean for a prism?"],"The length of the edge running perpendicular to the cross-section",["Always the vertical height","The longest diagonal","The height of the cross-section shape","Half the length"],"It can be the vertical height OR the length of a prism lying on its side."),
  Q(["Find the volume of a rectangular prism 1 cm × 1 cm × 3 cm.","Cuboid: 1 by 1 by 3 cm. Volume?"],"3 cm³",["5 cm³","14 cm³","3 cm²","6 cm³"],"V = lwh = 1 × 1 × 3 = 3 cm³."),
  Q(["Find the volume of a rectangular prism 3 cm × 2 cm × 2 cm.","Cuboid: 3 by 2 by 2 cm. Volume?"],"12 cm³",["7 cm³","32 cm³","24 cm³","12 cm²"],"V = 3 × 2 × 2 = 12 cm³."),
  Q(["A solid has a uniform cross-section with area 10 cm² and a perpendicular height of 5 cm. Find its volume.","Cross-section area 10 cm², height 5 cm. Volume?"],"50 cm³",["15 cm³","2 cm³","25 cm³","50 cm²"],"V = A × h = 10 × 5 = 50 cm³."),
  Q(["A solid has a uniform cross-section with area 4 cm² and a perpendicular height of 2 cm. Find its volume.","Cross-section area 4 cm², height 2 cm. Volume?"],"8 cm³",["6 cm³","2 cm³","16 cm³","4 cm³"],"V = 4 × 2 = 8 cm³."),
  Q(["A triangular prism has a triangle with base 4 cm and height 3 cm, and a length of 6 cm. Find its volume.","Triangular prism: b = 4, h₁ = 3, length = 6 (cm). Volume?"],"36 cm³",["72 cm³","13 cm³","24 cm³","18 cm³"],"V = (½ × 4 × 3) × 6 = 6 × 6 = 36 cm³. Forgetting the ½ gives 72."),
  Q(["A triangular prism has a triangle with base 3 m and height 2 m, and a length of 5 m. Find its volume.","Triangular prism: b = 3, h₁ = 2, length = 5 (m). Volume?"],"15 m³",["30 m³","10 m³","7.5 m³","25 m³"],"V = (½ × 3 × 2) × 5 = 3 × 5 = 15 m³."),
  Q(["Find the volume of a rectangular prism 11 m × 6 m × 5 m.","Cuboid: 11 by 6 by 5 m. Volume?"],"330 m³",["22 m³","66 m³","302 m³","165 m³"],"V = 11 × 6 × 5 = 330 m³."),
  Q(["What is the formula for the volume of a cylinder?","Cylinder volume V = ?"],"V = πr²h",["V = 2πrh","V = 2πr² + 2πrh","V = πd²h","V = ⅓πr²h"],"The cross-section is a circle (area πr²), multiplied by the height."),
  Q(["Find the volume of a cylinder with radius 3 cm and height 10 cm, to 2 decimal places.","Cylinder: r = 3 cm, h = 10 cm. Volume (2 d.p.)?"],"282.74 cm³",["94.25 cm³","188.50 cm³","90.00 cm³","2827.43 cm³"],"V = π × 3² × 10 = 90π ≈ 282.74 cm³."),
  Q(["A cylinder has a diameter of 1.8 m and a length of 0.3 m. Find its volume, to 2 decimal places.","Cylinder: diameter 1.8 m, length 0.3 m. Volume (2 d.p.)?"],"0.76 m³",["3.05 m³","1.70 m³","0.85 m³","0.25 m³"],"r = 0.9 m. V = π × 0.9² × 0.3 ≈ 0.76 m³. Using 1.8 as the radius gives 3.05 m³.","Halve the diameter first."),
  Q(["Find the volume of a cylinder with radius 3 m and height 6 m, to 2 decimal places.","Cylinder: r = 3 m, h = 6 m. Volume (2 d.p.)?"],"169.65 m³",["113.10 m³","56.55 m³","54.00 m³","678.58 m³"],"V = π × 9 × 6 = 54π ≈ 169.65 m³."),
  Q(["A cylinder has a diameter of 2.4 cm and a length of 3 cm. Find its volume, to 2 decimal places.","Cylinder: diameter 2.4 cm, length 3 cm. Volume (2 d.p.)?"],"13.57 cm³",["54.29 cm³","22.62 cm³","11.31 cm³","4.32 cm³"],"r = 1.2 cm. V = π × 1.44 × 3 = 4.32π ≈ 13.57 cm³."),
  Q(["Give the exact volume of a cylinder with radius 2 cm and height 7 cm.","Exact volume for r = 2 cm, h = 7 cm?"],"28π cm³",["14π cm³","56π cm³","87.96 cm³","4π cm³"],"V = π × 2² × 7 = 28π cm³ (≈ 87.96 cm³)."),
  Q(["Find the capacity, in litres, of a cylinder with radius 30 cm and height 90 cm (nearest litre).","Cylinder r = 30 cm, h = 90 cm. How many litres does it hold?"],"254 L",["254 469 L","25 L","2545 L","85 L"],"V = π × 30² × 90 ≈ 254 469 cm³. ÷ 1000 = 254 L."),
  Q(["Find the capacity, in litres, of a cylinder with radius 40 cm and height 100 cm (nearest litre).","Cylinder r = 40 cm, h = 100 cm. Capacity in litres?"],"503 L",["502 655 L","50 L","5027 L","251 L"],"V = π × 40² × 100 ≈ 502 655 cm³. ÷ 1000 ≈ 503 L."),
 ]},
]},
{id:"eng",name:"English",short:"En",h:122,quizzes:[
 {title:"Book Basics",topic:"A Walk in the Dark",src:"notes",qs:[
  Q(["Who wrote A Walk in the Dark?","Who is the author of A Walk in the Dark?"],"Jane Godwin",["Jackie French","John Marsden","Jaclyn Moriarty","Morris Gleitzman"],"A Walk in the Dark was written by Australian author Jane Godwin."),
  Q(["In what year was A Walk in the Dark published?","When was A Walk in the Dark first published?"],"2022",["2010","2015","2019","2024"],"The novel was published in 2022."),
  Q(["What best describes the genre and setting of A Walk in the Dark?","What kind of text is A Walk in the Dark, and where is it set?"],"Young adult fiction about a school group hiking in the Otway Forest",["Fantasy set in a magical forest","Historical fiction set in wartime","A crime thriller set in a boarding school","Science fiction set on a space station"],"It's young adult fiction following a school group on a hike in the Otway Forest."),
  Q(["Which of these is NOT one of the three main themes of A Walk in the Dark?","A Walk in the Dark explores three main themes. Which one is NOT among them?"],"The dangers of technology",["Coming of age","Duality of humankind","Pressures and issues facing young people"],"The three themes are coming of age, the duality of humankind, and pressures facing young people.","Two of the options are about growing up."),
  Q(["In the story journey, what does the group descend into after leaving the 'normal school' world?","After the normal school world, where does the story journey take the group next?"],"Darkness and the forest",["The city","A cave-in","A dream","A courtroom"],"The journey moves from normal school into darkness and the forest, before the transformation."),
  Q(["Which of these is a language feature, not a narrative convention?","Which option is a language feature?"],"Foreshadowing",["Plot","Setting","Characters","Conflict"],"Plot, setting, characters and conflict are narrative conventions (the building blocks of a story). Foreshadowing is a language feature: a technique the writer uses to hint at what's coming.","Which one is a technique, not a building block?"),
  Q(["How many students go on the overnight hike?","How many teenagers head into the forest?"],"Five",["Three","Four","Seven","Twelve"],"Five Year 9 students head into the forest on an overnight hike, with no adults."),
  Q(["Which school do the students go to?","The hikers are Year 9s from which school?"],"Otway Community School",["Great Ocean High","Melbourne Grammar","Torquay College","Apollo Bay Primary"],"The five are Year 9 students from Otway Community School."),
  Q(["Who is the head teacher who sends them on the hike?","Which teacher sends the students out, even though a storm is coming?"],"Johan",["Sammi","Mr Lake","Hughie","Jess"],"Johan, their head teacher, sends them out with no adults, even though a storm is coming."),
  Q(["What is unusual about the hike?","What makes the overnight hike risky from the start?"],"There are no adults, and a storm is coming",["It happens in the desert","It's a race against another school","It only lasts one hour","They have a GPS tracker and guide"],"The students go with no adults, and a storm is forecast. This sets up the danger and foreshadows what's coming."),
  Q(["In which state is the Great Otway National Park?","The novel is set in a national park in…"],"Victoria",["Western Australia","Queensland","Tasmania","New South Wales"],"The Great Otway National Park is in southern Victoria, stretching from Torquay to Princetown."),
  Q(["What kind of novel is A Walk in the Dark described as?","A Walk in the Dark is best described as a…"],"Rite-of-passage novel",["Romance novel","Science fiction novel","Historical war novel","Murder mystery"],"It's a suspenseful rite-of-passage (coming of age) novel about five teenagers and one night that changes them all."),
  Q(["What point of view is the novel told from?","Which narrative perspective does the novel use?"],"Third person",["First person","Second person","Only Fred's diary entries","Letters between characters"],"Close third-person narration gives the reader access to each character's thoughts, emotions and point of view."),
  Q(["How does third-person narration help the reader?","What does close third-person narration let the reader see?"],"It shows each character's inner thoughts and feelings",["It hides what characters are thinking","It only shows the villain's side","It lets the reader talk to the characters","It removes all dialogue"],"Close third-person narration gives a close-up look at each character's thoughts and point of view, deepening our understanding."),
  Q(["In the story journey, what happens at the end?","How does the story journey finish?"],"The characters return having changed",["They stay lost in the forest","They return exactly the same","They move to a new school","The forest is destroyed"],"Normal school → descend into darkness/forest → transformation → return having changed."),
  Q(["Which words describe the Otway setting in the novel?","How is the forest presented?"],"Beautiful and colourful, but also dark, mysterious and dangerous",["Only bright and safe","Only dull and boring","A busy city park","A dry, empty desert"],"The forest has two sides, beautiful and dangerous, which reflects the theme of duality."),
 ]},
 {title:"Characters",topic:"A Walk in the Dark",src:"notes",qs:[
  Q(["Which character is elected leader of the group?","Who becomes the group's leader?"],"Elle",["Ash","Fred","Laila","Chrystal"],"Elle is a natural leader and is elected leader. Fred is annoyed, and Ash is disappointed because he wanted to lead."),
  Q(["Why is Elle so fiercely independent?","What part of Elle's background explains why she doesn't rely on others?"],"Her parents work at DFAT, so she's constantly moving and can't get attached",["She grew up alone in the forest","Her parents are yoga gurus","She was kicked out of boarding school","She has two mums"],"Elle's family keeps moving for her parents' DFAT jobs, so she has learned not to get emotionally attached or reliant on others."),
  Q(["Who goes back to get the backpack so no one else has to, despite a knee issue?","Which character shows protectiveness by fetching the backpack with a sore knee?"],"Elle",["Fred","Ash","Laila","Chrystal"],"Elle can be impatient and judgemental, but she's protective. She goes back for the backpack despite her knee."),
  Q(["Which set of traits describes Elle's flaws?","What are some of Elle's weaknesses early in the novel?"],"Impatient, judgemental and lacking empathy",["Lazy, dishonest and shy","Spiritual, gentle and calm","Cruel, violent and cowardly","Forgetful, clumsy and quiet"],"Elle doesn't like waiting for others and wants everyone to be as capable as her, e.g. with Fred wanting alcohol and Chrystal needing to stop."),
  Q(["How does Elle change through the novel?","What is Elle's character arc?"],"She learns to accept help and rely on others",["She becomes more selfish","She stops being a leader completely","She decides to live in the forest","She doesn't change at all"],"'Elle would never have imagined that anyone would rescue her… and certainly not Chrystal.' Elle learns she can rely on others."),
  Q(["Who says 'I'm too tall, and too strong'?","Which character worries about being 'too tall, and too strong'?"],"Elle",["Chrystal","Laila","Ash","Fred"],"Elle reveals her own body image worries in her conversation with Chrystal."),
  Q(["Who tells Elle 'You could be a Victoria's Secret model' and 'You're really pretty'?","Which character compliments Elle's looks?"],"Chrystal",["Fred","Ash","Laila","Johan"],"Chrystal says this to Elle, which links to the theme of body image."),
  Q(["Which character says 'And I'm too strange' and talks about a fake online boyfriend?","Who reveals 'I only had a boyfriend once, online. He turned out to be a fake'?"],"Chrystal",["Elle","Laila","Ash","Fred"],"Chrystal's low self-esteem comes out when she and Elle open up to each other."),
  Q(["Which character is the daughter of a yoga guru?","Whose father is a famous spiritual guru?"],"Laila",["Elle","Chrystal","Ash","Fred"],"Laila appears to revere her guru father, but it's later revealed this isn't completely true."),
  Q(["Who lets Fred keep the stolen tourmaline?","Which character shows generosity by letting Fred keep a stolen stone?"],"Laila",["Elle","Ash","Chrystal","Johan"],"Laila is generous, handing out stones and letting Fred keep the tourmaline he stole."),
  Q(["Who says 'Sometimes I want my dad to fail'?","In the glow-worm cave, which character admits 'Sometimes I want my dad to fail'?"],"Laila",["Fred","Ash","Elle","Chrystal"],"Laila says this to Ash, revealing she doesn't respect her father as much as she seems to."),
  Q(["Which character is described as calm, collected and walking gracefully?","Who is calm and collected in the group?"],"Laila",["Fred","Elle","Chrystal","Ash"],"Laila is calm and collected, which fits her spiritual upbringing."),
  Q(["Which character has two mums and is unfairly mocked by Fred?","Whose family dynamic does Fred tease?"],"Ash",["Elle","Laila","Chrystal","Johan"],"Ash has two mums. Fred mocks him for it."),
  Q(["Which character feels weighed down by pressure to always be 'good'?","Who is a perfectionist and is called 'an example of a good student'?"],"Ash",["Fred","Chrystal","Laila","Elle"],"Ash feels pressure to be good is unfair, and is ashamed of his inner turmoil, including anger at not being leader."),
  Q(["Which character seems unwanted by his parents and was sent to boarding school?","Who was sent away to boarding school, then to live with his sister?"],"Fred",["Ash","Elle","Laila","Chrystal"],"Fred feels abandoned by his parents, which drives much of his anger."),
  Q(["Why does Fred tease Ash about having two mums?","What is really behind Fred mocking Ash?"],"Jealousy, because Ash has two loving parents and Fred feels he has none",["Fred is Ash's brother","Ash stole Fred's backpack","Fred wants to be leader instead of Elle","Ash told the teachers about Fred's alcohol"],"'Ash had two loving parents and he had none.' Fred projects his anger about his own parents onto Ash."),
  Q(["'Inside I was screaming sorry… But he said nothing, he just scowled.' What does this show about Fred?","What does the contrast between Fred's thoughts and actions reveal?"],"He feels sorry inside but hides it behind anger",["He doesn't care about anyone","He is happy with the group","He is planning to leave","He is scared of the storm"],"Fred's internal monologue is juxtaposed with his outward anger, showing his abandonment is causing rifts in his friendships."),
  Q(["How does the reader's response to Fred change?","Readers usually go from ___ to ___ for Fred."],"Dislike to empathy",["Admiration to dislike","Curiosity to boredom","Respect to fear","Empathy to anger"],"Readers start out disliking Fred but feel empathy once they understand his family situation. The same happens with Chrystal."),
  Q(["How does the reader's response to Elle change?","Readers usually go from ___ to ___ for Elle."],"Respecting to admiring",["Dislike to empathy","Curiosity to understanding","Admiring to disliking","Fear to pity"],"Readers respect Elle at first and come to admire her."),
  Q(["How does the reader's response to Laila change?","Readers usually go from ___ to ___ for Laila."],"Curiosity to understanding",["Dislike to empathy","Respecting to admiring","Understanding to dislike","Fear to respect"],"Readers are curious about Laila at first, then come to understand her."),
 ]},
 {title:"Themes and Techniques",topic:"A Walk in the Dark",src:"notes",qs:[
  Q(["What does the theme 'duality of humankind' mean?","The duality of humankind is about…"],"Good and evil can exist together in people",["People are either all good or all bad","Everyone has a twin","Humans and nature are the same","Two stories told at once"],"Duality is the dual existence of good and evil in people, like yin and yang."),
  Q(["How does the author mainly explore the duality of humankind?","Duality of humankind is shown mostly through…"],"Characterisation",["Rhyming poems","Maps of the forest","A glossary","The book's price"],"Characters like Elle (impatient but protective) and Fred (angry but sorry inside) show both sides of people."),
  Q(["Which is an issue facing young people explored in the novel?","Which pressure on young people does the novel explore?"],"Body image",["Paying a mortgage","Retirement","Running a business","Climate science exams"],"The novel explores peer pressure, body image and consent as issues facing young people."),
  Q(["Through which two characters is body image mostly explored?","Body image and self-esteem come through mostly in conversations between…"],"Elle and Chrystal",["Fred and Ash","Laila and Johan","Ash and Laila","Fred and Johan"],"Elle and Chrystal open up about how they see themselves, especially towards the end of the novel."),
  Q(["What message is the author raising through the body image theme?","What concern does Godwin raise about young people?"],"The pressure young people face about beauty standards and how it affects self-esteem",["That looks don't matter to anyone","That only adults worry about appearance","That hiking makes you attractive","That models are bad people"],"The author raises concerns about the stress and pressure on young people around body image, beauty standards and self-esteem."),
  Q(["Which characters show complex or untraditional family dynamics?","The theme of family dynamics is shown through which characters?"],"Ash, Fred, Laila and Chrystal",["Only Elle","Only Johan","The men in the Hilux","None of them"],"Ash has two mums, Fred feels abandoned, Laila has a guru father, and Chrystal's dad is part of her story."),
  Q(["How does the weather show duality?","Bright, sunny weather turning dark and stormy reflects which theme?"],"Duality",["Romance","Comedy","Science fiction","Politics"],"Weather shifting between bright/sunny and dark/stormy/dangerous mirrors the theme of duality."),
  Q(["The storm forecast at the start is an example of…","Mentioning a storm before the hike begins is a technique called…"],"Foreshadowing",["Flashback","Simile","Onomatopoeia","Alliteration"],"The forecast hints at the danger that's coming."),
  Q(["What is characterisation?","Characterisation means…"],"How an author constructs characters through things like dialogue, thoughts and behaviour",["The list of characters at the front of a book","Drawing pictures of characters","The number of characters in a book","Choosing names for characters"],"Characterisation uses appearance, dialogue, actions and behaviour, thoughts and feelings, relationships and character development."),
  Q(["Which of these is NOT a characterisation technique?","Which is not a way authors construct characters?"],"Page numbers",["Dialogue","Internal monologue","Appearance","Relationships with others"],"Characterisation techniques include appearance, dialogue, actions, thoughts and feelings, relationships and character arc."),
  Q(["What is internal monologue?","A character's private thoughts shown on the page are called…"],"A character's inner thoughts",["A conversation between two characters","A description of the setting","The author's biography","A chapter title"],"Internal monologue reveals what a character is thinking, like Fred's 'Inside I was screaming…'."),
  Q(["What is a character arc?","Character development (character arc) means…"],"How a character changes or grows through the story",["A character's physical appearance","The first line a character says","A map of where characters walk","A list of characters' friends"],"A character arc shows how a character changes in response to challenges, like Elle learning to rely on others."),
  Q(["Which is the correct order of plot structure?","Put the plot stages in order."],"Exposition, inciting incident, rising action, climax, falling action, resolution",["Climax, exposition, resolution, rising action, inciting incident, falling action","Inciting incident, climax, exposition, falling action, rising action, resolution","Resolution, falling action, climax, rising action, inciting incident, exposition","Exposition, climax, inciting incident, resolution, rising action, falling action"],"Exposition sets things up, the inciting incident starts the conflict, tension rises to the climax, then falls to the resolution."),
  Q(["What is the climax of a story?","The turning point of a narrative, with the greatest tension, is the…"],"The climax",["The exposition","The inciting incident","The resolution","The falling action"],"The climax is where the central conflict reaches its peak."),
  Q(["What is the inciting incident?","The event that disrupts the normal situation and starts the conflict is the…"],"The inciting incident",["The resolution","The climax","The exposition","The falling action"],"The inciting incident kicks off the main conflict."),
  Q(["What happens in the resolution (denouement)?","The part where loose ends are tied up is the…"],"The conflict is resolved and loose ends are tied up",["The characters are introduced","Tension starts to build","The conflict first begins","The setting is first described"],"In the resolution, the reader learns the final outcome for the characters."),
  Q(["Which of these is a narrative convention?","Narrative conventions include…"],"Point of view",["Foreshadowing","Simile","Metaphor","Personification"],"Narrative conventions: character, setting, plot, theme, point of view and style. Foreshadowing, simile and metaphor are language features."),
  Q(["What does imagery do?","Imagery helps construct the setting by…"],"Appealing to the reader's senses",["Listing facts and statistics","Telling the reader what to think","Adding page numbers","Removing description"],"Imagery uses descriptive and figurative language to appeal to sight, sound, touch, smell and taste."),
  Q(["In a TEEL paragraph, what does the 'L' stand for?","What is the last step of a TEEL paragraph?"],"Link (tie back to the topic)",["List","Language","Length","Letter"],"TEEL: Topic/Thesis, Evidence, Example (quote), Link/Tie back."),
  Q(["What comes in an essay introduction?","Which parts make up a strong essay intro?"],"Focus statement, thesis statement and signposts",["Only a quote","The conclusion and bibliography","A list of every character","Your opinion of the author's life"],"The intro has a focus statement (maybe a global statement), a thesis statement, then signposts for each body paragraph."),
 ]},
]},
