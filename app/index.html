{id:"forensic",name:"Forensic Science",short:"FS",h:205,quizzes:[
 {title:"1. An Overview of Forensic Science",topic:"CSI Textbook (Book 1)",src:"notes",qs:[
  Q(["What is forensic science?","Forensic science is best defined as…"],"Using scientific methods and processes to investigate crime",["The study of why people commit crime","A branch of law that writes new criminal laws","Police officers questioning suspects","Using computers to predict future crimes"],"Forensic science applies scientific methods like observing, testing and recording data to the investigation of crime. The evidence is presented in court."),
  Q(["Who said 'every contact leaves a trace'?","Which pioneer of forensic science is linked to the idea that every contact leaves a trace?"],"Edmond Locard",["Sherlock Holmes","Mathieu Orfila","Charles Darwin","Alexander the Great"],"Edmond Locard (1877–1966) was a French criminologist and a pioneer of forensic science."),
  Q(["What does Locard's principle 'every contact leaves a trace' mean?","According to Locard's exchange principle, what happens when two things touch?"],"They exchange physical material with each other",["Nothing is left behind if gloves are worn","Only fingerprints are transferred","The heavier object keeps all the evidence","Evidence only transfers if there is blood"],"A burglar might leave skin cells, fibres and hairs behind, and take away glass, paint or soil without realising."),
  Q(["Why is 'silent' trace evidence so valuable?","Why is trace evidence that's hard to see useful to investigators?"],"The offender may not know it's there, so they won't clean or get rid of it",["It always identifies one exact person","It never degrades","It is easy for anyone to see","It can't be contaminated"],"If a burglar doesn't know their clothing is contaminated, they probably won't bother cleaning it or throwing it away."),
  Q(["How can a mobile phone be an example of Locard's principle?","How does a switched-on phone leave a 'trace'?"],"It keeps communicating with the network, leaving a record of its location",["It takes photos of the crime automatically","It records fingerprints on the screen only","It stores the criminal's DNA","It can't, phones leave no traces"],"Even when no calls are made, a phone talks to the network. Police can use this location data as digital trace evidence."),
  Q(["Which type of evidence can best point to one individual?","Which evidence is most discriminating between people?"],"A DNA profile",["Standard blood group","Cotton fibres","Shoe size","Hair colour"],"DNA profiles and fingerprints can strongly suggest one person. Standard blood grouping can exclude suspects but can't identify just one."),
  Q(["What can standard blood grouping do in an investigation?","How useful is standard blood grouping as evidence?"],"Exclude some suspects, but not identify one person",["Identify exactly one person","Show how old a person is","Show what time a crime happened","Nothing at all"],"Many people share each blood group, so it can rule people out but can't point to a single person."),
  Q(["What does a comparison microscope let a scientist do?","Why do firearms examiners use comparison microscopy?"],"View two items side by side in the same field of view to compare markings",["Make tiny objects invisible","Take DNA from bullets","Measure how loud a gunshot was","Heat glass to find its refractive index"],"Markings on two cartridge cases can be compared at the same time, side by side."),
  Q(["According to the textbook, are two objects ever completely identical?","What does 'an object is only ever completely identical with itself' mean?"],"No. Two objects may look the same, but only within the limits of the test used",["Yes, mass-produced items are always identical","Yes, if they come from the same factory","Only if they are made of metal","Only fingerprints are never identical"],"Objects may appear indistinguishable, but only within the limitations of the examination being done."),
  Q(["What affects how long trace evidence persists on clothing?","Which factors affect the persistence of evidence?"],"Its type, size and shape, the material it's on, and how much the item moves",["Only the colour of the clothing","Only the time of day","Only the weather forecast","The name of the suspect"],"Evidence remains until it is disturbed or degrades. Movement, material and the evidence itself all matter."),
  Q(["What must happen first at a crime scene?","Before examining a crime scene, investigators must…"],"Secure the scene and control access",["Collect every object immediately","Clean up any mess","Let witnesses walk through it","Move the body to the lab"],"The scene is cordoned off and guarded so evidence isn't disturbed or contaminated."),
  Q(["Why do forensic scientists wear coveralls, overboots, masks and gloves?","What is the purpose of protective clothing at a crime scene?"],"To protect themselves and stop them contaminating the scene",["To look professional on TV","To keep warm","So witnesses recognise them","To hide their identity"],"Protective gear keeps scientists safe from hazards and stops their own hair, fibres and skin cells getting into the scene."),
  Q(["What must be done before anything at a crime scene is touched?","Before collecting evidence, scientists must…"],"Make a permanent record with sketches, photos or video",["Ask the suspect what happened","Wash their hands in the scene","Move items to get better photos","Decide who is guilty"],"The record shows the layout, dimensions and exact location of every item of interest."),
  Q(["Why can't wet or damp items be sealed in plastic bags?","How should damp evidence NOT be packaged?"],"They would go mouldy",["Plastic is too expensive","Water dissolves plastic","They would become magnetic","Plastic makes them invisible"],"Damp items sealed in plastic quickly become mouldy, damaging the evidence."),
  Q(["What is the chain of custody?","Why do investigators keep a chain of custody?"],"A record of who had the evidence and when, to show it wasn't tampered with",["The order suspects are arrested","A metal chain used to lock evidence rooms","A list of witnesses","The handcuffs used on a suspect"],"It tracks who has custody of the evidence over time, showing it was properly handled."),
  Q(["How must evidence packages be closed?","What seal goes on every evidence package?"],"With a tamper-proof seal",["With sticky tape only","They are left open","With a staple","With string"],"A tamper-proof seal shows if anyone has opened the package."),
  Q(["Who decides if an accused person is guilty?","Do forensic scientists decide guilt?"],"The court (judge or jury), not the scientist or police",["The forensic scientist","The police officer in charge","The victim's family","The media"],"Scientists present evidence. The court considers all the evidence and makes a judgement."),
  Q(["How is an expert witness different from an eyewitness?","What can a forensic scientist do in court that an eyewitness can't?"],"Give an opinion about how to interpret the evidence",["Decide the sentence","Choose the jury","Only report what they saw","Arrest the defendant"],"Eyewitnesses can only report what they saw or heard. An expert witness can give an opinion on the evidence."),
  Q(["Why do forensic scientists need excellent communication skills?","Who do forensic scientists need to explain evidence to?"],"They must explain complex science to non-experts like judges and juries",["They mainly talk to other scientists","They write TV scripts","They interview suspects","They never speak in court"],"The judge, jury and lawyers may have no science training, so the evidence must be clear."),
  Q(["Which branch of forensic science deals with firearms and bullets?","Firearms, bullets and projectiles are studied in…"],"Ballistics",["Toxicology","Arson","Odontology","Entomology"],"Ballistics covers firearms, bullets and other projectiles."),
  Q(["Which branch of forensic science deals with poisons and medicines in the body?","Toxicology is the study of…"],"Medicines and poisons in biological materials",["Insects on bodies","Teeth and bite marks","Fire and accelerants","Paint and glass"],"Toxicology looks for medicines and poisons in biological samples."),
  Q(["What does forensic entomology study?","A forensic entomologist examines…"],"Insects, e.g. to help estimate time of death",["Teeth and bite marks","Bones","Handwriting","Glass"],"Insect life cycles on a body can help estimate how long someone has been dead."),
  Q(["What does forensic odontology study?","A forensic odontologist examines…"],"Teeth and bite marks",["Insects","Soil","Fibres","Fire"],"Dental records and bite marks can help identify people."),
  Q(["In a criminal trial, what is the accused person called while facing charges?","What is the defendant?"],"The defendant",["The offender","The prosecutor","The plaintiff","The expert witness"],"While facing charges they're the defendant. If convicted, they become the offender."),
  Q(["How long do real forensic examinations usually take, compared with TV?","Is forensic testing as fast as on TV?"],"Hours or even days, not minutes",["A few seconds","Always under a minute","Several years each","Exactly one hour"],"Real examinations are slow and careful. Instant-answer machines on TV rarely exist."),
 ]},
 {title:"2. Impression Evidence",topic:"CSI Textbook (Book 1)",src:"notes",qs:[
  Q(["A shoeprint left in soft soil or snow is what kind of impression?","Footprints in mud are…"],"Three-dimensional",["Two-dimensional","Latent","Digital","Chemical"],"Soft surfaces like soil or snow give 3D impressions. Hard floors give 2D impressions."),
  Q(["A shoeprint on a hard wooden or concrete floor is what kind of impression?","Footwear marks on a hard floor are…"],"Two-dimensional",["Three-dimensional","Cast","Striated","Indentation only"],"Hard surfaces leave a flat, 2D pattern."),
  Q(["What casting material do many forensic scientists prefer for shoe impressions?","Professionals often cast footprints with…"],"Dental stone",["Play dough","Candle wax","Glue","Chalk"],"Plaster of Paris works in class, but many forensic scientists prefer dental stone."),
  Q(["When casting a footprint, where should you pour the plaster?","Why pour plaster in at one end of the mould?"],"In at one end, so you don't damage the impression",["Straight into the middle from high up","All over at once","Before making the frame","Into a bucket of sand first"],"Pouring at one end lets the plaster flow in gently without destroying fine detail."),
  Q(["What can the distance between footprints tell investigators?","Stride length from footprints can help estimate…"],"A person's height",["Their blood type","Their name","Their age exactly","Their hair colour"],"Distance between impressions gives stride length, which can help estimate physical features like height."),
  Q(["Many footprints in a small space may suggest…","What might a cluster of impressions close together mean?"],"A struggle took place",["Nobody was there","The scene was cleaned","It was raining","The suspect was asleep"],"Lots of impressions close together can indicate a struggle."),
  Q(["What can the number of different shoeprints tell investigators?","Different impressions at a scene can show…"],"How many people were involved",["The weather that day","The time on the clock","The colour of the shoes","The suspect's age"],"Each different impression can represent a different person."),
  Q(["Which four aspects of a footwear cast does the textbook identify?","What four features are examined on a shoe cast?"],"Pattern, size, wear and damage",["Colour, smell, weight and price","Brand, owner, date and shop","Height, width, depth and temperature","Left, right, front and back"],"Pattern, size, wear (linked to gait) and damage like nicks, cuts and caught stones."),
  Q(["Wear patterns on a shoe are often linked to…","What does uneven wear on a shoe sole relate to?"],"The person's gait (walking style)",["The brand of shoe only","The weather","The person's hair colour","The shop it was bought from"],"How someone walks wears the sole in a particular way, which can help link a shoe to a person."),
  Q(["What was the only physical evidence in the Victoria Cafasso case?","In the 1995 Beaumaris Beach murder in Tasmania, police had…"],"A plaster cast of a footprint",["A DNA sample","A fingerprint on a knife","CCTV footage","A tyre track"],"A plaster cast believed to be of the killer's footprint is the only physical evidence. No one has been charged."),
  Q(["When photographing a cast with an L-shaped forensic ruler, how do you check the image isn't distorted?","How should the camera be held when photographing an impression?"],"Hold it directly above; the ruler's circles should look perfectly round",["Hold it at a low angle for drama","Leave the ruler out of the photo","Use a filter to blur it","Photograph only the edges"],"If the circles on the ruler aren't round and equal, the image is distorted and needs retaking."),
  Q(["What are sipes on a tyre?","Narrow slits in the tread blocks that let them flex are called…"],"Sipes",["Ribs","Dimples","Grooves","Wear indicators"],"Sipes let the tread blocks flex and keep friction with the road."),
  Q(["What do the grooves in a tyre tread do?","Why do tyres have grooves?"],"Channel water away to improve grip on wet roads",["Make the tyre lighter","Show the brand name","Hold air inside the tyre","Make noise"],"Grooves move water from the front to the back of the tyre."),
  Q(["What are tread wear indicators?","Bars of rubber in the grooves that show when a tyre needs replacing are called…"],"Tread wear indicators",["Sipes","Dimples","Ribs","Pitch lengths"],"They become more visible as the tyre wears down."),
  Q(["Why does the pitch length of tread blocks change around a tyre?","What is the purpose of different-sized tread blocks (S, M, L)?"],"To reduce road noise",["To make the tyre cheaper","To show the tyre's age","To help it float","To make it heavier"],"Varying the pitch length, in a tread block sequence, reduces road noise."),
  Q(["On a tyre marked 205/55R16, what does 205 mean?","The first three digits on a tyre sidewall show…"],"The width in millimetres",["The rim size in inches","The speed rating","The year it was made","The weight in kg"],"205 = width (mm), 55 = sidewall height as a % of width (aspect ratio), R = radial, 16 = rim size in inches."),
  Q(["On a tyre marked 205/55R16, what does the 16 mean?","The final digits on a tyre sidewall show…"],"The wheel rim size in inches",["The width in mm","The aspect ratio","The number of grooves","The age in years"],"The last digits give the rim size the tyre fits."),
  Q(["In the Aaron Hernandez case, what linked a tyre impression to his rental car?","What was the key detail in the tyre track evidence against Hernandez?"],"Four small stones lodged in the tyre grooves",["The colour of the tyre","A receipt in the car","A fingerprint on the tyre","The tyre's brand logo"],"The stones matched markings in the impression found at the scene."),
  Q(["What are the three main types of tool marks?","Tool marks are classified as…"],"Indentation, abrasion (friction) and cut marks",["Hot, cold and wet marks","Left, right and centre marks","Blood, glass and fibre marks","Small, medium and large marks"],"Indentation = pressed in; abrasion = scraped (striations); cut = from scissors, knives and saws."),
  Q(["What are striations?","Tiny scratches left when a tool scrapes across a surface are called…"],"Striations",["Indentations","Sipes","Satellites","Spines"],"Striations are minute scratches from abrasion (friction) marks."),
  Q(["What is a class characteristic of a tool?","The width of a screwdriver blade is an example of a…"],"Class characteristic",["Individual characteristic","Striation","Trace evidence","Chain of custody"],"Class characteristics are measurable features like shape and size. They identify the type of tool, not one specific tool."),
  Q(["What are individual characteristics of a tool?","Random imperfections from manufacture, use and wear are…"],"Individual characteristics",["Class characteristics","Brand features","Pitch lengths","Medullary indices"],"These random marks can make one tool's marks unique."),
  Q(["What can class characteristics alone usually do in a tool mark investigation?","If a suspect tool's class characteristics don't match the crime scene mark…"],"The tool can be eliminated",["The tool is definitely the one used","The suspect is guilty","Nothing can be concluded","The tool must be retested forever"],"Class characteristics usually can't identify a specific tool, but a mismatch can rule it out."),
  Q(["When can a scientist conclude a tool made the crime scene mark?","What has to match to link a tool to a mark?"],"Both class and individual characteristics must match perfectly",["Only the colour","Only the brand","Only the class characteristics","Only the length"],"Both sets of characteristics must match perfectly."),
  Q(["Test tool marks are made in a material that is…","What kind of material should test marks be made in?"],"Softer than the tool",["Harder than the tool","Made of glass","Made of the same tool","Liquid"],"A softer material takes the tool's marks without damaging the tool."),
  Q(["Why is graphite rubbed over a scratched drink can in the tool mark activity?","How do you make striations easier to see on soft metal?"],"It darkens the deeper scratches so they stand out",["It removes the scratches","It makes the metal stronger","It changes the metal's colour to red","It fills the scratches so they disappear"],"Graphite collects in deeper marks, making the striation pattern clearer."),
 ]},
 {title:"3. Blood Spatter Evidence",topic:"CSI Textbook (Book 1)",src:"notes",qs:[
  Q(["What shape is a falling drop of blood?","Blood falls as a…"],"Sphere (round ball)",["Tear-drop","Cube","Flat disc","Long string"],"Blood falls as a spherical drop because of surface tension, not a tear-drop shape."),
  Q(["What stain does a slow-falling blood drop make on a smooth surface?","A blood drop falling straight down slowly onto a smooth surface leaves…"],"A circular stain",["A long streak","An exclamation mark shape","A star with no centre","No stain"],"Slow drops onto smooth surfaces make round stains."),
  Q(["What are spines in a blood stain?","Small projections radiating from the edge of a stain are called…"],"Spines",["Satellites","Sipes","Striations","Tails only"],"Spines appear when blood hits at higher speed."),
  Q(["What happens when blood falls on a rough surface like carpet or concrete?","Blood on a rough surface tends to form…"],"An irregular stain with jagged edges and satellite stains",["A perfect circle","No stain at all","A square stain","A clear, colourless stain"],"Rough surfaces break up the drop, so scientists must always consider the surface type."),
  Q(["The size of a stain from a single drop depends on…","What two things affect blood stain size?"],"The drop's volume and its speed at impact",["The person's blood type","The colour of the floor only","The time of day","The temperature of the room only"],"Bigger and faster drops make bigger stains."),
  Q(["Why do large drops of blood fall faster than small drops?","Larger blood drops hit harder because of…"],"Air resistance affects small drops more",["Large drops are lighter","Gravity only pulls large drops","Small drops float","Blood speeds up when cold"],"Air resistance slows small drops more, which complicates estimating fall height."),
  Q(["What does the tail of an elongated blood stain show?","Which way does the tail of an angled blood drop point?"],"The direction the drop was travelling",["Where the blood came from","The victim's blood type","The height it fell from","Which hand the attacker used"],"The tail points in the direction of travel."),
  Q(["A trail of drops has spines on the right side. Which way was the bleeding person moving?","Spines on the right of each drop suggest movement…"],"Left to right",["Right to left","Straight up","Not moving","In a circle"],"Spines become more prominent on the side the drop was travelling towards."),
  Q(["What shape can form when blood hits a surface at a very shallow (acute) angle?","A blood drop hitting at a very low angle can make…"],"An exclamation mark shape",["A perfect circle","A square","A star with eight points","A spiral"],"A small satellite stain separates from the elongated main stain."),
  Q(["How do you calculate the angle of impact of a blood drop?","What ratio is used to find the angle a blood drop hit at?"],"Width ÷ length of the stain, then look up the angle",["Length × width","Width + length","Length ÷ height dropped","Number of spines ÷ 2"],"Divide width by length to get a ratio, then convert it to an angle."),
  Q(["A blood stain is 5 mm wide and 10 mm long. Using the ratio table, what angle did it hit at?","Width/length = 0.5. What is the impact angle?"],"30°",["50°","90°","5°","60°"],"5 ÷ 10 = 0.5, which equals 30° in the table."),
  Q(["A perfectly round blood stain (width ÷ length = 1.0) hit the surface at…","If the width equals the length, the angle of impact is…"],"90°",["0°","45°","30°","10°"],"A ratio of 1.0 means the drop fell straight down at 90°."),
  Q(["A ratio of 0.4 corresponds to what impact angle?","Width ÷ length = 0.4. What angle is that?"],"24°",["40°","4°","60°","90°"],"From the table, 0.4 = 24°."),
  Q(["What is an area of convergence used for?","By tracing several angled stains back, scientists find the area of convergence to work out…"],"Where the source of the blood was",["What time the crime happened","The blood type","The suspect's name","The weather"],"This can show whether the victim was standing, sitting or crouching when injured."),
  Q(["In the fake blood recipe, why is glycerol added?","What does glycerol do in artificial blood?"],"Adds stickiness and helps drops form a sphere",["Makes it red","Makes it smell like blood","Makes it freeze","Makes it invisible"],"Glycerol affects viscosity and surface tension so drops behave more like real blood."),
  Q(["In the fake blood recipe, why is cornflour added?","Which ingredient gives fake blood clots when it dries?"],"Cornflour",["Water","Blue food colouring","Glycerol","Paint"],"Cornflour adds thickness and grittiness and makes 'clots' like real blood."),
  Q(["What properties of real blood should a good blood analogue copy?","A fake blood should mimic real blood's…"],"Viscosity (thickness) and surface tension",["Smell and taste","Temperature only","DNA","Magnetism"],"Viscosity and surface tension control how drops fall and splash."),
  Q(["The Chamberlain 'dingo' case (1980) is an example of…","Why is the Azaria Chamberlain case important in forensic science?"],"Poor forensic practice leading to a wrongful conviction",["The first use of DNA","A perfect investigation","The first tyre track evidence","A case solved by hair evidence"],"Partly due to blood-stain analysis, Lindy Chamberlain was wrongly convicted. She was released after three years when new evidence emerged."),
  Q(["How can blood spatter analysis be used alongside witness statements?","Blood spatter evidence can help investigators…"],"Corroborate (support) or negate witness accounts",["Replace the need for any trial","Identify the suspect's name","Find the suspect's address","Tell the time of the crime exactly"],"It can show positions and movements, which may support or contradict what witnesses say."),

 {title:"4a. Trace Evidence: Glass",topic:"CSI Textbook (Book 1)",src:"notes",qs:[

 {title:"4b. Trace Evidence: Hair and Fibres",topic:"CSI Textbook (Book 1)",src:"notes",qs:[

/* ---------- storage: only Test-mode results are recorded ---------- */
const TKEY="studyhub.tests.v1";
let TESTS=[]; try{TESTS=JSON.parse(localStorage.getItem(TKEY)||"[]")}catch(e){TESTS=[]}
if(!Array.isArray(TESTS)) TESTS=[];
const saveTests=()=>{try{localStorage.setItem(TKEY,JSON.stringify(TESTS))}catch(e){}};
const clearHistory=()=>{TESTS=[];try{["studyhub.tests.v1","studyhub.best.v1","studyhub.attempts.v1"].forEach(k=>localStorage.removeItem(k))}catch(e){}};
const pctOf=t=>Math.round(t.score/t.total*100);
const testsFor=id=>TESTS.filter(t=>t.id===id);
const bestOf=id=>{const a=testsFor(id);return a.length?Math.max(...a.map(pctOf)):null};
const countOf=id=>testsFor(id).length;

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const setHue=h=>document.documentElement.style.setProperty('--h',h);
const PRAISE=["Correct!","Spot on.","Nailed it.","Yes!","Exactly.","Well done."];
const NUDGE=["Not quite.","Not this time.","Close, but no.","Have another look."];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const totalQs=s=>s.quizzes.reduce((n,q)=>n+q.qs.length,0);
// Core subjects always first (in this order), then subjects with quizzes, then the rest.
const CORE=["sci","hass","maths","eng"];
const orderedSubjects=()=>{
  const core=CORE.map(id=>SUBJECTS.find(s=>s.id===id));
  const rest=SUBJECTS.filter(s=>!CORE.includes(s.id));
  return [...core,...rest.filter(s=>s.quizzes.length),...rest.filter(s=>!s.quizzes.length)];
};
// Each subject keeps one chart colour everywhere (colour follows the subject, never its rank).
const COLOR_SLOT={sci:1,hass:2,maths:3,eng:4,forensic:5,liars:6,health:7,faith:8};
const sColor=id=>`var(--s${COLOR_SLOT[id]||9})`;
const subjName=id=>(SUBJECTS.find(s=>s.id===id)||{name:id}).name;
const fmtDay=ms=>new Date(ms).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fmtDate=ms=>new Date(ms).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const DAY=86400000;
const dayStart=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
let VIEW="home";

/* ---------- views ---------- */
function home(){
  VIEW="home"; setHue(155);
  const all=SUBJECTS.reduce((n,s)=>n+totalQs(s),0);
  const withQ=SUBJECTS.filter(s=>s.quizzes.length).length;
  const avg=TESTS.length?Math.round(TESTS.reduce((a,t)=>a+pctOf(t),0)/TESTS.length):null;
  const hr=new Date().getHours(), greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const find=t=>{const s=SUBJECTS.find(x=>x.id===t.s);if(!s)return null;const q=s.quizzes.find(q=>q.title===t.quiz);return q?{s,q}:null};
  const recent=[];const seen=new Set();
  for(let i=TESTS.length-1;i>=0&&recent.length<3;i--){const t=TESTS[i];const k=t.s+'/'+t.quiz;if(seen.has(k))continue;seen.add(k);const f=find(t);if(f)recent.push({...f,t})}
  const weak=[];SUBJECTS.forEach(s=>s.quizzes.forEach(q=>{const b=bestOf(s.id+"/"+q.title);if(b!=null&&b<80)weak.push({s,q,b})}));weak.sort((a,b)=>a.b-b.b);
  const jump=(x,sub,go)=>`<button class="jump" data-s="${x.s.id}" data-q="${esc(x.q.title)}" style="--h:${x.s.h}"><span class="m">${x.s.short}</span><span class="t"><b>${esc(x.q.title)}</b><small>${esc(x.s.name)} · ${sub}</small></span><span class="go">${go} →</span></button>`;
  const core=["maths","eng","sci","hass"].map(id=>SUBJECTS.find(s=>s.id===id)).filter(Boolean);
  const fcard=s=>{
    if(!s.quizzes.length) return `<div class="fcard none" style="--h:${s.h}"><span class="m">${s.short}</span><span class="n">${esc(s.name)}</span><span class="d">No quizzes yet</span></div>`;
    const tested=s.quizzes.filter(q=>bestOf(s.id+"/"+q.title)!=null).length;
    const b=s.quizzes.map(q=>bestOf(s.id+"/"+q.title)).filter(v=>v!=null);
    const topics=[...new Set(s.quizzes.map(q=>q.topic||'Other'))];
    return `<button class="fcard" data-id="${s.id}" style="--h:${s.h}"><span class="m">${s.short}</span><span class="n">${esc(s.name)}</span>
      <span class="d">${s.quizzes.length} quiz${s.quizzes.length>1?'zes':''} · ${totalQs(s)} questions<br>${esc(topics.join(' · '))}</span>
      <span class="bl"><span>${tested} of ${s.quizzes.length} tested</span><span>${b.length?'best '+Math.max(...b)+'%':''}</span></span>
      <span class="bar"><i style="width:${Math.round(tested/s.quizzes.length*100)}%"></i></span></button>`};
  const others=orderedSubjects().filter(s=>!core.includes(s));
  app.innerHTML=`
    <header class="hello">
      <span class="eyebrow">Term 4 · 2026</span>
      <h1>${greet}</h1>
      <p class="sub">Pick a subject to practise, or take a Test to track your progress.</p>
    </header>
    <div class="homegrid">
      <div class="col">
        <section class="sect"><h3>Featured subjects</h3><div class="feat4">${core.map(fcard).join('')}</div></section>
        <section class="sect"><h3>More subjects</h3><div class="more">${others.map(s=>s.quizzes.length?`<button class="mchip" data-id="${s.id}" style="--h:${s.h}"><span class="m">${s.short}</span>${esc(s.name)} <small>${s.quizzes.length}</small></button>`:`<span class="mchip soon" style="--h:${s.h}"><span class="m">${s.short}</span>${esc(s.name)} <small>soon</small></span>`).join('')}</div></section>
      </div>
      <aside class="col statpanel" aria-label="Your stats">
        <h3>Your stats</h3>
        <div class="tiles">
          <div class="tile"><b>${TESTS.length}</b><span>tests taken</span></div>
          <div class="tile"><b>${avg==null?'–':avg+'%'}</b><span>average score</span></div>
          <div class="tile"><b>${new Set(TESTS.map(t=>t.id)).size}</b><span>quizzes tested</span></div>
          <div class="tile"><b>${all}</b><span>questions in ${withQ} subjects</span></div>
        </div>
        ${recent.length?`<section class="sect"><h3>Jump back in</h3>${recent.map(x=>jump(x,`last test ${pctOf(x.t)}%`,'Go')).join('')}</section>`:''}
        ${weak.length?`<section class="sect"><h3>Needs more work</h3>${weak.slice(0,3).map(x=>jump(x,`best ${x.b}%`,'Practise')).join('')}</section>`:''}
        ${!TESTS.length?`<p class="empty-note">Take any quiz in <b>Test</b> mode and your scores, recent tests and weak spots will show up here.</p>`:''}
        <div class="row" id="historyRow"><button class="btn small" id="anaBtn">Full analytics</button>${TESTS.length?`<button class="btn ghost small" id="clearBtn">Clear test history</button>`:''}</div>
      </aside>
    </div>`;
  app.querySelectorAll('.fcard[data-id],.mchip[data-id]').forEach(b=>b.addEventListener('click',()=>subject(b.dataset.id)));
  app.querySelectorAll('.jump').forEach(b=>b.addEventListener('click',()=>{const s=SUBJECTS.find(x=>x.id===b.dataset.s);const q=s.quizzes.find(q=>q.title===b.dataset.q);chooseMode(s,q.title,q.qs,s.id+"/"+q.title,null,q.topic||'Other')}));
  document.getElementById('anaBtn').addEventListener('click',analytics);
  const cb=document.getElementById('clearBtn');
  if(cb) cb.addEventListener('click',()=>confirmReset('historyRow',home));
}

function confirmReset(rowId,after){
  const row=document.getElementById(rowId);
  row.innerHTML=`<div class="confirm"><span>Delete all test results, best scores and analytics? This can't be undone.</span><div class="row"><button class="btn danger small" id="confirmClear">Delete everything</button><button class="btn ghost small" id="cancelClear">Cancel</button></div></div>`;
  document.getElementById('confirmClear').addEventListener('click',()=>{clearHistory();after();const r=document.getElementById(rowId);if(r)r.insertAdjacentHTML('beforeend','<span class="keys">Test history deleted.</span>')});
  document.getElementById('cancelClear').addEventListener('click',after);

function statBadges(id){

/* ---------- format + mode choice ---------- */
const FORMATS=[
  ['mixed','Mixed formats','A mix of multiple choice, true or false, matching and written answers.'],
  ['mc','Multiple choice','Pick the right answer from four options.'],
  ['tf','True or false','Decide whether the answer shown is correct.'],
  ['match','Matching','Match each question to its answer, in sets of four.'],
  ['write','Written answers','Type your own answer, then compare it with the model answer.'],
  ['timed','Speed round','Multiple choice against a 90-second clock. Answer as many as you can.'],
  ['flash','Flashcards','Flip cards to revise. Practice only, not recorded.'],
];
const fmtName=id=>(FORMATS.find(f=>f[0]===id)||FORMATS[1])[1];
let LAST_FMT='mixed';
const TIMED_SECS=90;

function chooseMode(s,title,qs,bestId,pool,topic){
  VIEW="mode"; setHue(s.h); stopTimer();

    <button class="back" id="backSubj">← ${esc(s.name)}</button>

      <div class="fmts" role="radiogroup">
        ${FORMATS.map(f=>`<button class="fmt" role="radio" aria-checked="${f[0]===LAST_FMT}" data-fmt="${f[0]}" id="fmt-${f[0]}"><span class="fmt-t">${f[1]}</span><span class="fmt-d">${f[2]}</span></button>`).join('')}
      </div>
    </section>

      <button class="mode" id="modePractice"><span class="mode-t">Practice</span><span class="mode-d">Hints are available. Your score isn't recorded, so you can learn without pressure.</span></button>
      <button class="mode test" id="modeTest"><span class="mode-t">Test</span><span class="mode-d" id="testDesc">No hints. Your score is saved and counts towards your analytics and best scores.</span></button>
    </div>`;
  const sync=()=>{
    app.querySelectorAll('.fmt').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.fmt===LAST_FMT)));
    const t=document.getElementById('modeTest'), flash=LAST_FMT==='flash';
    t.disabled=flash;
    document.getElementById('testDesc').textContent=flash?'Flashcards are for revision only. Choose another format to take a test.':'No hints. Your score is saved and counts towards your analytics and best scores.';
  };
  app.querySelectorAll('.fmt').forEach(b=>b.addEventListener('click',()=>{LAST_FMT=b.dataset.fmt;sync()}));
  sync();
  document.getElementById('backSubj').addEventListener('click',()=>subject(s.id));

  document.getElementById('modeTest').addEventListener('click',()=>{if(LAST_FMT!=='flash')play(s,title,qs,bestId,pool,topic,'test',LAST_FMT)});

/* ---------- building rounds ---------- */
const mcOpts=b=>shuffle([{t:b.a,ok:true},...shuffle(b.w).slice(0,3).map(t=>({t,ok:false}))]);
const mkMC=b=>({type:'mc',b,pts:1,opts:mcOpts(b)});
const mkTF=b=>{const truth=Math.random()<0.5;return{type:'tf',b,pts:1,truth,shown:truth?b.a:pick(b.w),opts:[{t:'True',ok:truth},{t:'False',ok:!truth}]}};
const mkWrite=b=>({type:'write',b,pts:1});
const mkMatch=set=>({type:'match',set,pts:set.length,answers:shuffle(set.map((b,i)=>({t:b.a,i}))),pairs:{},active:null});
function chunkMatch(base){
  const groups=[]; for(let i=0;i<base.length;i+=4) groups.push(base.slice(i,i+4));
  if(groups.length>1&&groups[groups.length-1].length<2){const last=groups.pop();groups[groups.length-1].push(...last)}
  return groups.map(mkMatch);
}
function buildItems(base,fmt){
  if(fmt==='mc'||fmt==='timed') return base.map(mkMC);
  if(fmt==='tf') return base.map(mkTF);
  if(fmt==='write') return base.map(mkWrite);
  if(fmt==='match') return chunkMatch(base);
  if(fmt==='flash') return base.map(b=>({type:'flash',b,pts:0,tries:0}));
  // mixed: one matching set (if there are enough questions), the rest a blend of formats
  let rest=base, items=[];
  if(base.length>=8){items.push(mkMatch(base.slice(0,4)));rest=base.slice(4)}
  rest.forEach(b=>{const r=Math.random();items.push(r<0.45?mkMC(b):r<0.75?mkTF(b):mkWrite(b))});
  items=shuffle(items);
  return items;
}

/* ---------- quiz engine ---------- */
let R; // current round
function stopTimer(){if(R&&R.timer){clearInterval(R.timer);R.timer=null}}
function play(s,title,qs,bestId,pool,topic,mode,fmt){
  VIEW="quiz"; stopTimer();
  const base=shuffle(qs).map(b=>({...b,q:Array.isArray(b.q)?pick(b.q):b.q}));
  R={s,title,bestId,pool,topic,mode,fmt,start:Date.now(),i:0,score:0,done:0,missed:[],answered:false,known:0,
     items:buildItems(base,fmt),qsSrc:qs};
  R.total=R.items.reduce((a,it)=>a+it.pts,0);
  const timed=fmt==='timed';
  app.innerHTML=`
    <button class="back" id="backSubj">← ${esc(s.name)}</button>
    <header style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${esc(s.name)} <span class="pill ${mode}">${mode==='test'?'Test':'Practice'}</span> <span class="pill">${esc(fmtName(fmt))}</span></span><h2>${esc(title)}</h2></header>
    <div class="progress" id="progress"><div class="bar"><span id="barFill"></span></div>${timed?'<span id="timer" class="timer"></span>':''}<span id="count"></span><span id="scoreLive"></span></div>
    <main class="card" id="card" aria-live="polite"></main>
    <p class="keys" id="keys">${({flash:'Tip: press Space to flip a card.',write:'Tip: press Enter to check your answer (Shift+Enter for a new line).',match:'Tip: tap a question, then tap its answer. You can re-pair anything before checking.',tf:'Tip: press T or F to pick, then Enter to check it and Enter again to continue.'})[fmt]||'Tip: press 1–4 to pick an answer (T/F for true or false), then Enter to check it and Enter again to continue.'}${mode==='test'?' Leaving now means this test won\'t be saved.':''}</p>`;
  document.getElementById('backSubj').addEventListener('click',()=>{stopTimer();R=null;subject(s.id)});
  if(s.id==='maths') mountCalc();
  if(timed){
    R.deadline=Date.now()+TIMED_SECS*1000;
    const tick=()=>{if(!R) return;const left=Math.max(0,Math.ceil((R.deadline-Date.now())/1000));const el=document.getElementById('timer');if(el){el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;el.classList.toggle('low',left<=10)}if(left<=0){stopTimer();finish(true)}};
    R.timer=setInterval(tick,250); tick();
  }
  renderItem();
}
function updateHud(){
  const n=R.items.length;
  document.getElementById('barFill').style.width=(R.i/n*100)+'%';
  document.getElementById('count').textContent=R.fmt==='timed'?`${R.done} answered`:`${Math.min(R.i+1,n)} / ${n}`;
  document.getElementById('scoreLive').textContent=R.fmt==='flash'?`Known ${R.known}`:`Score ${R.score}`;
}
function renderItem(){
  const it=R.items[R.i]; R.answered=false; R.sel=null; updateHud();
  ({mc:renderChoice,tf:renderChoice,write:renderWrite,match:renderMatch,flash:renderFlash})[it.type](it);
}
function hintHtml(b){return b.h&&R.mode==='practice'?`<button class="hintbtn" id="hintBtn">Show hint</button>`:''}
function bindHint(b){const hb=document.getElementById('hintBtn');if(hb)hb.addEventListener('click',()=>{hb.outerHTML=`<p class="hint">Hint: ${esc(b.h)}</p>`})}

/* multiple choice + true/false */
function renderChoice(it){
  const tf=it.type==='tf', L=tf?['T','F']:['A','B','C','D'];
  document.getElementById('card').innerHTML=`
    <span class="tag">${tf?'True or false':'Multiple choice'}</span>
    <p class="prompt">${esc(it.b.q)}</p>${diag(it.b)}
    ${tf?`<div class="proposed"><span class="flabel">Suggested answer</span><p>${esc(it.shown)}</p></div><p class="keys" style="margin:0">Is this the correct answer?</p>`:''}
    <ul class="opts ${tf?'tf':''}">${it.opts.map((o,k)=>`<li><button class="opt" id="opt${k}" data-o="${k}" aria-pressed="false"><span class="letter">${L[k]}</span><span>${esc(o.t)}</span></button></li>`).join('')}</ul>
    ${hintHtml(it.b)}
    <div class="row end checkrow" id="checkRow"><span class="keys" id="pickNote">Choose an answer. You can change it before checking.</span><button class="btn" id="checkBtn" disabled>Check answer</button></div>
    <div id="after"></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.o)));
  document.getElementById('checkBtn').addEventListener('click',()=>{if(R&&R.sel!=null)checkChoice(R.sel)});
  bindHint(it.b);
  document.getElementById('opt0').focus({preventScroll:true});
}
function select(k){
  const it=R&&R.items[R.i]; if(!it||R.answered||!it.opts||!it.opts[k]) return;
  R.sel=k;
  document.querySelectorAll('.opt').forEach((b,n)=>{b.classList.toggle('selected',n===k);b.setAttribute('aria-pressed',String(n===k))});
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('pickNote').textContent=`${it.type==='tf'?(k===0?'True':'False'):'Answer '+"ABCD"[k]} selected. Change it or check your answer.`;
}
function checkChoice(k){
  if(!R||R.answered) return; R.answered=true;
  const it=R.items[R.i], ok=it.opts[k].ok;
  document.getElementById('checkRow').remove();
  document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;b.classList.remove('selected');b.removeAttribute('aria-pressed');
    b.classList.add(it.opts[n].ok?'correct':n===k?'wrong':'dim')});
  let extra='';
  if(it.type==='tf'&&!it.truth) extra=`<b>The correct answer is:</b> ${esc(it.b.a)}. `;
  mark(ok,it.b,extra);
}
function mark(ok,b,extra){
  R.done++;
  if(ok) R.score++; else R.missed.push({q:b.q,a:b.a,e:b.e});
  showAfter(ok,(extra||'')+esc(b.e));
}
function showAfter(ok,html,label){
  updateHud();
  const last=R.i===R.items.length-1;
  document.getElementById('after').innerHTML=`
    <div class="feedback ${ok===null?'':ok?'good':'bad'}"><strong>${label||(ok?pick(PRAISE):pick(NUDGE))}</strong>${html}</div>
    <div class="row end" style="margin-top:14px"><button class="btn" id="nextBtn">${last?'See my results':'Next question'}</button></div>`;
  const nb=document.getElementById('nextBtn'); nb.addEventListener('click',next); nb.focus({preventScroll:true});
}

/* written answers */
const STOP=new Set("the a an and or of to in on for with by from is are was were be been it its this that these those as at which who what when where why how than then into out over not no can could would should will may might has have had do does did their there they them his her he she you your our we also only very more most less such each every some any all".split(' '));
const words=s=>String(s).toLowerCase().replace(/[^a-z0-9.%\s]/g,' ').split(/\s+/).map(w=>w.replace(/\.$/,'')).filter(w=>w&&(w.length>2||/\d/.test(w))&&!STOP.has(w));
function similarity(user,model){
  const key=[...new Set(words(model))], u=words(user);
  if(!key.length) return 0;
  const nums=key.filter(w=>/\d/.test(w));
  if(nums.length&&!nums.every(n=>u.includes(n))) return 0;
  const hit=key.filter(w=>u.some(x=>x===w||(x.length>3&&w.length>3&&x.slice(0,5)===w.slice(0,5))));
  return hit.length/key.length;
}
function renderWrite(it){
  document.getElementById('card').innerHTML=`
    <span class="tag">Written answer</span>
    <p class="prompt">${esc(it.b.q)}</p>${diag(it.b)}
    <label class="flabel" for="writeBox">Your answer</label>
    <textarea id="writeBox" rows="3" placeholder="Type your answer in your own words…"></textarea>
    ${hintHtml(it.b)}
    <div class="row end checkrow" id="checkRow"><span class="keys">Press Check to compare with the model answer.</span><button class="btn" id="checkBtn" disabled>Check answer</button></div>
    <div id="after"></div>`;
  const box=document.getElementById('writeBox'), cb=document.getElementById('checkBtn');
  box.addEventListener('input',()=>{cb.disabled=!box.value.trim()});
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&box.value.trim()){e.preventDefault();cb.click()}});
  cb.addEventListener('click',()=>checkWrite(it,box.value));
  bindHint(it.b); box.focus({preventScroll:true});
}
function checkWrite(it,val){
  if(R.answered) return; R.answered=true;
  document.getElementById('checkRow').remove();
  const box=document.getElementById('writeBox'); box.readOnly=true;
  const sim=similarity(val,it.b.a), likely=sim>=0.6;
  document.getElementById('after').innerHTML=`
    <div class="model"><span class="flabel">Model answer</span><p>${esc(it.b.a)}</p><p class="keys" style="margin:0">${esc(it.b.e)}</p></div>
    <p class="keys" style="margin:0">${likely?'Your answer looks like it matches. Confirm below.':'Your answer looks different from the model answer. Compare them and decide.'}</p>
    <div class="row selfmark"><button class="btn ${likely?'':'ghost'}" id="gotRight">I got it right</button><button class="btn ${likely?'ghost':''}" id="gotWrong">I got it wrong</button></div>`;
  const fin=ok=>{R.done++;if(ok)R.score++;else R.missed.push({q:it.b.q,a:it.b.a,e:it.b.e});
    document.querySelector('.selfmark').remove();
    const last=R.i===R.items.length-1; updateHud();
    document.getElementById('after').insertAdjacentHTML('beforeend',`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Marked correct.':'Marked incorrect.'}</strong>${ok?'Nice work.':'Have another look at the model answer.'}</div><div class="row end" style="margin-top:14px"><button class="btn" id="nextBtn">${last?'See my results':'Next question'}</button></div>`);
    const nb=document.getElementById('nextBtn'); nb.addEventListener('click',next); nb.focus({preventScroll:true})};
  document.getElementById('gotRight').addEventListener('click',()=>fin(true));
  document.getElementById('gotWrong').addEventListener('click',()=>fin(false));
  document.getElementById(likely?'gotRight':'gotWrong').focus({preventScroll:true});
}

/* matching */
function renderMatch(it){
  document.getElementById('card').innerHTML=`
    <span class="tag">Matching · ${it.set.length} points</span>
    <p class="prompt" style="font-size:19px">Match each question to its answer.</p>
    <p class="keys" style="margin:0">Tap a question, then tap its answer. Tap a pair again to change it.</p>
    <div class="match">
      <ol class="mq">${it.set.map((b,i)=>`<li><button class="mitem" data-p="${i}" id="mp${i}"><span class="mnum">${i+1}</span><span class="mtxt">${esc(b.q)}</span><span class="mpair" id="mpair${i}"></span></button></li>`).join('')}</ol>
      <ul class="ma">${it.answers.map((a,j)=>`<li><button class="mitem ans" data-a="${j}" id="ma${j}"><span class="mnum">${"ABCDE"[j]}</span><span class="mtxt">${esc(a.t)}</span><span class="mpair" id="mapair${j}"></span></button></li>`).join('')}</ul>
    </div>
    <div class="row end checkrow" id="checkRow"><span class="keys" id="pickNote">0 of ${it.set.length} matched</span><button class="btn" id="checkBtn" disabled>Check matches</button></div>
    <div id="after"></div>`;
  const paint=()=>{
    const ansOf={}; Object.entries(it.pairs).forEach(([p,a])=>ansOf[a]=+p);
    it.set.forEach((_,i)=>{const el=document.getElementById('mp'+i);el.classList.toggle('active',it.active===i);el.classList.toggle('paired',it.pairs[i]!=null);document.getElementById('mpair'+i).textContent=it.pairs[i]!=null?'→ '+"ABCDE"[it.pairs[i]]:''});
    it.answers.forEach((_,j)=>{const el=document.getElementById('ma'+j);el.classList.toggle('paired',ansOf[j]!=null);document.getElementById('mapair'+j).textContent=ansOf[j]!=null?'← '+(ansOf[j]+1):''});
    const n=Object.keys(it.pairs).length;
    document.getElementById('pickNote').textContent=`${n} of ${it.set.length} matched`;
    document.getElementById('checkBtn').disabled=n<it.set.length;
  };
  document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{if(R.answered)return;const i=+b.dataset.p;
    if(it.pairs[i]!=null&&it.active!==i){delete it.pairs[i];it.active=i}else it.active=it.active===i?null:i;paint()}));
  document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{if(R.answered)return;const j=+b.dataset.a;
    const owner=Object.keys(it.pairs).find(p=>it.pairs[p]===j);
    if(it.active==null){ if(owner!=null){delete it.pairs[owner];it.active=+owner} else {const free=it.set.findIndex((_,i)=>it.pairs[i]==null); if(free>=0){it.pairs[free]=j}} }
    else{ if(owner!=null) delete it.pairs[owner]; it.pairs[it.active]=j; const nxt=it.set.findIndex((_,i)=>it.pairs[i]==null); it.active=nxt>=0?nxt:null; }
    paint()}));
  document.getElementById('checkBtn').addEventListener('click',()=>checkMatch(it));
  it.active=0; paint(); document.getElementById('mp0').focus({preventScroll:true});
}
function checkMatch(it){
  if(R.answered) return; R.answered=true;
  document.getElementById('checkRow').remove();
  let right=0;
  it.set.forEach((b,i)=>{
    const ok=it.answers[it.pairs[i]].i===i; if(ok) right++; else R.missed.push({q:b.q,a:b.a,e:b.e});
    const el=document.getElementById('mp'+i); el.classList.remove('active'); el.classList.add(ok?'correct':'wrong');
    const correctLetter="ABCDE"[it.answers.findIndex(a=>a.i===i)];
    document.getElementById('mpair'+i).textContent=ok?'✓ '+correctLetter:`✗ ${"ABCDE"[it.pairs[i]]} · correct: ${correctLetter}`;
  });
  document.querySelectorAll('.mitem').forEach(b=>b.disabled=true);
  R.score+=right; R.done+=it.set.length;
  showAfter(right===it.set.length,`You matched ${right} of ${it.set.length} correctly.`,right===it.set.length?'All matched!':right?'Some right.':'Not this time.');
}

/* flashcards (practice only) */
function renderFlash(it){
  document.getElementById('card').innerHTML=`
    <span class="tag">Flashcard${it.tries?' · again':''}</span>
    <div class="flash" id="flashCard"><span class="flabel">Question</span><p class="prompt">${esc(it.b.q)}</p>${diag(it.b)}</div>
    <div class="row end" id="flipRow"><button class="btn" id="flipBtn">Show answer</button></div>
    <div id="after"></div>`;
  const flip=()=>{
    if(R.answered) return; R.answered=true;
    document.getElementById('flipRow').remove();
    document.getElementById('flashCard').insertAdjacentHTML('beforeend',`<div class="model"><span class="flabel">Answer</span><p>${esc(it.b.a)}</p><p class="keys" style="margin:0">${esc(it.b.e)}</p></div>`);
    document.getElementById('after').innerHTML=`<div class="row selfmark"><button class="btn ghost" id="stillBtn">Still learning</button><button class="btn" id="knowBtn">Got it</button></div>`;
    document.getElementById('knowBtn').addEventListener('click',()=>{R.known++;if(!it.tries)R.score++;next()});
    document.getElementById('stillBtn').addEventListener('click',()=>{if(!it.tries)R.missed.push({q:it.b.q,a:it.b.a,e:it.b.e});if(it.tries<2)R.items.push({...it,tries:it.tries+1});next()});
    document.getElementById('knowBtn').focus({preventScroll:true});
  };
  document.getElementById('flipBtn').addEventListener('click',flip);
  document.getElementById('flipBtn').focus({preventScroll:true});
}

function next(){
  if(!R) return;
  R.i++;
  if(R.fmt==='timed'&&R.i>=R.items.length){R.items.push(...shuffle(R.qsSrc).map(b=>mkMC({...b,q:Array.isArray(b.q)?pick(b.q):b.q})))}
  if(R.i<R.items.length) renderItem(); else finish();
}
function finish(timeUp){
  if(!R) return;
  VIEW="results"; stopTimer();
  const isTest=R.mode==='test', flash=R.fmt==='flash', timed=R.fmt==='timed';
  const total=timed?R.done:flash?R.items.filter(it=>!it.tries).length:R.total;
  if(isTest&&total>0){
    TESTS.push({t:Date.now(),s:R.s.id,topic:R.topic,quiz:R.title,id:R.bestId,fmt:R.fmt,score:R.score,total,secs:Math.round((Date.now()-R.start)/1000)});
    saveTests();
  }
  document.getElementById('progress').hidden=true; document.getElementById('keys').hidden=true;
  const pct=total?Math.round(R.score/total*100):0;
  const msg=timed?(timeUp?"Time's up! ":"")+`You answered ${R.done} question${R.done===1?'':'s'} in ${TIMED_SECS} seconds.`:flash?`You knew ${R.score} of ${total} cards on the first go.`:pct===100?"Perfect score.":pct>=75?"Great work. Check the ones you missed below.":pct>=50?"Good start. Review the missed questions and try again.":"Keep practising. Read the explanations below, then have another go.";
  document.getElementById('card').innerHTML=`
    <span class="tag">${isTest?'Test results':flash?'Flashcard results':'Practice results'} · ${esc(fmtName(R.fmt))}</span>
    <p class="score">${R.score}<span style="font-size:28px;color:var(--muted)"> / ${total}</span> <span style="font-size:24px;color:var(--muted)">${pct}%</span></p>
    <p style="margin:0">${msg}</p>
    <p class="keys" style="margin:0">${isTest?(total?'This test has been saved to your analytics.':'No questions were answered, so nothing was saved.'):'Practice rounds aren\'t recorded in your stats.'}</p>
    ${R.missed.length?`<div><p style="font-weight:700;margin:0 0 8px">${flash?'Cards to revise':'Questions to review'}</p><ul class="review">${R.missed.map(m=>`<li><p class="q">${esc(m.q)}</p><p class="a"><b>Answer:</b> ${esc(m.a)}. ${esc(m.e)}</p></li>`).join('')}</ul></div>`:''}
    <div class="row"><button class="btn" id="againBtn">Play again</button><button class="btn ghost" id="toSubj">Back to ${esc(R.s.name)}</button>${isTest&&total?'<button class="btn ghost" id="toAna">View analytics</button>':''}</div>`;
  const s=R.s, title=R.title, id=R.bestId, topic=R.topic;
  const pool=R.pool, src=s.quizzes.find(q=>q.title===title);
  document.getElementById('againBtn').addEventListener('click',()=>{R=null;chooseMode(s,title,pool?shuffle(pool).slice(0,15):src.qs,id,pool,topic)});
  document.getElementById('toSubj').addEventListener('click',()=>{R=null;subject(s.id)});
  const ta=document.getElementById('toAna'); if(ta) ta.addEventListener('click',()=>{R=null;analytics()});
  document.getElementById('againBtn').focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{
  if(!R||VIEW!=='quiz'||!document.getElementById('card')) return;
  if(/^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  const it=R.items[R.i]; if(!it) return;
  if(it.type==='flash'&&e.key===' '&&!R.answered){const f=document.getElementById('flipBtn');if(f){e.preventDefault();f.click()}return}
  if(R.answered||!(it.type==='mc'||it.type==='tf')) return;
  let k=null;
  if(it.type==='tf'){if(/^[t1]$/i.test(e.key))k=0;else if(/^[f2]$/i.test(e.key))k=1}
  else{const n=parseInt(e.key,10);if(n>=1&&n<=4)k=n-1}
  if(k!=null){e.preventDefault();select(k);document.getElementById('checkBtn').focus({preventScroll:true})}
});



/* ---------- maths diagrams ---------- */
const DG=(()=>{
  const f=n=>Math.round(n*10)/10;
  const svg=(w,h,inner,label)=>`<svg class="dg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label||'Diagram'}">${inner}</svg>`;
  const T=(x,y,t,a='middle')=>`<text x="${f(x)}" y="${f(y)}" text-anchor="${a}" dominant-baseline="middle">${t}</text>`;
  const L=(x1,y1,x2,y2,c='ln')=>`<line class="${c}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`;
  const unit=(x,y)=>{const l=Math.hypot(x,y)||1;return[x/l,y/l]};
  // right-angle mark at corner v with arms toward a and b
  const RA=(v,a,b,s=9)=>{const[u1x,u1y]=unit(a[0]-v[0],a[1]-v[1]),[u2x,u2y]=unit(b[0]-v[0],b[1]-v[1]);
    return `<path class="ra" d="M${f(v[0]+u1x*s)} ${f(v[1]+u1y*s)} L${f(v[0]+u1x*s+u2x*s)} ${f(v[1]+u1y*s+u2y*s)} L${f(v[0]+u2x*s)} ${f(v[1]+u2y*s)}"/>`};
  // label placed outside the middle of edge p→q, relative to centre c
  const EL=(p,q,t,c,off=10)=>{const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;let[nx,ny]=unit(q[1]-p[1],-(q[0]-p[0]));
    if((mx-c[0])*nx+(my-c[1])*ny<0){nx=-nx;ny=-ny}
    const a=nx>0.45?'start':nx<-0.45?'end':'middle';const o=Math.abs(ny)>0.45?off+3:off;return T(mx+nx*o,my+ny*o,t,a)};
  // polygon with edge labels and optional right-angle corners
  const poly=(pts,labels=[],ras=[],cls='sh')=>{const n=pts.length,c=[pts.reduce((s,p)=>s+p[0],0)/n,pts.reduce((s,p)=>s+p[1],0)/n];
    let s=`<polygon class="${cls}" points="${pts.map(p=>p.map(f).join(',')).join(' ')}"/>`;
    ras.forEach(i=>{s+=RA(pts[i],pts[(i-1+n)%n],pts[(i+1)%n])});
    labels.forEach((t,i)=>{if(t)s+=EL(pts[i],pts[(i+1)%n],t,c)});return s};
  const pt=(cx,cy,r,deg)=>[cx+r*Math.cos(deg*Math.PI/180),cy-r*Math.sin(deg*Math.PI/180)];
  const arc=(cx,cy,r,a0,a1)=>{const p0=pt(cx,cy,r,a0),p1=pt(cx,cy,r,a1);return `M${f(p0[0])} ${f(p0[1])} A${r} ${r} 0 ${a1-a0>180?1:0} 0 ${f(p1[0])} ${f(p1[1])}`};
  const dot=(x,y)=>`<circle class="dot" cx="${f(x)}" cy="${f(y)}" r="2.6"/>`;

  const D={};
  D.rect=(wl,hl,W=160,H=100)=>svg(W+130,H+60,poly([[60,25],[60+W,25],[60+W,25+H],[60,25+H]],[null,hl,wl,null],[0,1,2,3]),'Rectangle');
  D.square=s=>svg(240,170,poly([[70,25],[180,25],[180,135],[70,135]],[null,s,s,null],[0,1,2,3]),'Square');
  D.tri=(a,b,base,pts=[[120,20],[50,140],[190,140]])=>svg(250,170,poly(pts,[a,base,b]),'Triangle');
  D.triDown=(top,a,b)=>svg(260,170,poly([[50,25],[210,25],[130,145]],[top,a,b]),'Triangle');
  D.rightTri=(v,h,hyp)=>svg(260,170,poly([[60,140],[60,30],[210,140]],[v,hyp,h],[0]),'Right-angled triangle');
  D.kite=(s,l)=>svg(250,180,poly([[125,18],[175,62],[125,160],[75,62]],[s,l,l,s]),'Kite');
  D.Lshape=(hl,wl)=>{const p=[[70,20],[125,20],[125,95],[205,95],[205,150],[70,150]];return svg(260,180,poly(p,[null,null,null,null,wl,hl],[0,1,3,4,5])+`<path class="ra" d="M${125+9} 95 v-9 h-9"/>`,'L-shaped figure')};
  D.quad=(pts,labels,ras)=>svg(250,170,poly(pts,labels,ras),'Four-sided shape');
  D.regular=(n,lab)=>{const c=[125,88],r=62,p=[];for(let i=0;i<n;i++)p.push(pt(c[0],c[1],r,90+180/n+i*360/n));return svg(250,175,poly(p,[null,null,null,lab]),'Regular polygon')};
  D.frame=()=>svg(310,190,`<rect class="sh" x="40" y="20" width="220" height="150"/><rect class="hole" x="64" y="44" width="172" height="102"/>`+T(150,58,'20 cm')+T(78,95,'12 cm','start')+L(236,95,260,95,'ds')+T(266,95,'3 cm','start'),'Photo inside a frame');
  D.circle=(lab,mode='r')=>{const c=[125,88],r=62;return svg(250,175,`<circle class="sh" cx="${c[0]}" cy="${c[1]}" r="${r}"/>`+(mode==='r'?L(c[0],c[1],c[0]+r,c[1],'ds')+T(c[0]+r/2,c[1]-11,lab):L(c[0]-r,c[1],c[0]+r,c[1],'ds')+T(c[0],c[1]-11,lab))+dot(c[0],c[1]),'Circle')};
  D.sector=(th,lab,a0=0)=>{const c=[125,95],r=68,p0=pt(c[0],c[1],r,a0);
    let s=`<path class="sh" d="M${c[0]} ${c[1]} L${f(p0[0])} ${f(p0[1])} ${arc(c[0],c[1],r,a0,a0+th).replace(/^M[^A]+/,'')} Z"/>`;
    s+=th===90?RA(c,p0,pt(c[0],c[1],r,a0+90),11):`<path class="ra" d="${arc(c[0],c[1],15,a0,a0+th)}"/>`+T(...pt(c[0],c[1],34,a0+th/2),th+'°');
    const m=pt(c[0],c[1],r/2,a0);s+=T(m[0],m[1]+12,lab);return svg(250,180,s+dot(c[0],c[1]),'Sector')};
  D.semi=lab=>{const c=[125,130],r=85;return svg(250,160,`<path class="sh" d="M${c[0]-r} ${c[1]} A${r} ${r} 0 0 1 ${c[0]+r} ${c[1]} Z"/>`+L(c[0],c[1],c[0]+r,c[1],'ds')+T(c[0]+r/2,c[1]+14,lab)+dot(...c),'Semicircle')};
  D.triArea=(b,h,apx=150)=>{const p=[[40,140],[220,140],[apx,30]];return svg(260,170,poly(p,[b,null,null])+L(apx,30,apx,140,'ds')+RA([apx,140],[apx,30],[220,140])+T(apx+8,88,h,'start'),'Triangle')};
  D.para=(b,h)=>svg(260,160,poly([[40,130],[170,130],[220,35],[90,35]],[b])+L(90,35,90,130,'ds')+RA([90,130],[90,35],[170,130])+T(98,85,h,'start'),'Parallelogram');
  D.trap=(a,b,h,top=[[80,35],[175,35]],bot=[[35,135],[225,135]],hx=top[1][0]-4)=>{const p=[top[0],top[1],bot[1],bot[0]];const left=hx<130;
    return svg(260,165,poly(p,[a,null,b,null])+L(hx,35,hx,135,'ds')+RA([hx,135],[hx,35],[left?hx+30:hx-30,135])+T(left?hx+6:hx-6,88,h,left?'start':'end'),'Trapezium')};
  D.diag=(x,y,kite)=>{const p=kite?[[125,18],[195,62],[125,160],[55,62]]:[[125,18],[195,88],[125,158],[55,88]];const my=p[1][1];
    return svg(250,180,poly(p)+L(p[0][0],p[0][1],p[2][0],p[2][1],'ds')+L(p[3][0],my,p[1][0],my,'ds')+T(131,my+25,x,'start')+T((p[3][0]+125)/2+8,my+12,y),kite?'Kite':'Rhombus')};
  D.rectSemi=(lw,lh)=>{const x0=95,y0=30,W=145,H=110,r=H/2;
    return svg(270,170,`<path class="sh" d="M${x0} ${y0} H${x0+W} V${y0+H} H${x0} A${r} ${r} 0 0 1 ${x0} ${y0} Z"/>`+L(x0,y0,x0,y0+H,'ds')+RA([x0+W,y0],[x0,y0],[x0+W,y0+H])+RA([x0+W,y0+H],[x0+W,y0],[x0,y0+H])+T(x0+W/2,y0-12,lw)+T(x0+W+8,y0+H/2,lh,'start')+dot(x0,y0+r),'Rectangle with a semicircle attached')};
  D.rectCut=(lw,lh)=>{const x0=40,y0=30,W=170,H=110,r=H/2;
    return svg(270,170,`<path class="sh" d="M${x0} ${y0} H${x0+W} A${r} ${r} 0 0 0 ${x0+W} ${y0+H} H${x0} Z"/>`+L(x0+W,y0,x0+W,y0+H,'ds')+RA([x0,y0],[x0+W,y0],[x0,y0+H])+RA([x0,y0+H],[x0,y0],[x0+W,y0+H])+T(x0+W/2,y0-12,lw)+T(x0-8,y0+H/2,lh,'end')+dot(x0+W,y0+r),'Rectangle with a semicircle cut out')};
  D.squareQuad=l=>{const x0=40,y0=40,s=100;return svg(270,170,`<path class="sh" d="M${x0} ${y0} H${x0+s} A${s} ${s} 0 0 1 ${x0+2*s} ${y0+s} H${x0} Z"/>`+L(x0+s,y0,x0+s,y0+s,'ds')+RA([x0,y0],[x0+s,y0],[x0,y0+s])+RA([x0,y0+s],[x0,y0],[x0+s,y0+s])+T(x0+s/2,y0-12,l)+T(x0+s-6,y0+s/2,l,'end')+T(x0+1.5*s,y0+s+14,l),'Square with a quarter circle attached')};
  D.squareCorner=()=>{const p=[[50,25],[150,25],[180,55],[180,155],[50,155]];return svg(240,185,poly(p,[null,null,'6 cm','6 cm',null],[0,3,4])+`<path class="ds" d="M150 25 H180 V55"/>`+T(165,15,'2 cm')+T(188,40,'2 cm','start'),'Square with a corner cut off')};
  D.rectTri=()=>svg(280,150,`<rect class="sh" x="40" y="30" width="200" height="80"/><polygon class="hole" points="40,110 240,110 150,30"/>`+T(140,126,'12 cm')+T(248,70,'4 cm','start')+RA([40,30],[240,30],[40,110])+RA([240,30],[40,30],[240,110]),'Rectangle with a triangle removed');
  D.cuboid=(l,w,h,W=130,H=80,dx=45,dy=-32)=>{const x=40,y=60-dy*0,Y=y+H;
    const fr=[[x,y],[x+W,y],[x+W,Y],[x,Y]];
    let s=poly(fr)+`<polygon class="sh2" points="${x},${y} ${x+dx},${y+dy} ${x+W+dx},${y+dy} ${x+W},${y}"/><polygon class="sh2" points="${x+W},${y} ${x+W+dx},${y+dy} ${x+W+dx},${Y+dy} ${x+W},${Y}"/>`;
    s+=`<path class="ds" d="M${x} ${Y} L${x+dx} ${Y+dy} L${x+W+dx} ${Y+dy} M${x+dx} ${Y+dy} V${y+dy}"/>`;
    s+=T(x+W/2,Y+14,l)+T(x-8,(y+Y)/2,h,'end')+T(x+W+dx/2+8,Y+dy/2+8,w,'start');return svg(W+dx+110,H-dy+60,s,'Rectangular prism')};
  D.pyramid=(b,h)=>{const fl=[50,150],fr=[170,150],br=[215,112],bl=[95,112],ap=[132,22],m=[110,150];
    let s=`<polygon class="sh2" points="${fr} ${br} ${ap}"/><polygon class="sh" points="${fl} ${fr} ${ap}"/>`+`<path class="ds" d="M${fl} L${bl} L${br} M${bl} L${ap}"/>`+`<path class="ln" d="M${fr} L${br}"/>`;
    s+=L(ap[0],ap[1],m[0],m[1],'ds')+RA(m,ap,fr,8)+T(m[0],m[1]+14,b)+T(br[0]-14,br[1]+30,b)+T(118,130,h,'start');return svg(260,180,s,'Square-based pyramid')};
  D.cyl=(rl,hl)=>{const cx=125,rx=62,ry=16,yt=38,yb=140;
    let s=`<path class="sh" d="M${cx-rx} ${yt} V${yb} A${rx} ${ry} 0 0 0 ${cx+rx} ${yb} V${yt} Z"/><ellipse class="sh2" cx="${cx}" cy="${yt}" rx="${rx}" ry="${ry}"/><path class="ds" d="M${cx-rx} ${yb} A${rx} ${ry} 0 0 1 ${cx+rx} ${yb}"/>`;
    s+=L(cx,yt,cx+rx,yt,'ds')+dot(cx,yt)+T(cx+rx/2,yt-26,rl)+T(cx+rx+8,(yt+yb)/2,hl,'start');return svg(260,175,s,'Cylinder')};
  D.cylSide=(dl,ll,rad)=>{const yc=88,ry=55,rx=17,x0=60,x1=200;
    let s=`<path class="sh" d="M${x0} ${yc-ry} H${x1} A${rx} ${ry} 0 0 1 ${x1} ${yc+ry} H${x0} Z"/><ellipse class="sh2" cx="${x0}" cy="${yc}" rx="${rx}" ry="${ry}"/><path class="ds" d="M${x1} ${yc-ry} A${rx} ${ry} 0 0 0 ${x1} ${yc+ry}"/>`;
    s+=(rad?L(x0,yc,x0,yc-ry,'ds')+dot(x0,yc)+T(x0-rx-6,yc-ry/2,dl,'end'):L(x0,yc-ry,x0,yc+ry,'ds')+T(x0-rx-6,yc,dl,'end'))+T((x0+x1)/2,yc+ry+14,ll);return svg(260,175,s,'Cylinder on its side')};
  D.halfCyl=(dl,ll)=>{const c=[78,135],r=48,dx=95,dy=-42,c2=[c[0]+dx,c[1]+dy];
    const t1=[c[0]-r*0.404,c[1]-r*0.915],t2=[t1[0]+dx,t1[1]+dy];
    let s=`<path class="sh2" d="M${f(t1[0])} ${f(t1[1])} L${f(t2[0])} ${f(t2[1])} A${r} ${r} 0 0 1 ${c2[0]+r} ${c2[1]} L${c[0]+r} ${c[1]} Z"/>`;
    s+=`<path class="sh" d="M${c[0]-r} ${c[1]} A${r} ${r} 0 0 1 ${c[0]+r} ${c[1]} Z"/>`+`<path class="ds" d="M${c[0]-r} ${c[1]} l${dx} ${dy} h${2*r} M${c2[0]-r} ${c2[1]} A${r} ${r} 0 0 1 ${f(t2[0])} ${f(t2[1])}"/>`;
    s+=T(c[0],c[1]+14,dl)+T(c[0]+r+dx/2+8,c[1]+dy/2+8,ll,'start');return svg(280,170,s,'Half cylinder')};
  D.triPrism=(b,h,l)=>{const A=[40,145],B=[150,145],C=[100,65],dx=85,dy=-40,o=p=>[p[0]+dx,p[1]+dy];
    let s=`<polygon class="sh2" points="${C} ${o(C)} ${o(B)} ${B}"/><polygon class="sh" points="${A} ${B} ${C}"/>`+`<path class="ds" d="M${A} L${o(A)} L${o(B)} M${o(A)} L${o(C)}"/>`;
    s+=L(C[0],C[1],C[0],A[1],'ds')+RA([C[0],A[1]],C,B,8)+T((A[0]+B[0])/2,A[1]+14,b)+T(C[0]+6,130,h,'start')+T(B[0]+dx/2+8,B[1]+dy/2+8,l,'start');return svg(280,175,s,'Triangular prism')};
  D.blob=(a,h)=>{let s=`<path class="sh" d="M60 140 V55 C60 20 120 25 150 40 C185 55 200 35 200 70 V150 C200 165 120 165 60 140 Z"/><path class="sh2" d="M60 55 C60 20 120 25 150 40 C185 55 200 35 200 70 C200 95 140 80 110 80 C80 80 60 75 60 55 Z"/>`;
    s+=T(130,60,'Area = '+a)+L(225,62,225,150,'ds')+T(232,106,h,'start');return svg(290,175,s,'Solid with a uniform cross-section')};
  return D;
})();

const CALC={ans:0,open:false};
try{CALC.open=localStorage.getItem('studyhub.calcOpen')==='1'}catch(e){}
function calcEval(src){
  let x=String(src).replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/Ans/gi,'A');
  if(!x) return null;
  x=x.replace(/(\d|\)|π|A|²)(?=[(π√A\d])/g,(m,a,o,str)=>/\d/.test(a)&&/\d/.test(str[o+1])?a:a+'*');
  x=x.replace(/²/g,'**2').replace(/\^/g,'**').replace(/π/g,'(Math.PI)').replace(/√/g,'Math.sqrt').replace(/A/g,'('+CALC.ans+')');
  if(/[^0-9+\-*/().eMathPIsqrt]/.test(x)) throw new Error('bad');
  if(/[a-zA-Z]/.test(x.replace(/Math\.PI|Math\.sqrt|\de[+-]?\d/g,''))) throw new Error('bad');
  const v=Function('"use strict";return ('+x+')')();
  if(typeof v!=='number'||!isFinite(v)) throw new Error('bad');
  return v;
}
const calcFmt=v=>{const r=+v.toPrecision(12);return Math.abs(r)>=1e12||(r!==0&&Math.abs(r)<1e-9)?r.toExponential(6):String(r)};
function mountCalc(){
  const keys=[['AC','fn'],['⌫','fn'],['(','op'],[')','op'],['÷','op'],
              ['7'],['8'],['9'],['x²','op'],['×','op'],
              ['4'],['5'],['6'],['√','op'],['−','op'],
              ['1'],['2'],['3'],['π','op'],['+','op'],
              ['0'],['.'],['Ans','op'],['^','op'],['=','eq']];
  app.insertAdjacentHTML('beforeend',`
    <button class="calcbtn" id="calcToggle" aria-expanded="false" aria-controls="calcPanel">🧮 Calculator</button>
    <section class="calc" id="calcPanel" hidden aria-label="Calculator">
      <div class="chead"><span>Calculator · type or tap</span><button id="calcClose">Close</button></div>
      <div class="disp"><div class="prev" id="calcPrev"></div><input id="calcIn" inputmode="none" autocomplete="off" spellcheck="false" aria-label="Calculation"><div class="res" id="calcRes"></div></div>
      <div class="keys5">${keys.map(([k,c])=>`<button type="button" class="${c||''}" data-k="${k}">${k}</button>`).join('')}</div>
    </section>`);
  const panel=document.getElementById('calcPanel'),tog=document.getElementById('calcToggle'),inp=document.getElementById('calcIn'),res=document.getElementById('calcRes'),prev=document.getElementById('calcPrev');
  const isTouch=matchMedia('(pointer:coarse)').matches; if(!isTouch) inp.removeAttribute('inputmode');
  const set=open=>{CALC.open=open;panel.hidden=!open;tog.setAttribute('aria-expanded',open);tog.textContent=open?'✕ Hide calculator':'🧮 Calculator';document.body.classList.toggle('calc-open',open);try{localStorage.setItem('studyhub.calcOpen',open?'1':'0')}catch(e){};if(open&&!isTouch)inp.focus({preventScroll:true})};
  const preview=()=>{try{const v=calcEval(inp.value);res.textContent=v==null?'':'= '+calcFmt(v)}catch(e){res.textContent=''}};
  const equals=()=>{if(!inp.value.trim())return;try{const v=calcEval(inp.value);CALC.ans=v;prev.textContent=inp.value+' ='; inp.value=calcFmt(v);res.textContent='';}catch(e){res.textContent='Error'}};
  const ins=t=>{inp.value+=t;preview()};
  panel.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='AC'){inp.value='';res.textContent='';prev.textContent=''}
    else if(k==='⌫'){inp.value=inp.value.replace(/(Ans|.)$/,'');preview()}
    else if(k==='=') equals();
    else if(k==='x²') ins('²');
    else if(k==='√') ins('√(');
    else ins(k);
    if(!isTouch) inp.focus({preventScroll:true});
  }));
  inp.addEventListener('input',preview);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='='){e.preventDefault();equals()}else if(e.key==='Escape'){set(false);tog.focus()}});
  tog.addEventListener('click',()=>set(!CALC.open));
  document.getElementById('calcClose').addEventListener('click',()=>{set(false);tog.focus()});
  set(CALC.open);
}

function drawCharts(data,sel){
  drawLine(data,sel); drawBars(data,sel); drawActivity(data); drawWeak(data); drawHistory(data);
}
function domain(data){
  const rd=rangeDays();
  const end=dayStart(Date.now());
  let start=rd?end-(rd-1)*DAY:dayStart(Math.min(...data.map(t=>t.t)));
  if(start===end) start=end-DAY;
  return [start,end];
}
function drawLine(data,sel){
  const wrap=document.getElementById('lineWrap'); if(!wrap) return;
  const W=Math.max(280,wrap.clientWidth||640), H=240, m={l:40,r:14,t:12,b:30};
  const [x0,x1]=domain(data);
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), Y=v=>m.t+(1-v/100)*(H-m.t-m.b);
  const series=AF.view==='combined'
    ? [{id:'all',name:'All selected subjects',color:'var(--fg)',tests:data}]
    : sel.map(s=>({id:s.id,name:s.name,color:sColor(s.id),tests:data.filter(t=>t.s===s.id)})).filter(s=>s.tests.length);
  const legend=document.getElementById('lineLegend');
  legend.innerHTML=series.length>1?series.map(s=>`<span class="lg"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join(''):'';
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average test score per day">`;
  [0,25,50,75,100].forEach(v=>{svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${m.l-8}" y="${Y(v)+4}" class="axt" text-anchor="end">${v}%</text>`});
  const nT=Math.min(5,Math.max(2,Math.round((x1-x0)/DAY)+1));
  for(let i=0;i<nT;i++){const v=x0+(x1-x0)*i/(nT-1);svg+=`<text x="${X(v)}" y="${H-8}" class="axt" text-anchor="${i===0?'start':i===nT-1?'end':'middle'}">${fmtDay(v)}</text>`}
  let dots='';
  series.forEach(s=>{
    const by={}; s.tests.forEach(t=>{const k=dayStart(t.t);(by[k]=by[k]||[]).push(t)});
    const pts=Object.keys(by).map(Number).sort((a,b)=>a-b).map(k=>({k,n:by[k].length,v:Math.round(by[k].reduce((a,t)=>a+pctOf(t),0)/by[k].length)}));
    if(pts.length>1) svg+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>X(p.k)+','+Y(p.v)).join(' ')}"/>`;
    pts.forEach(p=>{
      const tip=`<b>${esc(s.name)}</b><br>${fmtDate(p.k)}<br>Average ${p.v}% · ${p.n} test${p.n>1?'s':''}`;
      dots+=`<circle cx="${X(p.k)}" cy="${Y(p.v)}" r="4.5" fill="${s.color}" class="mark"/><circle cx="${X(p.k)}" cy="${Y(p.v)}" r="12" class="hit" tabindex="0" data-tip="${esc(tip)}"/>`;
    });
  });
  wrap.innerHTML=svg+dots+`</svg><div class="tip" hidden></div>`;
  bindTips(wrap);
}
function drawBars(data,sel){
  const el=document.getElementById('subjBars'); if(!el) return;
  const rows=sel.map(s=>{const a=data.filter(t=>t.s===s.id);return a.length?{s,n:a.length,v:Math.round(a.reduce((x,t)=>x+pctOf(t),0)/a.length)}:null}).filter(Boolean);
  el.innerHTML=rows.map(r=>`<div class="brow"><span class="bname">${esc(r.s.name)}</span><span class="btrack"><span class="bfill" style="width:${Math.max(r.v,1)}%;background:${sColor(r.s.id)}" tabindex="0" data-tip="${esc(`<b>${esc(r.s.name)}</b><br>Average ${r.v}% across ${r.n} test${r.n>1?'s':''}`)}"></span></span><span class="bval">${r.v}% <span class="muted">(${r.n})</span></span></div>`).join('')+`<div class="tip" hidden></div>`;
  bindTips(el);
}
function drawActivity(data){
  const wrap=document.getElementById('actWrap'); if(!wrap) return;
  const [x0,x1]=domain(data);
  const days=Math.round((x1-x0)/DAY)+1, weekly=days>31;
  const step=weekly?7*DAY:DAY;
  const start=weekly?(()=>{const d=new Date(x0);const wd=(d.getDay()+6)%7;return x0-wd*DAY})():x0;
  const buckets=[]; for(let b=start;b<=x1;b+=step) buckets.push({k:b,n:0});
  data.forEach(t=>{const i=Math.floor((dayStart(t.t)-start)/step); if(buckets[i]) buckets[i].n++});
  document.getElementById('actSub').textContent=weekly?'Tests per week':'Tests per day';
  const W=Math.max(280,wrap.clientWidth||640), H=170, m={l:30,r:10,t:10,b:28};
  const maxN=Math.max(1,...buckets.map(b=>b.n)), top=Math.ceil(maxN/2)*2||2;
  const bw=(W-m.l-m.r)/buckets.length, gap=Math.min(4,bw*0.25);
  const Y=v=>m.t+(1-v/top)*(H-m.t-m.b);
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${weekly?'Tests per week':'Tests per day'}">`;
  [0,top/2,top].forEach(v=>{svg+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${m.l-6}" y="${Y(v)+4}" class="axt" text-anchor="end">${v}</text>`});
  const every=Math.ceil(buckets.length/6);
  buckets.forEach((b,i)=>{
    const x=m.l+i*bw+gap/2, w=Math.max(1,bw-gap), h=Y(0)-Y(b.n);
    if(b.n){const r=Math.min(4,w/2,h);svg+=`<path class="col" d="M${x},${Y(0)} V${Y(b.n)+r} Q${x},${Y(b.n)} ${x+r},${Y(b.n)} H${x+w-r} Q${x+w},${Y(b.n)} ${x+w},${Y(b.n)+r} V${Y(0)} Z"/>`}
    svg+=`<rect x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${H-m.t-m.b}" class="hit" tabindex="0" data-tip="${esc(`<b>${weekly?'Week of '+fmtDay(b.k):fmtDate(b.k)}</b><br>${b.n} test${b.n===1?'':'s'}`)}"/>`;
    if(i%every===0) svg+=`<text x="${m.l+i*bw+bw/2}" y="${H-8}" class="axt" text-anchor="middle">${fmtDay(b.k)}</text>`;
  });
  wrap.innerHTML=svg+`</svg><div class="tip" hidden></div>`;
  bindTips(wrap);
}
function drawWeak(data){
  const el=document.getElementById('weak'); if(!el) return;
  const by={}; data.forEach(t=>{(by[t.id]=by[t.id]||[]).push(t)});
  const rows=Object.values(by).map(a=>({t:a[a.length-1],n:a.length,v:Math.round(a.reduce((x,t)=>x+pctOf(t),0)/a.length)})).sort((a,b)=>a.v-b.v).slice(0,5);
  el.innerHTML=`<ul class="weak">${rows.map(r=>`<li><span class="dot" style="background:${sColor(r.t.s)}"></span><span class="wname"><b>${esc(r.t.quiz)}</b><span class="muted">${esc(subjName(r.t.s))} · ${esc(r.t.topic||'')}</span></span><span class="wval">${r.v}% <span class="muted">avg · ${r.n} test${r.n>1?'s':''}</span></span></li>`).join('')}</ul>`;
}
function drawHistory(data){
  const el=document.getElementById('histWrap'); if(!el) return;
  const rows=[...data].sort((a,b)=>b.t-a.t), shown=AF.showAll?rows:rows.slice(0,10);
  const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  el.innerHTML=`<table><thead><tr><th>Date</th><th>Subject</th><th>Quiz</th><th>Format</th><th class="num">Score</th><th class="num">%</th><th class="num">Time</th></tr></thead><tbody>
    ${shown.map(t=>`<tr><td>${fmtDate(t.t)}</td><td><span class="dot" style="background:${sColor(t.s)}"></span>${esc(subjName(t.s))}</td><td>${esc(t.quiz)}</td><td>${esc(fmtName(t.fmt||"mc"))}</td><td class="num">${t.score}/${t.total}</td><td class="num">${pctOf(t)}%</td><td class="num">${t.secs!=null?mmss(t.secs):'–'}</td></tr>`).join('')}
  </tbody></table>${rows.length>10?`<button class="hintbtn" id="moreHist">${AF.showAll?'Show fewer':'Show all '+rows.length+' tests'}</button>`:''}`;
  const mb=document.getElementById('moreHist'); if(mb) mb.addEventListener('click',()=>{AF.showAll=!AF.showAll;drawHistory(data)});
}
function bindTips(wrap){
  const tip=wrap.querySelector('.tip');
  const show=(el,x,y)=>{tip.innerHTML=el.dataset.tip;tip.hidden=false;
    const wr=wrap.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
    let lx=x-wr.left+12, ly=y-wr.top-th-12; if(lx+tw>wr.width) lx=x-wr.left-tw-12; if(lx<0) lx=0; if(ly<0) ly=y-wr.top+16;
    tip.style.left=lx+'px'; tip.style.top=ly+'px'};
  wrap.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('pointermove',e=>show(el,e.clientX,e.clientY));
    el.addEventListener('pointerleave',()=>{tip.hidden=true});
    el.addEventListener('focus',()=>{const r=el.getBoundingClientRect();show(el,r.left+r.width/2,r.top)});
    el.addEventListener('blur',()=>{tip.hidden=true});
  });
}
let rz; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(VIEW==='analytics'&&TESTS.length){const d=filtered();if(d.length){const ts=orderedSubjects().filter(s=>TESTS.some(t=>t.s===s.id));drawLine(d,AF.subs?ts.filter(s=>AF.subs.has(s.id)):ts);drawActivity(d)}}},150)});

home();
</script>
